<text x="50" y="100" class="title" text-anchor="start">The weekend cascade</text>
<text x="50" y="128" class="deck" text-anchor="start">Three weekend starts committed on Friday, and what each one did to the week that followed.</text>
<line x1="50" y1="150" x2="2550" y2="150" stroke="#C9CCC5" stroke-width="1.4"/>

<text x="36" y="224" class="trg" text-anchor="start">TRIGGER</text>

<text x="168.0" y="289.5" class="ct" text-anchor="middle" fill="#1B211E">Friday, 4pm</text>
<text x="168.0" y="306.5" class="ct" text-anchor="middle" fill="#1B211E">three weekend starts</text>
<line x1="306" y1="293" x2="344" y2="293" class="ln" marker-end="url(#ar)"/>
<rect x="320" y="190" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="224" class="band" text-anchor="start">1  ·  FRIDAY   ·   THREE WEEKEND STARTS COMMITTED</text>
<text x="2004" y="224" class="bandhi" text-anchor="end">THE WEEKEND IS PLANNED ON FRIDAY AFTERNOON</text>
<rect x="320" y="504" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="538" class="band" text-anchor="start">2  ·  SATURDAY</text>
<text x="2004" y="538" class="bandhi" text-anchor="end">ONE OF TWO STARTS</text>
<rect x="320" y="818" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="852" class="band" text-anchor="start">3  ·  SUNDAY</text>
<text x="2004" y="852" class="bandhi" text-anchor="end">THE DAY THAT MOST OFTEN GOES WRONG</text>
<rect x="320" y="1132" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="1166" class="band" text-anchor="start">4  ·  MONDAY, AND THE WEEK THAT FOLLOWS</text>
<text x="2004" y="1166" class="bandhi" text-anchor="end">THE CASCADE</text>
<rect x="350" y="248" width="250" height="90" rx="6" fill="#1F6F78"/>
<text x="475.0" y="289.5" class="bt" style="fill:#fff" text-anchor="middle">Three referrals</text>
<text x="475.0" y="308.5" class="bt" style="fill:#fff" text-anchor="middle">accepted</text>
<text x="356" y="364" class="sub">·  two discharging Saturday</text>
<text x="356" y="381" class="sub">·  one discharging Sunday</text>
<text x="356" y="398" class="sub">·  all three agreed with sales</text>
<rect x="628" y="248" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="753.0" y="289.5" class="bt" style="fill:#fff" text-anchor="middle">Weekend cover</text>
<text x="753.0" y="308.5" class="bt" style="fill:#fff" text-anchor="middle">arranged</text>
<text x="634" y="364" class="sub">·  one nurse Saturday, one Sunday</text>
<text x="634" y="381" class="sub">·  each holding two admitting slots</text>
<text x="634" y="398" class="sub">·  the week ahead is planned on it</text>
<line x1="600" y1="293.0" x2="622" y2="293.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="248" width="250" height="90" rx="6" fill="#1A1A1A"/>
<text x="1031.0" y="289.5" class="bt" style="fill:#fff" text-anchor="middle">The week's admission</text>
<text x="1031.0" y="308.5" class="bt" style="fill:#fff" text-anchor="middle">target assumes them</text>
<text x="912" y="364" class="sub">·  three starts before Monday</text>
<text x="912" y="381" class="sub">·  and the caseload they carry</text>
<text x="912" y="398" class="sub">·  Monday is planned as a full day</text>
<line x1="878" y1="293.0" x2="900" y2="293.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="1309.0" cy="293" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1309.0" y="298.0" class="bt s" style="fill:#1B211E" text-anchor="middle">Nothing is confirmed yet</text>
<line x1="1156.0" y1="293" x2="1178.0" y2="293" class="ln" marker-end="url(#ar)"/>
<text x="1190.0" y="364" class="sub">·  no contact until the weekend</text>
<text x="1190.0" y="381" class="sub">·  sales confirmation is not consent</text>
<text x="1190.0" y="398" class="sub">·  the risk is invisible on Friday</text>
<rect x="1520" y="248" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="284.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="301.0" class="ct" text-anchor="middle" fill="#1B211E">Three assumptions nobody will</text>
<text x="1740.0" y="318.0" class="ct" text-anchor="middle" fill="#1B211E">test until the weekend arrives.</text>
<text x="1740.0" y="278" class="ct" text-anchor="middle" style="fill:#B03A2E;font-weight:700">THE WEEK IS BUILT ON THREE</text>
<rect x="350" y="562" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="475.0" y="603.5" class="bt" style="fill:#fff" text-anchor="middle">Welcome calls made</text>
<text x="475.0" y="622.5" class="bt" style="fill:#fff" text-anchor="middle">late morning</text>
<text x="356" y="678" class="sub">·  after the day's other work</text>
<text x="356" y="695" class="sub">·  by which time the day is set</text>
<text x="356" y="712" class="sub">·  no slack left to redirect</text>
<rect x="628" y="562" width="250" height="90" rx="6" fill="#4E8A5B"/>
<text x="753.0" y="603.5" class="bt" style="fill:#fff" text-anchor="middle">First patient</text>
<text x="753.0" y="622.5" class="bt" style="fill:#fff" text-anchor="middle">discharged late</text>
<text x="634" y="678" class="sub">·  still in the hospital at eleven</text>
<text x="634" y="695" class="sub">·  the visit cannot happen</text>
<text x="634" y="712" class="sub">·  reschedule to Monday</text>
<line x1="600" y1="607.0" x2="622" y2="607.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="562" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="1031.0" y="603.5" class="bt" style="fill:#fff" text-anchor="middle">One admitting slot</text>
<text x="1031.0" y="622.5" class="bt" style="fill:#fff" text-anchor="middle">expires</text>
<text x="912" y="678" class="sub">·  the nurse is on shift regardless</text>
<text x="912" y="695" class="sub">·  nothing else to fill it with</text>
<text x="912" y="712" class="sub">·  the branch pays for the day</text>
<line x1="878" y1="607.0" x2="900" y2="607.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="1309.0" cy="607" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1309.0" y="612.0" class="bt s" style="fill:#1B211E" text-anchor="middle">One start delivered</text>
<line x1="1156.0" y1="607" x2="1178.0" y2="607" class="ln" marker-end="url(#ar)"/>
<text x="1190.0" y="678" class="sub">·  the second patient was ready</text>
<text x="1190.0" y="695" class="sub">·  that admission goes well</text>
<text x="1190.0" y="712" class="sub">·  one of two</text>
<rect x="1520" y="562" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="598.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="615.0" class="ct" text-anchor="middle" fill="#1B211E">The nurse worked. One admission</text>
<text x="1740.0" y="632.0" class="ct" text-anchor="middle" fill="#1B211E">came out of it.</text>
<text x="1740.0" y="592" class="ct" text-anchor="middle" style="fill:#B03A2E;font-weight:700">HALF A WEEKEND DAY LOST</text>
<rect x="350" y="876" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="475.0" y="917.5" class="bt" style="fill:#fff" text-anchor="middle">Welcome call made</text>
<text x="475.0" y="936.5" class="bt" style="fill:#fff" text-anchor="middle">at midday</text>
<text x="356" y="992" class="sub">·  Sunday cover is thin</text>
<text x="356" y="1009" class="sub">·  the call waits its turn</text>
<text x="356" y="1026" class="sub">·  the family has been home a day</text>
<rect x="628" y="876" width="250" height="90" rx="6" fill="#4E8A5B"/>
<text x="753.0" y="917.5" class="bt" style="fill:#fff" text-anchor="middle">The family defers</text>
<text x="753.0" y="936.5" class="bt" style="fill:#fff" text-anchor="middle">to Monday</text>
<text x="634" y="992" class="sub">·  a common Sunday pattern</text>
<text x="634" y="1009" class="sub">·  they want to settle first</text>
<text x="634" y="1026" class="sub">·  entirely reasonable, and unpredicted</text>
<line x1="600" y1="921.0" x2="622" y2="921.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="876" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="1031.0" y="917.5" class="bt" style="fill:#fff" text-anchor="middle">Both Sunday slots</text>
<text x="1031.0" y="936.5" class="bt" style="fill:#fff" text-anchor="middle">expire</text>
<text x="912" y="992" class="sub">·  nothing to redirect them to</text>
<text x="912" y="1009" class="sub">·  no view of who else could start</text>
<text x="912" y="1026" class="sub">·  the nurse goes home early</text>
<line x1="878" y1="921.0" x2="900" y2="921.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="1309.0" cy="921" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1309.0" y="926.0" class="bt s" style="fill:#1B211E" text-anchor="middle">No starts on Sunday</text>
<line x1="1156.0" y1="921" x2="1178.0" y2="921" class="ln" marker-end="url(#ar)"/>
<text x="1190.0" y="992" class="sub">·  the most common weekend outcome</text>
<text x="1190.0" y="1009" class="sub">·  and the least examined</text>
<text x="1190.0" y="1026" class="sub">·  three admissions now land Monday</text>
<rect x="1520" y="876" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="912.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="929.0" class="ct" text-anchor="middle" fill="#1B211E">Two deferrals and a late discharge</text>
<text x="1740.0" y="946.0" class="ct" text-anchor="middle" fill="#1B211E">all arrive on Monday together.</text>
<text x="1740.0" y="906" class="ct" text-anchor="middle" style="fill:#B03A2E;font-weight:700">A SUNDAY THAT SET THE WEEK BACK</text>
<rect x="350" y="1190" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="475.0" y="1231.5" class="bt" style="fill:#fff" text-anchor="middle">Three admissions</text>
<text x="475.0" y="1250.5" class="bt" style="fill:#fff" text-anchor="middle">land on Monday</text>
<text x="356" y="1306" class="sub">·  planned for two at most</text>
<text x="356" y="1323" class="sub">·  both admitting nurses consumed</text>
<text x="356" y="1340" class="sub">·  for most of the day</text>
<rect x="628" y="1190" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="753.0" y="1231.5" class="bt" style="fill:#fff" text-anchor="middle">Routine visits</text>
<text x="753.0" y="1250.5" class="bt" style="fill:#fff" text-anchor="middle">get pushed</text>
<text x="634" y="1306" class="sub">·  to Tuesday and Wednesday</text>
<text x="634" y="1323" class="sub">·  compressing the whole week</text>
<text x="634" y="1340" class="sub">·  some slip past their window</text>
<line x1="600" y1="1235.0" x2="622" y2="1235.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="1190" width="250" height="90" rx="6" fill="#1A1A1A"/>
<text x="1031.0" y="1231.5" class="bt" style="fill:#fff" text-anchor="middle">Thursday's referral</text>
<text x="1031.0" y="1250.5" class="bt" style="fill:#fff" text-anchor="middle">is declined</text>
<text x="912" y="1306" class="sub">·  the branch is genuinely full</text>
<text x="912" y="1323" class="sub">·  because Monday absorbed the weekend</text>
<text x="912" y="1340" class="sub">·  the source is told no</text>
<line x1="878" y1="1235.0" x2="900" y2="1235.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="1309.0" cy="1235" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1309.0" y="1240.0" class="bt s" style="fill:#1B211E" text-anchor="middle">The target is missed</text>
<line x1="1156.0" y1="1235" x2="1178.0" y2="1235" class="ln" marker-end="url(#ar)"/>
<text x="1190.0" y="1306" class="sub">·  not from a lack of demand</text>
<text x="1190.0" y="1323" class="sub">·  from three weekend assumptions</text>
<text x="1190.0" y="1340" class="sub">·  that nobody tested in time</text>
<rect x="1520" y="1190" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="1226.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="1243.0" class="ct" text-anchor="middle" fill="#1B211E">The weekend did not just lose two</text>
<text x="1740.0" y="1260.0" class="ct" text-anchor="middle" fill="#1B211E">days. It cost the week.</text>
<text x="1740.0" y="1220" class="ct" text-anchor="middle" style="fill:#B03A2E;font-weight:700">ONE WEEKEND, ONE WHOLE WEEK</text>
<rect x="320" y="1455" width="1698" height="195" rx="10" fill="none" stroke="#C9CCC5" stroke-width="1.8" stroke-dasharray="8 6"/>
<text x="346" y="1491" class="pnl" text-anchor="start">WHAT THE WEEKEND COST THE WEEK</text>
<line x1="336" y1="1509" x2="336" y2="1525" stroke="#B03A2E" stroke-width="3"/>
<text x="336" y="1547" class="colh" text-anchor="start">1  FRIDAY</text>
<text x="336" y="1577" class="sub">·  three assumptions, none of</text>
<text x="336" y="1594" class="sub">·  them tested until the weekend</text>
<line x1="756" y1="1509" x2="756" y2="1525" stroke="#B03A2E" stroke-width="3"/>
<text x="756" y="1547" class="colh" text-anchor="start">2  SATURDAY</text>
<text x="756" y="1577" class="sub">·  a late discharge takes a slot</text>
<text x="756" y="1594" class="sub">·  with nothing to replace it</text>
<line x1="1176" y1="1509" x2="1176" y2="1525" stroke="#B03A2E" stroke-width="3"/>
<text x="1176" y="1547" class="colh" text-anchor="start">3  SUNDAY</text>
<text x="1176" y="1577" class="sub">·  a midday call, a deferral,</text>
<text x="1176" y="1594" class="sub">·  and two slots gone</text>
<line x1="1596" y1="1509" x2="1596" y2="1525" stroke="#B03A2E" stroke-width="3"/>
<text x="1596" y="1547" class="colh" text-anchor="start">4  THE WEEK</text>
<text x="1596" y="1577" class="sub">·  three admissions land Monday,</text>
<text x="1596" y="1594" class="sub">·  the week compresses, a referral declined</text>
<rect x="2060" y="1475" width="470" height="112" rx="8" fill="none" stroke="#C9CCC5" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="2080" y="1503" class="colh" text-anchor="start">LEVERS ON THIS SHEET</text>
<text x="2080" y="1527" class="sub" style="fill:#B03A2E;font-weight:700">L1</text>
<text x="2118" y="1527" class="sub">Admission Throughput, in depth</text>
<line x1="50" y1="1808" x2="2550" y2="1808" stroke="#C9CCC5" stroke-width="1.4"/>
<text x="50" y="1840" class="foot" text-anchor="start">Current state, August 2026.  A representative composite of documented branch patterns, not a single named case.  Nothing on this sheet is a proposal.</text>
<text x="2550" y="1840" class="foot" text-anchor="end">Compassus Home Health  ·  The weekend cascade</text>
</svg>
</figure>
