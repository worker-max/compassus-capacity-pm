<title>Start of Care — the Full Flow</title>

<figure>
<svg viewBox="0 0 2600 1620" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="The full admission flow. Pass one runs the referral: intake receives it in Commure, the auth team verifies eligibility and keys pending auth, intake gives final approval, DCS reviews the referral, the scheduler makes the welcome call to confirm the patient is home, books the SOC or ROC visit and the discipline evaluations, and clinicians perform them. Pass two runs per discipline: the clinician submits the plan of care, DCS approves — without that approval nothing moves forward and the visits are held — the 485 moment locks the plan, visits generate in HCHB, the auth gate is checked, and the scheduler assigns all plotted visits in one pass. Missed visits run a separate 48-hour compliance chain.">

<style>
:root{--paper:#F2F3EF;--rule:#D8DAD2;

--body:"Avenir Next",Avenir,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
--display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#101412;--rule:#2C342E;
--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px -22px rgba(0,0,0,.85);}}
:root[data-theme="dark"]{--paper:#101412;--rule:#2C342E;
--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px -22px rgba(0,0,0,.85);}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);font-family:var(--body);
padding:clamp(10px,2vw,32px);-webkit-font-smoothing:antialiased}
figure{margin:0 auto;max-width:1900px;border:1px solid var(--rule);border-radius:12px;
box-shadow:var(--shadow);overflow-x:auto;background:#FBFBF8}
svg{display:block;width:100%;min-width:1180px;height:auto}
