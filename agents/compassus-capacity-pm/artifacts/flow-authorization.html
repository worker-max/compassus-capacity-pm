<title>Authorization</title>

<figure>
<svg viewBox="0 0 2200 1540" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Authorization mapped at its two interfaces with scheduling. At start of care auth is a gate: eligibility is verified, pending auth is keyed at a visit count set by the payer, and the referral returns to intake for final approval before a scheduler can touch it. Inside the episode auth is a ceiling: the plan of care is written to clinical need, every visit is checked for auth on file, authorised visits are consumed and a re-authorisation is requested as the cap approaches.">
<defs><marker id="ar" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.5" orient="auto-start-reverse"><polygon points="0,0 10,4 0,8" fill="#1B211E"/></marker></defs>
<rect x="0" y="0" width="2200" height="1540" fill="#FBFBF8"/>
<text x="50" y="58" class="eyebrow" text-anchor="start">COMPASSUS HOME HEALTH  ·  FLOW 3</text>
<text x="50" y="100" class="title" text-anchor="start">Authorization</text>
<text x="50" y="128" class="deck" text-anchor="start">Two interfaces only — the gate before the first visit, and the ceiling inside the episode</text>
<circle cx="1231" cy="72" r="13" fill="#1F6F78"/>
<text x="1252" y="78" class="leg" text-anchor="start">Intake</text>
<circle cx="1349.4" cy="72" r="13" fill="#DF751D"/>
<text x="1370.4" y="78" class="leg" text-anchor="start">Insurance &amp; Auth</text>
<circle cx="1551.8000000000002" cy="72" r="13" fill="#792E2E"/>
<text x="1572.8000000000002" y="78" class="leg" text-anchor="start">DCS</text>
<circle cx="1645.0000000000002" cy="72" r="13" fill="#2E599D"/>
<text x="1666.0000000000002" y="78" class="leg" text-anchor="start">Clinician</text>
<circle cx="1788.6000000000004" cy="72" r="13" fill="#C6A01F"/>
<text x="1809.6000000000004" y="78" class="leg" text-anchor="start">PCC / Scheduler</text>
<circle cx="1982.6000000000004" cy="72" r="13" fill="#795CA7"/>
<text x="2003.6000000000004" y="78" class="leg" text-anchor="start">HCHB</text>
<line x1="50" y1="150" x2="2150" y2="150" stroke="#C9CCC5" stroke-width="1.4"/>
<rect x="320" y="190" width="1698" height="300" rx="10" fill="#E9E9E5"/>
<text x="342" y="224" class="band" text-anchor="start">INTERFACE 1  ·  AT START OF CARE — auth is a GATE</text>
<text x="1996" y="224" class="bandhi" text-anchor="end">NOTHING SCHEDULES UNTIL THIS CLEARS</text>
<rect x="350" y="252" width="250" height="90" rx="5" fill="#1F6F78"/>
<text x="475.0" y="293.5" class="bt" text-anchor="middle">Intake receives</text>
<text x="475.0" y="312.5" class="bt" text-anchor="middle">in Commure</text>
<text x="356" y="368" class="sub">·  From hospital, MD, facility</text>
<text x="356" y="385" class="sub">·  Payer and plan captured</text>
<rect x="628" y="252" width="250" height="90" rx="5" fill="#DF751D"/>
<text x="753.0" y="293.5" class="bt" text-anchor="middle">Eligibility and</text>
<text x="753.0" y="312.5" class="bt" text-anchor="middle">benefits verified</text>
<text x="634" y="368" class="sub">·  Automated today</text>
<text x="634" y="385" class="sub">·  Coordination note written here</text>
<text x="634" y="402" class="sub">·  ← the payer's rules land here</text>
<line x1="600" y1="297.0" x2="622" y2="297.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="252" width="250" height="90" rx="5" fill="#DF751D"/>
<text x="1031.0" y="303.0" class="bt" text-anchor="middle">Pending auth keyed</text>
<text x="912" y="368" class="sub">·  1 · 3 · 5 or 10 visits</text>
<text x="912" y="385" class="sub">·  Set by the payer, not by need</text>
<line x1="878" y1="297.0" x2="900" y2="297.0" class="ln" marker-end="url(#ar)"/>
<rect x="1184" y="252" width="250" height="90" rx="5" fill="#1F6F78"/>
<text x="1309.0" y="293.5" class="bt" text-anchor="middle">Back to intake for</text>
<text x="1309.0" y="312.5" class="bt" text-anchor="middle">final approval</text>
<text x="1190" y="368" class="sub">·  The referral is now complete</text>
<text x="1190" y="385" class="sub">·  Only now does it move</text>
<line x1="1156" y1="297.0" x2="1178" y2="297.0" class="ln" marker-end="url(#ar)"/>
<rect x="1462" y="252" width="250" height="90" rx="5" fill="#792E2E"/>
<text x="1587.0" y="293.5" class="bt" text-anchor="middle">DCS reviews</text>
<text x="1587.0" y="312.5" class="bt" text-anchor="middle">the referral</text>
<text x="1468" y="368" class="sub">·  Orders read</text>
<text x="1468" y="385" class="sub">·  Disciplines confirmed</text>
<line x1="1434" y1="297.0" x2="1456" y2="297.0" class="ln" marker-end="url(#ar)"/>
<rect x="1740" y="252" width="250" height="90" rx="5" fill="#C6A01F"/>
<text x="1865.0" y="293.5" class="bt" text-anchor="middle">Scheduler books</text>
<text x="1865.0" y="312.5" class="bt" text-anchor="middle">SOC and evals</text>
<text x="1746" y="368" class="sub">·  The first visits land</text>
<text x="1746" y="385" class="sub">·  Auth is already spent on these</text>
<line x1="1712" y1="297.0" x2="1734" y2="297.0" class="ln" marker-end="url(#ar)"/>
<rect x="50" y="258.0" width="250" height="78" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="175.0" y="293.5" class="ct" text-anchor="middle" fill="#1B211E">Referral arrives</text>
<text x="175.0" y="310.5" class="ct" text-anchor="middle" fill="#1B211E">hospital · MD · facility</text>
<line x1="300" y1="297.0" x2="344" y2="297.0" class="ln" marker-end="url(#ar)"/>
<text x="50" y="244.0" class="trg" text-anchor="start">TRIGGER</text>
<path d="M 614 297.0 L 614 450 L 1410 450 L 1410 348" fill="none" class="ln" stroke-dasharray="7 5" opacity=".68" marker-end="url(#ar)"/>
<text x="1012.0" y="439" class="note" text-anchor="middle">Traditional Medicare — no pending auth, straight through</text>
<text x="350" y="524" class="hi" text-anchor="start">“We know we have the referral, but it is just not in my workflow to schedule yet — it is stuck in auth.”</text>
<rect x="320" y="556" width="1698" height="240" rx="10" fill="#E9E9E5"/>
<text x="342" y="590" class="band" text-anchor="start">INTERFACE 2  ·  INSIDE THE PLAN OF CARE — auth is a CEILING</text>
<text x="1996" y="590" class="bandhi" text-anchor="end">CHECKED PER VISIT, NOT PER EPISODE</text>
<rect x="350" y="618" width="250" height="90" rx="5" fill="#2E599D"/>
<text x="475.0" y="659.5" class="bt" text-anchor="middle">Clinician writes</text>
<text x="475.0" y="678.5" class="bt" text-anchor="middle">discipline frequency</text>
<text x="356" y="734" class="sub">·  Written to clinical need</text>
<text x="356" y="751" class="sub">·  Payer limits not visible here</text>
<rect x="628" y="618" width="250" height="90" rx="5" fill="#792E2E"/>
<text x="753.0" y="659.5" class="bt" text-anchor="middle">DCS reviews and</text>
<text x="753.0" y="678.5" class="bt" text-anchor="middle">approves the POC</text>
<text x="634" y="734" class="sub">·  Utilisation management</text>
<text x="634" y="751" class="sub">·  One task per discipline</text>
<line x1="600" y1="663.0" x2="622" y2="663.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="618" width="250" height="90" rx="5" fill="#795CA7"/>
<text x="1031.0" y="659.5" class="bt" text-anchor="middle">Auth on file for</text>
<text x="1031.0" y="678.5" class="bt" text-anchor="middle">these visits?</text>
<rect x="1096.8" y="604" width="51.2" height="23" rx="11.5" fill="#FFFFFF" stroke="#795CA7" stroke-width="1.8"/>
<text x="1122.4" y="620" class="bdg" text-anchor="middle" fill="#795CA7">GATE</text>
<text x="912" y="734" class="sub">·  Asked of every visit</text>
<text x="912" y="751" class="sub">·  Answered by HCHB, silently</text>
<line x1="878" y1="663.0" x2="900" y2="663.0" class="ln" marker-end="url(#ar)"/>
<rect x="1184" y="618" width="250" height="90" rx="5" fill="#C6A01F"/>
<text x="1309.0" y="659.5" class="bt" text-anchor="middle">Scheduler assigns</text>
<text x="1309.0" y="678.5" class="bt" text-anchor="middle">the authorised visits</text>
<text x="1190" y="734" class="sub">·  Only the covered ones</text>
<text x="1190" y="751" class="sub">·  The rest wait, unseen</text>
<line x1="1156" y1="663.0" x2="1178" y2="663.0" class="ln" marker-end="url(#ar)"/>
<rect x="1462" y="618" width="250" height="90" rx="5" fill="#795CA7"/>
<text x="1587.0" y="659.5" class="bt" text-anchor="middle">Visits consume</text>
<text x="1587.0" y="678.5" class="bt" text-anchor="middle">the authorised count</text>
<text x="1468" y="734" class="sub">·  Counted down per visit</text>
<text x="1468" y="751" class="sub">·  Nobody sees the balance</text>
<line x1="1434" y1="663.0" x2="1456" y2="663.0" class="ln" marker-end="url(#ar)"/>
<rect x="1740" y="618" width="250" height="90" rx="5" fill="#DF751D"/>
<text x="1865.0" y="659.5" class="bt" text-anchor="middle">Cap approached —</text>
<text x="1865.0" y="678.5" class="bt" text-anchor="middle">re-auth requested</text>
<text x="1746" y="734" class="sub">·  Supporting documentation required</text>
<text x="1746" y="751" class="sub">·  UHC: 4 of 5 done before visit 6</text>
<line x1="1712" y1="663.0" x2="1734" y2="663.0" class="ln" marker-end="url(#ar)"/>
<rect x="350" y="840" width="1640" height="70" rx="8" fill="#FFFFFF" stroke="#DF751D" stroke-width="2"/>
<rect x="350" y="840" width="7" height="70" rx="3.5" fill="#DF751D"/>
<text x="378" y="869" class="pnlA" text-anchor="start">NO AUTH  —  the visit sits pending</text>
<text x="378" y="892" class="note" text-anchor="start">It is not on the clinician's calendar, it does not count toward productivity, and it lives in the scheduler's head or on a sticky note.</text>
<path d="M 1170 663.0 L 1170 834" fill="none" class="ln" stroke-dasharray="7 5" opacity=".68" marker-end="url(#ar)"/>
<text x="1182" y="826" class="conn" text-anchor="start">No — no auth on file</text>
<path d="M 1990 663.0 L 2060 663.0 L 2060 950 L 290 950 L 290 663.0 L 344 663.0" fill="none" class="ln" stroke-dasharray="7 5" opacity=".68" marker-end="url(#ar)"/>
<text x="368" y="938" class="hi" text-anchor="start">Every add-on order, recertification and resumption of care re-enters this loop — and each one is a new auth question</text>
<rect x="350" y="996" width="1660" height="190" rx="10" fill="none" stroke="#C9CCC5" stroke-width="1.8" stroke-dasharray="8 6"/>
<text x="376" y="1032" class="pnl" text-anchor="start">WHAT THE PAYER HAS ALREADY DECIDED — before anyone writes a plan of care</text>
<line x1="376" y1="1050" x2="376" y2="1168" stroke="#1B211E" stroke-width="3"/>
<text x="394" y="1070" class="colh" text-anchor="start">THE CAP IS SET UPSTREAM</text>
<text x="394" y="1094" class="sub">·  UHC — 5 nursing visits; 4 of 5 completed plus documentation before visit 6</text>
<text x="394" y="1111" class="sub">·  Indiana Medicaid — 8 visits shared across PT / OT / ST</text>
<text x="394" y="1128" class="sub">·  Indiana Medicaid — 30 days from the discharge date, not the admit date</text>
<text x="394" y="1145" class="sub">·  Ohio Medicaid — caps similarly</text>
<line x1="1230" y1="1050" x2="1230" y2="1168" stroke="#DF751D" stroke-width="3"/>
<text x="1248" y="1070" class="colhA" text-anchor="start">TWO CEILINGS, NOT ONE</text>
<text x="1248" y="1094" class="sub">·  Auth is permission — how many visits the payer will allow</text>
<text x="1248" y="1111" class="sub">·  PDGM is payment — the economic band for the period</text>
<text x="1248" y="1128" class="sub">·  LUPA is the floor; utilisation management is the ceiling</text>
<text x="1248" y="1145" class="sub">·  A visit can be authorised and still be uneconomic</text>
<text x="350" y="1222" class="hi" text-anchor="start">The data already exists. The auth team writes the payer's rules into a coordination note at verification — days before anyone writes the plan of care.</text>
<text x="350" y="1244" class="note" text-anchor="start">Surfacing those rules at plan-of-care creation is the highest-value, lowest-complexity win in this flow — and a patient-care win, because abrupt discharges happen when nobody planned for the real visit budget.</text>
<text x="50" y="1298" class="trg" text-anchor="start">BOUNDARIES</text>
<rect x="350" y="1276" width="424.4" height="42" rx="21.0" fill="#FFFFFF" stroke="#5A6560" stroke-width="1.8"/>
<text x="562.2" y="1302.0" class="ct" text-anchor="middle" fill="#5A6560">Auth is drawn only where it meets scheduling</text>
<rect x="794.4" y="1276" width="390.0" height="42" rx="21.0" fill="#FFFFFF" stroke="#5A6560" stroke-width="1.8"/>
<text x="989.4" y="1302.0" class="ct" text-anchor="middle" fill="#5A6560">Traditional Medicare has no pending auth</text>
<rect x="1204.4" y="1276" width="441.59999999999997" height="42" rx="21.0" fill="#FFFFFF" stroke="#5A6560" stroke-width="1.8"/>
<text x="1425.2" y="1302.0" class="ct" text-anchor="middle" fill="#5A6560">Auth governs permission · PDGM governs payment</text>
<text x="50" y="1384" class="trg" text-anchor="start">WHERE IT</text>
<text x="50" y="1402" class="trg" text-anchor="start">BREAKS</text>
<rect x="350" y="1358" width="420" height="70" rx="5" fill="#DF751D"/>
<text x="560.0" y="1390.25" class="bt s" text-anchor="middle">Pending-auth visits are invisible</text>
<text x="560.0" y="1405.75" class="bt s" text-anchor="middle">not on a calendar, not counted</text>
<rect x="790" y="1358" width="420" height="70" rx="5" fill="#C6A01F"/>
<text x="1000.0" y="1390.25" class="bt s" text-anchor="middle">~50 pending-auth workflows a day</text>
<text x="1000.0" y="1405.75" class="bt s" text-anchor="middle">so schedulers bulk-clear without reading</text>
<rect x="1230" y="1358" width="420" height="70" rx="5" fill="#2E599D"/>
<text x="1440.0" y="1390.25" class="bt s" text-anchor="middle">Plans of care ignore payer limits</text>
<text x="1440.0" y="1405.75" class="bt s" text-anchor="middle">then the team is surprised</text>
<rect x="1670" y="1358" width="420" height="70" rx="5" fill="#792E2E"/>
<text x="1880.0" y="1390.25" class="bt s" text-anchor="middle">Abrupt discharge when the</text>
<text x="1880.0" y="1405.75" class="bt s" text-anchor="middle">visit budget quietly runs out</text>
<line x1="50" y1="1468" x2="2150" y2="1468" stroke="#C9CCC5" stroke-width="1.4"/>
<text x="50" y="1500" class="foot" text-anchor="start">Current state · auth mapped at its interface with scheduling only (DE-06)</text>
<text x="2150" y="1500" class="foot" text-anchor="end">Flow 3 of 4 · authorization</text>
</svg>
</figure>
