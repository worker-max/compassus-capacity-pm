<title>Every patient visit — the eight competing priorities</title>

<figure>
<svg viewBox="0 0 2600 1760" role="img" xmlns="http://www.w3.org/2000/svg">
<rect width="2600" height="1760" fill="#FBFBF8"/>
<style>.chp{font-family:var(--mono),monospace;font-size:12.5px;font-weight:700;letter-spacing:.04em;fill:#fff}.xs{font-family:var(--mono),monospace;font-size:15px;font-weight:700;fill:#792E2E}.kh{font-family:var(--body),sans-serif;font-size:14.5px;font-weight:700;fill:#1B211E}</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1B211E"/></marker></defs>
<text x="50" y="62" class="eyebrow" text-anchor="start">COMPASSUS HOME HEALTH  ·  PATIENT SCHEDULING  ·  FOUNDATION SHEET</text>
<text x="50" y="104" class="title" text-anchor="start">Every Patient Visit</text>
<text x="50" y="132" class="deck" text-anchor="start">The eight competing priorities, replotted — because a flower cannot show a collision, and the collisions are the job</text>
<circle cx="1400" cy="58" r="9" fill="#795CA7"/>
<text x="1416" y="63" class="leg" text-anchor="start">System / HCHB</text>
<circle cx="1565.8" cy="58" r="9" fill="#2E599D"/>
<text x="1581.8" y="63" class="leg" text-anchor="start">Clinician</text>
<circle cx="1697.1999999999998" cy="58" r="9" fill="#792E2E"/>
<text x="1713.1999999999998" y="63" class="leg" text-anchor="start">DCS</text>
<circle cx="1776.9999999999998" cy="58" r="9" fill="#4E8A5B"/>
<text x="1792.9999999999998" y="63" class="leg" text-anchor="start">Patient</text>
<circle cx="1891.1999999999998" cy="58" r="9" fill="#C6A01F"/>
<text x="1907.1999999999998" y="63" class="leg" text-anchor="start">Geography</text>
<circle cx="2022.6" cy="58" r="9" fill="#1A1A1A"/>
<text x="2038.6" y="63" class="leg" text-anchor="start">Branch</text>
<text x="2550" y="104" class="colh" text-anchor="end">COLOUR = WHO OWNS THE TRUTH</text>
<text x="2550" y="128" class="key" text-anchor="end">SIZE = HOW MANY WORKBOOK VARIABLES SIT BEHIND IT</text>
<line x1="50" y1="158" x2="2550" y2="158" stroke="#C9CCC5" stroke-width="1.4"/>
<rect x="50" y="186" width="2500" height="940" rx="10" fill="#E9E9E5"/>
<text x="72" y="220" class="band" text-anchor="start">THE EIGHT, PLOTTED AGAINST THE TWO AXES THAT DECIDE TUESDAY</text>
<text x="2528" y="220" class="bandhi" text-anchor="end">THE FLOWER GAVE ALL EIGHT THE SAME SIZE AND THE SAME DISTANCE FROM THE MIDDLE</text>
<rect x="300" y="282" width="890.0" height="350.0" fill="#792E2E" opacity=".07"/>
<rect x="1190.0" y="282" width="890.0" height="350.0" fill="#5F8A12" opacity=".07"/>
<rect x="1190.0" y="632.0" width="890.0" height="350.0" fill="#5F8A12" opacity=".14"/>
<rect x="300" y="282" width="1780" height="700" fill="none" stroke="#C9CCC5" stroke-width="1.6"/>
<line x1="1190.0" y1="282" x2="1190.0" y2="982" stroke="#C9CCC5" stroke-width="1.6"/>
<line x1="300" y1="632.0" x2="2080" y2="632.0" stroke="#C9CCC5" stroke-width="1.6"/>
<line x1="260" y1="282" x2="260" y2="982" stroke="#1B211E" stroke-width="2" marker-start="url(#ar)"/>
<text x="244" y="290" class="colh" text-anchor="end">CANNOT MOVE</text>
<text x="244" y="310" class="sub" text-anchor="end">the schedule bends around it</text>
<text x="244" y="966" class="colh" text-anchor="end">MOVES FREELY</text>
<line x1="300" y1="1022" x2="2080" y2="1022" stroke="#1B211E" stroke-width="2" marker-end="url(#ar)"/>
<text x="304" y="1046" class="colh" text-anchor="start">THE TOOL CANNOT COMPUTE IT</text>
<text x="304" y="1066" class="sub" text-anchor="start">tacit, patient-held, low confidence</text>
<text x="2076" y="1046" class="colh" text-anchor="end">THE TOOL CAN COMPUTE IT</text>
<text x="2076" y="1066" class="sub" text-anchor="end">in-system, derived, high confidence</text>
<text x="318" y="312" class="pnl" text-anchor="start">THE HARD PART</text>
<text x="318" y="332" class="sub" text-anchor="start">immovable, and no system holds it — this is the judgment</text>
<text x="2062" y="312" class="colhb" text-anchor="end">THE FLOOR</text>
<text x="2062" y="332" class="sub" text-anchor="end">immovable, and already known — automate it and stop thinking</text>
<text x="318" y="662.0" class="colh" text-anchor="start">NOISE</text>
<text x="318" y="682.0" class="sub" text-anchor="start">soft and unknowable — nothing to build here</text>
<text x="2062" y="662.0" class="colhb" text-anchor="end">THE LEVERS</text>
<text x="2062" y="682.0" class="sub" text-anchor="end">movable and computable — where the tool earns its keep</text>
<rect x="430.20000000000005" y="355.0" width="238" height="64" rx="5" fill="#4E8A5B"/>
<text x="549.2" y="383.5" class="bt" style="fill:#fff" text-anchor="middle">Patient</text>
<text x="549.2" y="402.5" class="bt" style="fill:#fff" text-anchor="middle">Availability</text>
<rect x="584.1" y="341.0" width="76.10000000000001" height="23" rx="11.5" fill="#FFFFFF" stroke="#4E8A5B" stroke-width="1.8"/>
<text x="622.1500000000001" y="357.0" class="bdg" text-anchor="middle" fill="#4E8A5B">10 VARS</text>
<text x="549.2" y="437.0" class="trg" text-anchor="middle">7 OF 10 HARD</text>
<text x="430.20000000000005" y="457.0" class="sub" text-anchor="start">· Dialysis · MD appointments</text>
<text x="430.20000000000005" y="474.0" class="sub" text-anchor="start">· Caregiver must be present</text>
<text x="430.20000000000005" y="491.0" class="sub" text-anchor="start">· Cognitive windows</text>
<text x="430.20000000000005" y="508.0" class="sub" text-anchor="start">· “Not Mondays” · “not first thing”</text>
<rect x="1326.9" y="355.0" width="189" height="64" rx="5" fill="#792E2E"/>
<text x="1421.4" y="393.0" class="bt" style="fill:#fff" text-anchor="middle">MD Orders</text>
<rect x="1440.1000000000001" y="341.0" width="67.80000000000001" height="23" rx="11.5" fill="#FFFFFF" stroke="#792E2E" stroke-width="1.8"/>
<text x="1474.0" y="357.0" class="bdg" text-anchor="middle" fill="#792E2E">3 VARS</text>
<text x="1421.4" y="437.0" class="trg" text-anchor="middle">ALL HARD</text>
<text x="1326.9" y="457.0" class="sub" text-anchor="start">· Wound care every 3 days</text>
<text x="1326.9" y="474.0" class="sub" text-anchor="start">· Labs before the MD visit</text>
<text x="1326.9" y="491.0" class="sub" text-anchor="start">· Protocol-driven timing</text>
<rect x="1750.6" y="355.0" width="196" height="64" rx="5" fill="#795CA7"/>
<text x="1848.6" y="383.5" class="bt" style="fill:#fff" text-anchor="middle">Regulatory</text>
<text x="1848.6" y="402.5" class="bt" style="fill:#fff" text-anchor="middle">Timing</text>
<rect x="1870.8" y="341.0" width="67.80000000000001" height="23" rx="11.5" fill="#FFFFFF" stroke="#795CA7" stroke-width="1.8"/>
<text x="1904.6999999999998" y="357.0" class="bdg" text-anchor="middle" fill="#795CA7">4 VARS</text>
<text x="1848.6" y="437.0" class="trg" text-anchor="middle">SYSTEM-HELD</text>
<text x="1750.6" y="457.0" class="sub" text-anchor="start">· SOC OASIS inside 48h</text>
<text x="1750.6" y="474.0" class="sub" text-anchor="start">· The 5-day recert window</text>
<text x="1750.6" y="491.0" class="sub" text-anchor="start">· Ordered-frequency compliance</text>
<rect x="703.9000000000001" y="480.0" width="189" height="64" rx="5" fill="#2E599D"/>
<text x="798.4000000000001" y="518.0" class="bt" style="fill:#fff" text-anchor="middle">Prioritize</text>
<rect x="817.1000000000001" y="466.0" width="67.80000000000001" height="23" rx="11.5" fill="#FFFFFF" stroke="#2E599D" stroke-width="1.8"/>
<text x="851.0000000000001" y="482.0" class="bdg" text-anchor="middle" fill="#2E599D">3 VARS</text>
<text x="798.4000000000001" y="562.0" class="trg" text-anchor="middle">TACIT</text>
<text x="703.9000000000001" y="582.0" class="sub" text-anchor="start">· Who is unstable</text>
<text x="703.9000000000001" y="599.0" class="sub" text-anchor="start">· Hospitalisation risk</text>
<text x="703.9000000000001" y="616.0" class="sub" text-anchor="start">· Who can safely wait</text>
<rect x="981.7" y="480.0" width="203" height="64" rx="5" fill="#792E2E"/>
<text x="1083.2" y="518.0" class="bt" style="fill:#fff" text-anchor="middle">Care Team</text>
<rect x="1108.9" y="466.0" width="67.80000000000001" height="23" rx="11.5" fill="#FFFFFF" stroke="#792E2E" stroke-width="1.8"/>
<text x="1142.8" y="482.0" class="bdg" text-anchor="middle" fill="#792E2E">5 VARS</text>
<text x="1083.2" y="562.0" class="trg" text-anchor="middle">MIXED</text>
<text x="981.7" y="582.0" class="sub" text-anchor="start">· Other disciplines' visits</text>
<text x="981.7" y="599.0" class="sub" text-anchor="start">· Supervisory dependency</text>
<text x="981.7" y="616.0" class="sub" text-anchor="start">· Discipline / role match</text>
<rect x="1198.8000000000002" y="770.0" width="196" height="64" rx="5" fill="#2E599D"/>
<text x="1296.8000000000002" y="808.0" class="bt" style="fill:#fff" text-anchor="middle">Frequency</text>
<rect x="1319.0000000000002" y="756.0" width="67.80000000000001" height="23" rx="11.5" fill="#FFFFFF" stroke="#2E599D" stroke-width="1.8"/>
<text x="1352.9" y="772.0" class="bdg" text-anchor="middle" fill="#2E599D">4 VARS</text>
<text x="1296.8000000000002" y="852.0" class="trg" text-anchor="middle">MIXED</text>
<text x="1198.8000000000002" y="872.0" class="sub" text-anchor="start">· Spread, not compressed</text>
<text x="1198.8000000000002" y="889.0" class="sub" text-anchor="start">· Front-load vs LUPA floor</text>
<text x="1198.8000000000002" y="906.0" class="sub" text-anchor="start">· Day-by-day balancing</text>
<rect x="1499.8" y="770.0" width="217" height="64" rx="5" fill="#C6A01F"/>
<text x="1608.3" y="808.0" class="bt" style="fill:#fff" text-anchor="middle">Geography</text>
<rect x="1641.0" y="756.0" width="67.80000000000001" height="23" rx="11.5" fill="#FFFFFF" stroke="#C6A01F" stroke-width="1.8"/>
<text x="1674.8999999999999" y="772.0" class="bdg" text-anchor="middle" fill="#C6A01F">7 VARS</text>
<text x="1608.3" y="852.0" class="trg" text-anchor="middle">0 HARD · ALL COMPUTABLE</text>
<text x="1499.8" y="872.0" class="sub" text-anchor="start">· Drive time, not distance</text>
<text x="1499.8" y="889.0" class="sub" text-anchor="start">· Zip · territory · home base</text>
<text x="1499.8" y="906.0" class="sub" text-anchor="start">· Bridges · rivers · crossings</text>
<rect x="1804.3" y="770.0" width="231" height="64" rx="5" fill="#1A1A1A"/>
<text x="1919.8" y="808.0" class="bt" style="fill:#fff" text-anchor="middle">Productivity</text>
<rect x="1959.5" y="756.0" width="67.80000000000001" height="23" rx="11.5" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.8"/>
<text x="1993.3999999999999" y="772.0" class="bdg" text-anchor="middle" fill="#1A1A1A">9 VARS</text>
<text x="1919.8" y="852.0" class="trg" text-anchor="middle">6 OF 9 DERIVED</text>
<text x="1804.3" y="872.0" class="sub" text-anchor="start">· Points · target · ceiling</text>
<text x="1804.3" y="889.0" class="sub" text-anchor="start">· Committed load</text>
<text x="1804.3" y="906.0" class="sub" text-anchor="start">· Pace vs schedule</text>
<text x="72" y="1104" class="hi" text-anchor="start">Productivity is not the eighth priority — it is what is left after the other seven have taken their cut. Six of its nine variables are derived, not chosen.</text>
<rect x="50" y="1172" width="2500" height="336" rx="10" fill="none" stroke="#792E2E" stroke-width="2"/>
<text x="72" y="1206" class="pnl" text-anchor="start">WHERE THEY ACTUALLY COLLIDE  —  the six the flower has no room for</text>
<text x="2528" y="1206" class="bandhi" text-anchor="end">EVERY ONE IS RESOLVED BY ONE PERSON, THE NIGHT BEFORE</text>
<rect x="72.0" y="1230" width="394.3333333333333" height="26" rx="13" fill="#795CA7"/>
<text x="269.16666666666663" y="1248" class="chp" text-anchor="middle">Regulatory Timing</text>
<text x="269.16666666666663" y="1280" class="xs" text-anchor="middle">✕</text>
<rect x="72.0" y="1288" width="394.3333333333333" height="26" rx="13" fill="#C6A01F"/>
<text x="269.16666666666663" y="1306" class="chp" text-anchor="middle">Geography</text>
<text x="269.16666666666663" y="1344" class="kh" text-anchor="middle">The 48-hour SOC lands in</text>
<text x="269.16666666666663" y="1361" class="kh" text-anchor="middle">the wrong zip</text>
<text x="269.16666666666663" y="1388" class="sub" text-anchor="middle">Someone drives an hour, or the</text>
<text x="269.16666666666663" y="1404" class="sub" text-anchor="middle">SOC is late. There is no third</text>
<text x="269.16666666666663" y="1420" class="sub" text-anchor="middle">option.</text>
<rect x="484.3333333333333" y="1230" width="394.3333333333333" height="26" rx="13" fill="#4E8A5B"/>
<text x="681.5" y="1248" class="chp" text-anchor="middle">Patient Availability</text>
<text x="681.5" y="1280" class="xs" text-anchor="middle">✕</text>
<rect x="484.3333333333333" y="1288" width="394.3333333333333" height="26" rx="13" fill="#C6A01F"/>
<text x="681.5" y="1306" class="chp" text-anchor="middle">Geography</text>
<text x="681.5" y="1344" class="kh" text-anchor="middle">The 2pm-only patient</text>
<text x="681.5" y="1361" class="kh" text-anchor="middle">breaks the cluster</text>
<text x="681.5" y="1388" class="sub" text-anchor="middle">The clinician absorbs the drive,</text>
<text x="681.5" y="1404" class="sub" text-anchor="middle">or the patient waits a day.</text>
<rect x="896.6666666666666" y="1230" width="394.3333333333333" height="26" rx="13" fill="#792E2E"/>
<text x="1093.8333333333333" y="1248" class="chp" text-anchor="middle">Care Team</text>
<text x="1093.8333333333333" y="1280" class="xs" text-anchor="middle">✕</text>
<rect x="896.6666666666666" y="1288" width="394.3333333333333" height="26" rx="13" fill="#2E599D"/>
<text x="1093.8333333333333" y="1306" class="chp" text-anchor="middle">Frequency</text>
<text x="1093.8333333333333" y="1344" class="kh" text-anchor="middle">PT and OT both want</text>
<text x="1093.8333333333333" y="1361" class="kh" text-anchor="middle">Tuesday</text>
<text x="1093.8333333333333" y="1388" class="sub" text-anchor="middle">Two visits in one day, none on</text>
<text x="1093.8333333333333" y="1404" class="sub" text-anchor="middle">Thursday. Whoever schedules</text>
<text x="1093.8333333333333" y="1420" class="sub" text-anchor="middle">first wins.</text>
<rect x="1309.0" y="1230" width="394.3333333333333" height="26" rx="13" fill="#2E599D"/>
<text x="1506.1666666666667" y="1248" class="chp" text-anchor="middle">Prioritize</text>
<text x="1506.1666666666667" y="1280" class="xs" text-anchor="middle">✕</text>
<rect x="1309.0" y="1288" width="394.3333333333333" height="26" rx="13" fill="#1A1A1A"/>
<text x="1506.1666666666667" y="1306" class="chp" text-anchor="middle">Productivity</text>
<text x="1506.1666666666667" y="1344" class="kh" text-anchor="middle">The unstable patient takes</text>
<text x="1506.1666666666667" y="1361" class="kh" text-anchor="middle">90 minutes</text>
<text x="1506.1666666666667" y="1388" class="sub" text-anchor="middle">Same points as a 40-minute</text>
<text x="1506.1666666666667" y="1404" class="sub" text-anchor="middle">visit. The clinician simply runs</text>
<text x="1506.1666666666667" y="1420" class="sub" text-anchor="middle">late.</text>
<rect x="1721.3333333333333" y="1230" width="394.3333333333333" height="26" rx="13" fill="#792E2E"/>
<text x="1918.5" y="1248" class="chp" text-anchor="middle">MD Orders</text>
<text x="1918.5" y="1280" class="xs" text-anchor="middle">✕</text>
<rect x="1721.3333333333333" y="1288" width="394.3333333333333" height="26" rx="13" fill="#4E8A5B"/>
<text x="1918.5" y="1306" class="chp" text-anchor="middle">Patient Availability</text>
<text x="1918.5" y="1344" class="kh" text-anchor="middle">Wound care every 3 days,</text>
<text x="1918.5" y="1361" class="kh" text-anchor="middle">caregiver only weekends</text>
<text x="1918.5" y="1388" class="sub" text-anchor="middle">Negotiated on the phone, agreed</text>
<text x="1918.5" y="1404" class="sub" text-anchor="middle">verbally, written down nowhere.</text>
<rect x="2133.6666666666665" y="1230" width="394.3333333333333" height="26" rx="13" fill="#2E599D"/>
<text x="2330.833333333333" y="1248" class="chp" text-anchor="middle">Frequency</text>
<text x="2330.833333333333" y="1280" class="xs" text-anchor="middle">✕</text>
<rect x="2133.6666666666665" y="1288" width="394.3333333333333" height="26" rx="13" fill="#795CA7"/>
<text x="2330.833333333333" y="1306" class="chp" text-anchor="middle">Regulatory Timing</text>
<text x="2330.833333333333" y="1344" class="kh" text-anchor="middle">Front-load, LUPA floor and</text>
<text x="2330.833333333333" y="1361" class="kh" text-anchor="middle">the recert window</text>
<text x="2330.833333333333" y="1388" class="sub" text-anchor="middle">Nobody models all three at once,</text>
<text x="2330.833333333333" y="1404" class="sub" text-anchor="middle">so the period quietly ends</text>
<text x="2330.833333333333" y="1420" class="sub" text-anchor="middle">short.</text>
<line x1="50" y1="1548" x2="2550" y2="1548" stroke="#C9CCC5" stroke-width="1.4"/>
<text x="72" y="1588" class="trg" text-anchor="start">TODAY</text>
<rect x="190" y="1564" width="640" height="66" rx="5" fill="#2E599D"/>
<text x="510.0" y="1594.25" class="bt s" style="fill:#fff" text-anchor="middle">One clinician resolves all six — unpaid, the night before,</text>
<text x="510.0" y="1609.75" class="bt s" style="fill:#fff" text-anchor="middle">in their head, and written down nowhere</text>
<text x="190" y="1652" class="sub" text-anchor="start">this is bottleneck 3: the weekly logic is undocumented and entirely unassisted</text>
<text x="880" y="1588" class="trg" text-anchor="start">THE TOOL</text>
<rect x="1000" y="1564" width="700" height="66" rx="5" fill="#A6E22E"/>
<text x="1350.0" y="1594.25" class="bt s" style="fill:#1B211E" text-anchor="middle">It does not resolve the collision. It shows the collision before</text>
<text x="1350.0" y="1609.75" class="bt s" style="fill:#1B211E" text-anchor="middle">the day is built, and prices both sides. The clinician still decides.</text>
<text x="1000" y="1652" class="sub" text-anchor="start">release 1 is visualisation only (DE-03) — seeing the trade is the whole of it</text>
<text x="1750" y="1588" class="trg" text-anchor="start">NEXT</text>
<rect x="1850" y="1564" width="700" height="66" rx="5" fill="#C6A01F"/>
<text x="2200.0" y="1594.25" class="bt s" style="fill:#fff" text-anchor="middle">Engagement maps hang off this sheet: each collision becomes</text>
<text x="2200.0" y="1609.75" class="bt s" style="fill:#fff" text-anchor="middle">a conversation, with a named owner and a named moment</text>
<text x="1850" y="1652" class="sub" text-anchor="start">the foundation this sheet exists to give them</text>
<line x1="50" y1="1696" x2="2550" y2="1696" stroke="#C9CCC5" stroke-width="1.4"/>
<text x="50" y="1726" class="foot" text-anchor="start">FOUNDATION SHEET · the eight are the source slide's own; the axes, the sizes and the collisions are this project's data · variable counts from the workbook inventory</text>
<text x="2550" y="1726" class="foot" text-anchor="end">Every patient visit · competing priorities</text>
</svg>
</figure>

<style>
:root{--paper:#F2F3EF;--rule:#D8DAD2;
--shadow:0 1px 2px rgba(23,30,26,.05),0 12px 34px -22px rgba(23,30,26,.35);
--body:"Avenir Next",Avenir,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
--display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
--mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#101412;--rule:#2C342E;
--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px -22px rgba(0,0,0,.85);}}
:root[data-theme="dark"]{--paper:#101412;--rule:#2C342E;
--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px -22px rgba(0,0,0,.85);}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);font-family:var(--body);
padding:clamp(10px,2vw,32px);-webkit-font-smoothing:antialiased}
figure{margin:0 auto;max-width:1900px;border:1px solid var(--rule);border-radius:12px;
box-shadow:var(--shadow);overflow-x:auto;background:#FBFBF8}
svg{display:block;width:100%;min-width:1180px;height:auto}
/* --- in-SVG type. units are points on the output sheet --- */
