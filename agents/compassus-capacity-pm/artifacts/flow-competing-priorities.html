<title>Every patient visit</title>

<figure>
<svg viewBox="0 0 2600 1660" role="img" xmlns="http://www.w3.org/2000/svg">
<rect width="2600" height="1660" fill="#FBFBF8"/>
<style>.chp{font-family:var(--mono),monospace;font-size:12.5px;font-weight:700;letter-spacing:.04em;fill:#fff}.xs{font-family:var(--mono),monospace;font-size:15px;font-weight:700;fill:#792E2E}.kh{font-family:var(--body),sans-serif;font-size:14.5px;font-weight:700;fill:#1B211E}.tier{font-family:var(--mono),monospace;font-size:15px;font-weight:700;letter-spacing:.14em;fill:#1B211E}</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1B211E"/></marker><marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5A6560"/></marker></defs>
<text x="50" y="62" class="eyebrow" text-anchor="start">COMPASSUS HOME HEALTH  ·  PATIENT SCHEDULING  ·  FOUNDATION SHEET</text>
<text x="50" y="104" class="title" text-anchor="start">Every Patient Visit</text>
<text x="50" y="132" class="deck" text-anchor="start">What is fixed before scheduling begins  ·  what is actually being decided  ·  what falls out of the decision</text>
<circle cx="1500" cy="58" r="9" fill="#795CA7"/>
<text x="1516" y="63" class="leg" text-anchor="start">System / HCHB</text>
<circle cx="1661.8" cy="58" r="9" fill="#792E2E"/>
<text x="1677.8" y="63" class="leg" text-anchor="start">Clinical order</text>
<circle cx="1832.1999999999998" cy="58" r="9" fill="#2E599D"/>
<text x="1848.1999999999998" y="63" class="leg" text-anchor="start">Clinician</text>
<circle cx="1959.6" cy="58" r="9" fill="#4E8A5B"/>
<text x="1975.6" y="63" class="leg" text-anchor="start">Patient</text>
<circle cx="2069.7999999999997" cy="58" r="9" fill="#C6A01F"/>
<text x="2085.7999999999997" y="63" class="leg" text-anchor="start">Scheduler</text>
<circle cx="2197.2" cy="58" r="9" fill="#1A1A1A"/>
<text x="2213.2" y="63" class="leg" text-anchor="start">Branch</text>
<text x="2550" y="104" class="colh" text-anchor="end">COLOUR = WHO OWNS THE TRUTH</text>
<text x="2550" y="128" class="key" text-anchor="end">COUNT = WORKBOOK VARIABLES BEHIND IT</text>
<line x1="50" y1="158" x2="2550" y2="158" stroke="#C9CCC5" stroke-width="1.4"/>
<text x="330" y="206" class="colhb" text-anchor="start">ALREADY IN A SYSTEM</text>
<text x="330" y="226" class="sub" text-anchor="start">HCHB · Workday · the 485 — a tool can read it today</text>
<text x="2550" y="206" class="pnl" text-anchor="end">HELD BY ONE PERSON</text>
<text x="2550" y="226" class="sub" text-anchor="end">tacit, patient-held — a tool can only ask for it</text>
<text x="1440.0" y="208" class="key" text-anchor="middle">EVERY ROW BELOW RUNS LEFT TO RIGHT ALONG THIS LINE</text>
<line x1="330" y1="246" x2="2520" y2="246" stroke="#5A6560" stroke-width="1.6" marker-end="url(#arm)"/>
<rect x="50" y="288" width="2500" height="300" rx="10" fill="#E9E9E5"/>
<text x="72" y="324" class="tier" text-anchor="start">THE GIVENS</text>
<text x="72" y="346" class="sub" text-anchor="start">fixed before scheduling begins</text>
<text x="2528" y="324" class="bandhi" text-anchor="end">CHANGING ONE NEEDS A NEW ORDER, A PAYER DECISION, OR A CHANGE IN THE PATIENT'S LIFE</text>
<rect x="330.0" y="370" width="487.5" height="70" rx="5" fill="#795CA7"/>
<text x="573.75" y="401.5" class="bt" style="fill:#fff" text-anchor="middle">Regulatory</text>
<text x="573.75" y="420.5" class="bt" style="fill:#fff" text-anchor="middle">Timing</text>
<text x="573.75" y="458" class="trg" text-anchor="middle">3 VARS · ALL IN SYSTEM</text>
<text x="330.0" y="480" class="sub" text-anchor="start">· SOC OASIS inside 48 hours</text>
<text x="330.0" y="497" class="sub" text-anchor="start">· The 5-day recert window</text>
<text x="330.0" y="514" class="sub" text-anchor="start">· Missed-visit documentation</text>
<rect x="907.5" y="370" width="487.5" height="70" rx="5" fill="#792E2E"/>
<text x="1151.25" y="401.5" class="bt" style="fill:#fff" text-anchor="middle">Ordered</text>
<text x="1151.25" y="420.5" class="bt" style="fill:#fff" text-anchor="middle">Frequency</text>
<text x="1151.25" y="458" class="trg" text-anchor="middle">3 VARS · IN THE 485</text>
<text x="907.5" y="480" class="sub" text-anchor="start">· 2x a week means 2x a week</text>
<text x="907.5" y="497" class="sub" text-anchor="start">· Changing it needs a new order</text>
<text x="907.5" y="514" class="sub" text-anchor="start">· Compliance window per discipline</text>
<rect x="1485.0" y="370" width="487.5" height="70" rx="5" fill="#792E2E"/>
<text x="1728.75" y="411.0" class="bt" style="fill:#fff" text-anchor="middle">MD Orders</text>
<text x="1728.75" y="458" class="trg" text-anchor="middle">3 VARS · ALL HARD</text>
<text x="1485.0" y="480" class="sub" text-anchor="start">· Wound care every 3 days</text>
<text x="1485.0" y="497" class="sub" text-anchor="start">· Labs before the MD visit</text>
<text x="1485.0" y="514" class="sub" text-anchor="start">· Protocol-driven timing</text>
<rect x="2062.5" y="370" width="487.5" height="70" rx="5" fill="#4E8A5B"/>
<text x="2306.25" y="401.5" class="bt" style="fill:#fff" text-anchor="middle">Patient hard</text>
<text x="2306.25" y="420.5" class="bt" style="fill:#fff" text-anchor="middle">constraints</text>
<text x="2306.25" y="458" class="trg" text-anchor="middle">5 VARS · 4 TACIT · 0 IN SYSTEM</text>
<text x="2062.5" y="480" class="sub" text-anchor="start">· Dialysis · MD appointments</text>
<text x="2062.5" y="497" class="sub" text-anchor="start">· Caregiver must be present</text>
<text x="2062.5" y="514" class="sub" text-anchor="start">· Cognitive windows</text>
<text x="2062.5" y="531" class="sub" text-anchor="start">· Day-of-week constraints</text>
<text x="72" y="568" class="hi" text-anchor="start">Ordered frequency is an order, not a preference. Seeing a patient fewer times than ordered is a compliance problem, not a scheduling choice.</text>
<rect x="50" y="614" width="2500" height="300" rx="10" fill="#E9E9E5"/>
<text x="72" y="650" class="tier" text-anchor="start">THE DECISION</text>
<text x="72" y="672" class="sub" text-anchor="start">the only real degrees of freedom</text>
<text x="2528" y="650" class="bandhi" text-anchor="end">THIS IS THE WHOLE OF WHAT A SCHEDULER OR A CLINICIAN ACTUALLY CHOOSES</text>
<rect x="330.0" y="696" width="396.0" height="70" rx="5" fill="#C6A01F"/>
<text x="528.0" y="737.0" class="bt" style="fill:#fff" text-anchor="middle">Geography</text>
<text x="528.0" y="784" class="trg" text-anchor="middle">6 VARS · 4 COMPUTABLE</text>
<text x="330.0" y="806" class="sub" text-anchor="start">· Drive time, not distance</text>
<text x="330.0" y="823" class="sub" text-anchor="start">· Zip · territory · home base</text>
<text x="330.0" y="840" class="sub" text-anchor="start">· Bridges · rivers · crossings</text>
<rect x="786.0" y="696" width="396.0" height="70" rx="5" fill="#792E2E"/>
<text x="984.0" y="727.5" class="bt" style="fill:#fff" text-anchor="middle">Which</text>
<text x="984.0" y="746.5" class="bt" style="fill:#fff" text-anchor="middle">clinician</text>
<text x="984.0" y="784" class="trg" text-anchor="middle">4 VARS</text>
<text x="786.0" y="806" class="sub" text-anchor="start">· Discipline / role match</text>
<text x="786.0" y="823" class="sub" text-anchor="start">· Specialty competency</text>
<text x="786.0" y="840" class="sub" text-anchor="start">· Continuity of care</text>
<text x="786.0" y="857" class="sub" text-anchor="start">· Around other disciplines</text>
<rect x="1242.0" y="696" width="396.0" height="70" rx="5" fill="#2E599D"/>
<text x="1440.0" y="727.5" class="bt" style="fill:#fff" text-anchor="middle">Which days inside</text>
<text x="1440.0" y="746.5" class="bt" style="fill:#fff" text-anchor="middle">the ordered window</text>
<text x="1440.0" y="784" class="trg" text-anchor="middle">3 VARS</text>
<text x="1242.0" y="806" class="sub" text-anchor="start">· Spread, not compressed</text>
<text x="1242.0" y="823" class="sub" text-anchor="start">· Front-load vs the LUPA floor</text>
<text x="1242.0" y="840" class="sub" text-anchor="start">· Day-by-day balancing</text>
<rect x="1698.0" y="696" width="396.0" height="70" rx="5" fill="#2E599D"/>
<text x="1896.0" y="727.5" class="bt" style="fill:#fff" text-anchor="middle">Who first when</text>
<text x="1896.0" y="746.5" class="bt" style="fill:#fff" text-anchor="middle">the week is tight</text>
<text x="1896.0" y="784" class="trg" text-anchor="middle">3 VARS · ALL TACIT</text>
<text x="1698.0" y="806" class="sub" text-anchor="start">· Who is unstable</text>
<text x="1698.0" y="823" class="sub" text-anchor="start">· Hospitalisation risk</text>
<text x="1698.0" y="840" class="sub" text-anchor="start">· Who can safely wait</text>
<rect x="2154.0" y="696" width="396.0" height="70" rx="5" fill="#4E8A5B"/>
<text x="2352.0" y="727.5" class="bt" style="fill:#fff" text-anchor="middle">What time inside</text>
<text x="2352.0" y="746.5" class="bt" style="fill:#fff" text-anchor="middle">the patient's window</text>
<text x="2352.0" y="784" class="trg" text-anchor="middle">5 VARS · 0 IN SYSTEM</text>
<text x="2154.0" y="806" class="sub" text-anchor="start">· “Can you come after lunch?”</text>
<text x="2154.0" y="823" class="sub" text-anchor="start">· “Not first thing”</text>
<text x="2154.0" y="840" class="sub" text-anchor="start">· A preferred time, no reason given</text>
<text x="72" y="894" class="hi" text-anchor="start">The left of this row is already in a system. The right of it is held by one person and written down nowhere — and it is where the week is actually won or lost.</text>
<rect x="50" y="940" width="2500" height="176" rx="10" fill="none" stroke="#1A1A1A" stroke-width="2"/>
<text x="72" y="976" class="tier" text-anchor="start">THE RESULT</text>
<text x="72" y="998" class="sub" text-anchor="start">derived, not chosen</text>
<rect x="330" y="970" width="480" height="70" rx="5" fill="#1A1A1A"/>
<text x="570.0" y="1011.0" class="bt" style="fill:#fff" text-anchor="middle">Productivity</text>
<text x="570" y="1058" class="trg" text-anchor="middle">6 OF 8 ALREADY IN SYSTEM</text>
<text x="330" y="1080" class="sub" text-anchor="start">· Points · target · ceiling</text>
<text x="330" y="1097" class="sub" text-anchor="start">· Committed load · pace vs schedule</text>
<text x="890" y="996" class="kh" text-anchor="start">Productivity is what is left after the givens are obeyed and the decision is made.</text>
<text x="890" y="1020" class="sub" text-anchor="start">It is measured, not selected — which is why pushing on it directly moves nothing. It moves when the decision row gets better information.</text>
<text x="890" y="1054" class="sub" text-anchor="start">Six of its eight variables are already in a system today. The constraint is not the data — it is that nobody sees the trade before the day is built.</text>
<rect x="50" y="1146" width="2500" height="290" rx="10" fill="none" stroke="#792E2E" stroke-width="2"/>
<text x="72" y="1182" class="pnl" text-anchor="start">WHERE THE DECISION COLLIDES WITH ITSELF  —  six that happen every week</text>
<text x="2528" y="1182" class="bandhi" text-anchor="end">EACH ONE IS RESOLVED BY ONE PERSON, THE NIGHT BEFORE</text>
<rect x="72.0" y="1208" width="394.3333333333333" height="26" rx="13" fill="#795CA7"/>
<text x="269.16666666666663" y="1226" class="chp" text-anchor="middle">Regulatory Timing</text>
<text x="269.16666666666663" y="1258" class="xs" text-anchor="middle">✕</text>
<rect x="72.0" y="1266" width="394.3333333333333" height="26" rx="13" fill="#C6A01F"/>
<text x="269.16666666666663" y="1284" class="chp" text-anchor="middle">Geography</text>
<text x="269.16666666666663" y="1322" class="kh" text-anchor="middle">SOC OASIS due in 48 hours,</text>
<text x="269.16666666666663" y="1339" class="kh" text-anchor="middle">patient is 50 minutes out</text>
<text x="269.16666666666663" y="1366" class="sub" text-anchor="middle">Someone drives it, or the</text>
<text x="269.16666666666663" y="1382" class="sub" text-anchor="middle">assessment is late. There is no</text>
<text x="269.16666666666663" y="1398" class="sub" text-anchor="middle">third option.</text>
<rect x="484.3333333333333" y="1208" width="394.3333333333333" height="26" rx="13" fill="#4E8A5B"/>
<text x="681.5" y="1226" class="chp" text-anchor="middle">Patient window</text>
<text x="681.5" y="1258" class="xs" text-anchor="middle">✕</text>
<rect x="484.3333333333333" y="1266" width="394.3333333333333" height="26" rx="13" fill="#C6A01F"/>
<text x="681.5" y="1284" class="chp" text-anchor="middle">Geography</text>
<text x="681.5" y="1322" class="kh" text-anchor="middle">The 2pm-only patient breaks</text>
<text x="681.5" y="1339" class="kh" text-anchor="middle">the cluster</text>
<text x="681.5" y="1366" class="sub" text-anchor="middle">The clinician absorbs the drive,</text>
<text x="681.5" y="1382" class="sub" text-anchor="middle">or the patient waits a day.</text>
<rect x="896.6666666666666" y="1208" width="394.3333333333333" height="26" rx="13" fill="#792E2E"/>
<text x="1093.8333333333333" y="1226" class="chp" text-anchor="middle">Ordered Frequency</text>
<text x="1093.8333333333333" y="1258" class="xs" text-anchor="middle">✕</text>
<rect x="896.6666666666666" y="1266" width="394.3333333333333" height="26" rx="13" fill="#792E2E"/>
<text x="1093.8333333333333" y="1284" class="chp" text-anchor="middle">Care team</text>
<text x="1093.8333333333333" y="1322" class="kh" text-anchor="middle">PT and OT are both ordered</text>
<text x="1093.8333333333333" y="1339" class="kh" text-anchor="middle">2x a week</text>
<text x="1093.8333333333333" y="1366" class="sub" text-anchor="middle">Both want the same two days.</text>
<text x="1093.8333333333333" y="1382" class="sub" text-anchor="middle">Whoever schedules first wins.</text>
<rect x="1309.0" y="1208" width="394.3333333333333" height="26" rx="13" fill="#2E599D"/>
<text x="1506.1666666666667" y="1226" class="chp" text-anchor="middle">Who first</text>
<text x="1506.1666666666667" y="1258" class="xs" text-anchor="middle">✕</text>
<rect x="1309.0" y="1266" width="394.3333333333333" height="26" rx="13" fill="#1A1A1A"/>
<text x="1506.1666666666667" y="1284" class="chp" text-anchor="middle">Productivity</text>
<text x="1506.1666666666667" y="1322" class="kh" text-anchor="middle">The unstable patient takes</text>
<text x="1506.1666666666667" y="1339" class="kh" text-anchor="middle">90 minutes</text>
<text x="1506.1666666666667" y="1366" class="sub" text-anchor="middle">Same points as a 40-minute visit.</text>
<text x="1506.1666666666667" y="1382" class="sub" text-anchor="middle">The clinician simply runs late.</text>
<rect x="1721.3333333333333" y="1208" width="394.3333333333333" height="26" rx="13" fill="#792E2E"/>
<text x="1918.5" y="1226" class="chp" text-anchor="middle">MD Orders</text>
<text x="1918.5" y="1258" class="xs" text-anchor="middle">✕</text>
<rect x="1721.3333333333333" y="1266" width="394.3333333333333" height="26" rx="13" fill="#4E8A5B"/>
<text x="1918.5" y="1284" class="chp" text-anchor="middle">Patient constraints</text>
<text x="1918.5" y="1322" class="kh" text-anchor="middle">Wound care every 3 days,</text>
<text x="1918.5" y="1339" class="kh" text-anchor="middle">caregiver only weekends</text>
<text x="1918.5" y="1366" class="sub" text-anchor="middle">Negotiated on the phone, agreed</text>
<text x="1918.5" y="1382" class="sub" text-anchor="middle">verbally, written down nowhere.</text>
<rect x="2133.6666666666665" y="1208" width="394.3333333333333" height="26" rx="13" fill="#792E2E"/>
<text x="2330.833333333333" y="1226" class="chp" text-anchor="middle">Ordered Frequency</text>
<text x="2330.833333333333" y="1258" class="xs" text-anchor="middle">✕</text>
<rect x="2133.6666666666665" y="1266" width="394.3333333333333" height="26" rx="13" fill="#795CA7"/>
<text x="2330.833333333333" y="1284" class="chp" text-anchor="middle">Regulatory Timing</text>
<text x="2330.833333333333" y="1322" class="kh" text-anchor="middle">3x a week ordered, recert</text>
<text x="2330.833333333333" y="1339" class="kh" text-anchor="middle">visit lands the same week</text>
<text x="2330.833333333333" y="1366" class="sub" text-anchor="middle">The LUPA floor, the order and the</text>
<text x="2330.833333333333" y="1382" class="sub" text-anchor="middle">window all bind at once.</text>
<line x1="50" y1="1470" x2="2550" y2="1470" stroke="#C9CCC5" stroke-width="1.4"/>
<text x="72" y="1512" class="trg" text-anchor="start">TODAY</text>
<rect x="190" y="1488" width="640" height="64" rx="5" fill="#2E599D"/>
<text x="510.0" y="1517.25" class="bt s" style="fill:#fff" text-anchor="middle">One clinician resolves all six — the night before,</text>
<text x="510.0" y="1532.75" class="bt s" style="fill:#fff" text-anchor="middle">in their head, written down nowhere</text>
<text x="190" y="1574" class="sub" text-anchor="start">the weekly logic is undocumented and entirely unassisted</text>
<text x="880" y="1512" class="trg" text-anchor="start">THE TOOL</text>
<rect x="1010" y="1488" width="700" height="64" rx="5" fill="#A6E22E"/>
<text x="1360.0" y="1517.25" class="bt s" style="fill:#1B211E" text-anchor="middle">It shows the collision before the day is built, and prices</text>
<text x="1360.0" y="1532.75" class="bt s" style="fill:#1B211E" text-anchor="middle">both sides. The clinician still decides.</text>
<text x="1010" y="1574" class="sub" text-anchor="start">release 1 is visualisation only — seeing the trade is the whole of it</text>
<text x="1760" y="1512" class="trg" text-anchor="start">NEXT</text>
<rect x="1860" y="1488" width="690" height="64" rx="5" fill="#C6A01F"/>
<text x="2205.0" y="1517.25" class="bt s" style="fill:#fff" text-anchor="middle">Each collision becomes an engagement map: a named</text>
<text x="2205.0" y="1532.75" class="bt s" style="fill:#fff" text-anchor="middle">owner, a named moment, a named ask</text>
<text x="1860" y="1574" class="sub" text-anchor="start">what this sheet exists to carry</text>
<line x1="50" y1="1602" x2="2550" y2="1602" stroke="#C9CCC5" stroke-width="1.4"/>
<text x="50" y="1630" class="foot" text-anchor="start">FOUNDATION SHEET · patient scheduling · variable counts and in-system / tacit tags from the capacity &amp; scheduling workbook inventory</text>
<text x="2550" y="1630" class="foot" text-anchor="end">Every patient visit</text>
</svg>
</figure>

<style>
:root{--paper:#F2F3EF;--rule:#D8DAD2;
--shadow:0 1px 2px rgba(23,30,26,.05),0 12px 34px -22px rgba(23,30,26,.35);
--body:"Avenir Next",Avenir,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
--display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
--mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#101412;--rule:#2C342E;
--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px -22px rgba(0,0,0,.85);}}
:root[data-theme="dark"]{--paper:#101412;--rule:#2C342E;
--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px -22px rgba(0,0,0,.85);}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);font-family:var(--body);
padding:clamp(10px,2vw,32px);-webkit-font-smoothing:antialiased}
figure{margin:0 auto;max-width:1900px;border:1px solid var(--rule);border-radius:12px;
box-shadow:var(--shadow);overflow-x:auto;background:#FBFBF8}
svg{display:block;width:100%;min-width:1180px;height:auto}
/* --- in-SVG type. units are points on the output sheet --- */
.bt{font-family:var(--body);font-size:16px;font-weight:600;fill:#fff}
.bt.s{font-size:13.5px}
.dt{font-family:var(--body);font-size:15px;font-weight:600;fill:#1B211E}
.ct{font-family:var(--body);font-size:15px;font-weight:600}
.bdg{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.03em}
.ln{stroke:#1B211E;stroke-width:2}
.lb{font-family:var(--mono);font-size:13.5px;fill:#5A6560}
.conn{font-family:var(--mono);font-size:13.5px;fill:#5A6560}
.leg{font-family:var(--body);font-size:15.5px;font-weight:600;fill:#1B211E}
.key{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;fill:#7C8781}
.band{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.12em;fill:#5A6560}
.trg{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.16em;fill:#7C8781}
