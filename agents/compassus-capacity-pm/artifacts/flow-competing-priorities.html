<text x="72" y="409" class="sub" text-anchor="start">before any of it</text>
<text x="72" y="426" class="sub" text-anchor="start">can be placed</text>
<text x="2528" y="346" class="bandhi" text-anchor="end">EIGHT QUESTIONS  ·  NONE OF THEM OPTIONAL</text>
<circle cx="346.0" cy="372" r="13" fill="#FFFFFF" stroke="#792E2E" stroke-width="2"/>
<text x="346.0" y="377" class="bdg" text-anchor="middle">1</text>
<rect x="330.0" y="382" width="256.5" height="52" rx="5" fill="#792E2E"/>
<text x="458.25" y="413.0" class="bt s" style="fill:#fff" text-anchor="middle">Frequency</text>
<text x="330.0" y="460" class="kh" text-anchor="start">Do I owe this patient a</text>
<text x="330.0" y="478" class="kh" text-anchor="start">visit tomorrow?</text>
<text x="330.0" y="504" class="sub" text-anchor="start">Ordered 2x a week — how many</text>
<text x="330.0" y="520" class="sub" text-anchor="start">are already done, how many</text>
<text x="330.0" y="536" class="sub" text-anchor="start">days are left.</text>
<rect x="330.0" y="604" width="256.5" height="30" rx="6" fill="#FFFFFF" stroke="#C9CCC5" stroke-width="1.3"/>
<text x="458.25" y="624" class="vid" text-anchor="middle">HCHB · the 485</text>
<circle cx="626.5" cy="372" r="13" fill="#FFFFFF" stroke="#795CA7" stroke-width="2"/>
<text x="626.5" y="377" class="bdg" text-anchor="middle">2</text>
<rect x="610.5" y="382" width="256.5" height="52" rx="5" fill="#795CA7"/>
<text x="738.75" y="405.25" class="bt s" style="fill:#fff" text-anchor="middle">Regulatory</text>
<text x="738.75" y="420.75" class="bt s" style="fill:#fff" text-anchor="middle">timing</text>
<text x="610.5" y="460" class="kh" text-anchor="start">Is a window binding on</text>
<text x="610.5" y="478" class="kh" text-anchor="start">this one?</text>
<text x="610.5" y="504" class="sub" text-anchor="start">SOC OASIS inside 48 hours. The</text>
<text x="610.5" y="520" class="sub" text-anchor="start">recert visit in the last 5</text>
<text x="610.5" y="536" class="sub" text-anchor="start">days of the period.</text>
<rect x="610.5" y="604" width="256.5" height="30" rx="6" fill="#FFFFFF" stroke="#C9CCC5" stroke-width="1.3"/>
<text x="738.75" y="624" class="vid" text-anchor="middle">HCHB</text>
<circle cx="907.0" cy="372" r="13" fill="#FFFFFF" stroke="#792E2E" stroke-width="2"/>
<text x="907.0" y="377" class="bdg" text-anchor="middle">3</text>
<rect x="891.0" y="382" width="256.5" height="52" rx="5" fill="#792E2E"/>
<text x="1019.25" y="413.0" class="bt s" style="fill:#fff" text-anchor="middle">MD orders</text>
<text x="891.0" y="460" class="kh" text-anchor="start">What does the visit have</text>
<text x="891.0" y="478" class="kh" text-anchor="start">to include?</text>
<text x="891.0" y="504" class="sub" text-anchor="start">Wound care every 3 days. Labs</text>
<text x="891.0" y="520" class="sub" text-anchor="start">before the MD appointment.</text>
<text x="891.0" y="536" class="sub" text-anchor="start">Protocol timing.</text>
<rect x="891.0" y="604" width="256.5" height="30" rx="6" fill="#FFFFFF" stroke="#C9CCC5" stroke-width="1.3"/>
<text x="1019.25" y="624" class="vid" text-anchor="middle">The 485</text>
<circle cx="1187.5" cy="372" r="13" fill="#FFFFFF" stroke="#2E599D" stroke-width="2"/>
<text x="1187.5" y="377" class="bdg" text-anchor="middle">4</text>
<rect x="1171.5" y="382" width="256.5" height="52" rx="5" fill="#2E599D"/>
<text x="1299.75" y="413.0" class="bt s" style="fill:#fff" text-anchor="middle">How urgent</text>
<text x="1171.5" y="460" class="kh" text-anchor="start">Can this patient safely</text>
<text x="1171.5" y="478" class="kh" text-anchor="start">wait a day?</text>
<text x="1171.5" y="504" class="sub" text-anchor="start">How they looked last visit.</text>
<text x="1171.5" y="520" class="sub" text-anchor="start">Wound status. Whether the</text>
<text x="1171.5" y="536" class="sub" text-anchor="start">family sounded worried.</text>
<rect x="1171.5" y="604" width="256.5" height="30" rx="6" fill="#FFFFFF" stroke="#C9CCC5" stroke-width="1.3"/>
<text x="1299.75" y="624" class="vid" text-anchor="middle">Last visit · my memory</text>
<circle cx="1468.0" cy="372" r="13" fill="#FFFFFF" stroke="#795CA7" stroke-width="2"/>
<text x="1468.0" y="377" class="bdg" text-anchor="middle">5</text>
<rect x="1452.0" y="382" width="256.5" height="52" rx="5" fill="#795CA7"/>
<text x="1580.25" y="413.0" class="bt s" style="fill:#fff" text-anchor="middle">Care team</text>
<text x="1452.0" y="460" class="kh" text-anchor="start">Is another discipline</text>
<text x="1452.0" y="478" class="kh" text-anchor="start">going this week?</text>
<text x="1452.0" y="504" class="sub" text-anchor="start">PT was Monday. If I go</text>
<text x="1452.0" y="520" class="sub" text-anchor="start">tomorrow the patient has two</text>
<text x="1452.0" y="536" class="sub" text-anchor="start">visits and then nothing.</text>
<rect x="1452.0" y="604" width="256.5" height="30" rx="6" fill="#FFFFFF" stroke="#C9CCC5" stroke-width="1.3"/>
<text x="1580.25" y="624" class="vid" text-anchor="middle">HCHB calendar</text>
<circle cx="1748.5" cy="372" r="13" fill="#FFFFFF" stroke="#4E8A5B" stroke-width="2"/>
<text x="1748.5" y="377" class="bdg" text-anchor="middle">6</text>
<rect x="1732.5" y="382" width="256.5" height="52" rx="5" fill="#4E8A5B"/>
<text x="1860.75" y="405.25" class="bt s" style="fill:#fff" text-anchor="middle">Patient</text>
<text x="1860.75" y="420.75" class="bt s" style="fill:#fff" text-anchor="middle">availability</text>
<text x="1732.5" y="460" class="kh" text-anchor="start">When can they actually be</text>
<text x="1732.5" y="478" class="kh" text-anchor="start">seen?</text>
<text x="1732.5" y="504" class="sub" text-anchor="start">Dialysis days. Caregiver</text>
<text x="1732.5" y="520" class="sub" text-anchor="start">hours. Appointments. “Not</text>
<text x="1732.5" y="536" class="sub" text-anchor="start">first thing.”</text>
<rect x="1732.5" y="604" width="256.5" height="30" rx="6" fill="#F4FBE6" stroke="#5F8A12" stroke-width="2.2"/>
<text x="1860.75" y="624" class="bdg" text-anchor="middle">A PHONE CALL</text>
<circle cx="2029.0" cy="372" r="13" fill="#FFFFFF" stroke="#C6A01F" stroke-width="2"/>
<text x="2029.0" y="377" class="bdg" text-anchor="middle">7</text>
<rect x="2013.0" y="382" width="256.5" height="52" rx="5" fill="#C6A01F"/>
<text x="2141.25" y="413.0" class="bt s" style="fill:#fff" text-anchor="middle">Geography</text>
<text x="2013.0" y="460" class="kh" text-anchor="start">Where are they, and who is</text>
<text x="2013.0" y="478" class="kh" text-anchor="start">near them?</text>
<text x="2013.0" y="504" class="sub" text-anchor="start">Drive time, not distance.</text>
<text x="2013.0" y="520" class="sub" text-anchor="start">Which other patients fall on</text>
<text x="2013.0" y="536" class="sub" text-anchor="start">the same run.</text>
<rect x="2013.0" y="604" width="256.5" height="30" rx="6" fill="#FFFFFF" stroke="#C9CCC5" stroke-width="1.3"/>
<text x="2141.25" y="624" class="vid" text-anchor="middle">HCHB address · the roads</text>
<circle cx="2309.5" cy="372" r="13" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
<text x="2309.5" y="377" class="bdg" text-anchor="middle">8</text>
<rect x="2293.5" y="382" width="256.5" height="52" rx="5" fill="#1A1A1A"/>
<text x="2421.75" y="413.0" class="bt s" style="fill:#fff" text-anchor="middle">What it costs</text>
<text x="2293.5" y="460" class="kh" text-anchor="start">What will this visit take</text>
<text x="2293.5" y="478" class="kh" text-anchor="start">out of my day?</text>
<text x="2293.5" y="504" class="sub" text-anchor="start">Points, and the honest minutes</text>
<text x="2293.5" y="520" class="sub" text-anchor="start">— visit, drive, and the</text>
<text x="2293.5" y="536" class="sub" text-anchor="start">documentation after.</text>
<rect x="2293.5" y="604" width="256.5" height="30" rx="6" fill="#FFFFFF" stroke="#C9CCC5" stroke-width="1.3"/>
<text x="2421.75" y="624" class="vid" text-anchor="middle">HCHB points · experience</text>
<text x="330" y="594" class="key" text-anchor="start">WHERE THE ANSWER LIVES</text>
<rect x="50" y="680" width="2500" height="150" rx="10" fill="none" stroke="#5F8A12" stroke-width="2"/>
<text x="100" y="744" class="big" text-anchor="start">8 questions  ×  16 patients</text>
<text x="100" y="776" class="kh" text-anchor="start">≈ 128 judgments before tomorrow exists — every evening, on the clinician's own time</text>
<line x1="820" y1="704" x2="820" y2="806" stroke="#C9CCC5" stroke-width="1.6"/>
<text x="870" y="728" class="kh" text-anchor="start">Seven of the eight answers are already on a screen.</text>
<text x="870" y="752" class="sub" text-anchor="start">The eighth is only on the phone — and that single call is why the whole pass happens the night before, after hours,</text>
<text x="870" y="770" class="sub" text-anchor="start">one patient at a time. It is also the only point in the day where the patient has any say in when they are seen.</text>
<rect x="870" y="784" width="640" height="28" rx="6" fill="#F4FBE6" stroke="#5F8A12" stroke-width="2"/>
<text x="1190" y="803" class="bdg" text-anchor="middle">THIS IS WHERE THE ENGAGEMENT MAPS ATTACH</text>
<rect x="50" y="860" width="2500" height="320" rx="10" fill="none" stroke="#792E2E" stroke-width="2"/>
<text x="72" y="896" class="pnl" text-anchor="start">THEN THE ANSWERS HAVE TO FIT INTO ONE DAY  —  six that recur every week</text>
<text x="2528" y="896" class="bandhi" text-anchor="end">ONE PERSON RESOLVES ALL SIX, ALONE, THE NIGHT BEFORE</text>
<rect x="72.0" y="924" width="394.3333333333333" height="26" rx="13" fill="#4E8A5B"/>
<text x="269.16666666666663" y="942" class="chp" text-anchor="middle">Patient availability</text>
<text x="269.16666666666663" y="974" class="xs" text-anchor="middle">✕</text>
<rect x="72.0" y="982" width="394.3333333333333" height="26" rx="13" fill="#4E8A5B"/>
<text x="269.16666666666663" y="1000" class="chp" text-anchor="middle">Patient availability</text>
<text x="269.16666666666663" y="1042" class="kh" text-anchor="middle">Two patients, one 2pm</text>
<text x="269.16666666666663" y="1068" class="sub" text-anchor="middle">Both can only be seen after</text>
<text x="269.16666666666663" y="1084" class="sub" text-anchor="middle">lunch. One of them moves to</text>
<text x="269.16666666666663" y="1100" class="sub" text-anchor="middle">another day.</text>
<rect x="484.3333333333333" y="924" width="394.3333333333333" height="26" rx="13" fill="#4E8A5B"/>
<text x="681.5" y="942" class="chp" text-anchor="middle">Patient availability</text>
<text x="681.5" y="974" class="xs" text-anchor="middle">✕</text>
<rect x="484.3333333333333" y="982" width="394.3333333333333" height="26" rx="13" fill="#C6A01F"/>
<text x="681.5" y="1000" class="chp" text-anchor="middle">Geography</text>
<text x="681.5" y="1042" class="kh" text-anchor="middle">The cluster breaks</text>
<text x="681.5" y="1068" class="sub" text-anchor="middle">The 2pm patient is 40 minutes</text>
<text x="681.5" y="1084" class="sub" text-anchor="middle">from the rest of the run. The</text>
<text x="681.5" y="1100" class="sub" text-anchor="middle">day loses an hour.</text>
<rect x="896.6666666666666" y="924" width="394.3333333333333" height="26" rx="13" fill="#792E2E"/>
<text x="1093.8333333333333" y="942" class="chp" text-anchor="middle">Frequency</text>
<text x="1093.8333333333333" y="974" class="xs" text-anchor="middle">✕</text>
<rect x="896.6666666666666" y="982" width="394.3333333333333" height="26" rx="13" fill="#795CA7"/>
<text x="1093.8333333333333" y="1000" class="chp" text-anchor="middle">Care team</text>
<text x="1093.8333333333333" y="1042" class="kh" text-anchor="middle">PT and OT both ordered</text>
<text x="1093.8333333333333" y="1060" class="kh" text-anchor="middle">2x</text>
<text x="1093.8333333333333" y="1086" class="sub" text-anchor="middle">Both want the same two days.</text>
<text x="1093.8333333333333" y="1102" class="sub" text-anchor="middle">The patient gets two visits,</text>
<text x="1093.8333333333333" y="1118" class="sub" text-anchor="middle">then nothing.</text>
<rect x="1309.0" y="924" width="394.3333333333333" height="26" rx="13" fill="#2E599D"/>
<text x="1506.1666666666667" y="942" class="chp" text-anchor="middle">How urgent</text>
<text x="1506.1666666666667" y="974" class="xs" text-anchor="middle">✕</text>
<rect x="1309.0" y="982" width="394.3333333333333" height="26" rx="13" fill="#1A1A1A"/>
<text x="1506.1666666666667" y="1000" class="chp" text-anchor="middle">What it costs</text>
<text x="1506.1666666666667" y="1042" class="kh" text-anchor="middle">The unstable patient</text>
<text x="1506.1666666666667" y="1060" class="kh" text-anchor="middle">runs long</text>
<text x="1506.1666666666667" y="1086" class="sub" text-anchor="middle">Ninety minutes, same points as</text>
<text x="1506.1666666666667" y="1102" class="sub" text-anchor="middle">forty. Everything after it</text>
<text x="1506.1666666666667" y="1118" class="sub" text-anchor="middle">slides.</text>
<rect x="1721.3333333333333" y="924" width="394.3333333333333" height="26" rx="13" fill="#792E2E"/>
<text x="1918.5" y="942" class="chp" text-anchor="middle">MD orders</text>
<text x="1918.5" y="974" class="xs" text-anchor="middle">✕</text>
<rect x="1721.3333333333333" y="982" width="394.3333333333333" height="26" rx="13" fill="#4E8A5B"/>
<text x="1918.5" y="1000" class="chp" text-anchor="middle">Patient availability</text>
<text x="1918.5" y="1042" class="kh" text-anchor="middle">Wound care q3d,</text>
<text x="1918.5" y="1060" class="kh" text-anchor="middle">caregiver weekends</text>
<text x="1918.5" y="1086" class="sub" text-anchor="middle">The order and the caregiver's</text>
<text x="1918.5" y="1102" class="sub" text-anchor="middle">hours do not overlap. Agreed on</text>
<text x="1918.5" y="1118" class="sub" text-anchor="middle">the phone, recorded nowhere.</text>
<rect x="2133.6666666666665" y="924" width="394.3333333333333" height="26" rx="13" fill="#792E2E"/>
<text x="2330.833333333333" y="942" class="chp" text-anchor="middle">Frequency</text>
<text x="2330.833333333333" y="974" class="xs" text-anchor="middle">✕</text>
<rect x="2133.6666666666665" y="982" width="394.3333333333333" height="26" rx="13" fill="#795CA7"/>
<text x="2330.833333333333" y="1000" class="chp" text-anchor="middle">Regulatory timing</text>
<text x="2330.833333333333" y="1042" class="kh" text-anchor="middle">Recert week, 3x ordered</text>
<text x="2330.833333333333" y="1068" class="sub" text-anchor="middle">The LUPA floor, the ordered</text>
<text x="2330.833333333333" y="1084" class="sub" text-anchor="middle">frequency and the recert window</text>
<text x="2330.833333333333" y="1100" class="sub" text-anchor="middle">all bind at once.</text>
<text x="72" y="1158" class="hi" text-anchor="start">None of these are visible until the clinician tries to place the last patient — by then the first seven are already committed.</text>

<text x="550.0" y="1277.75" class="bt s" style="fill:#fff" text-anchor="middle">— and a list of who got moved</text>

<text x="890" y="1257" class="trg" text-anchor="start">THE RESIDUE</text>
<text x="890" y="1281" class="sub" text-anchor="start">Who was called and put off · what the caregiver agreed to · why the cluster broke · which visit is now at risk of the LUPA floor.</text>
<text x="890" y="1301" class="sub" text-anchor="start">None of it is written down, so tomorrow evening the same eight questions get asked again with no memory of tonight's answers.</text>
