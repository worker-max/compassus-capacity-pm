<svg viewBox="0 0 2600 1970" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Payer economics mapped against the schedule, current state. Five bands. Referral to schedulable: every payer but traditional Medicare routes through the authorisation team, which keys a pending-auth visit count set by the payer. Plan of care: each discipline plots its own frequency to clinical need while the payer rule sits unread in a coordination note written days earlier. Delivery: the same delivered visit carries five different values depending on payer class and period state. The miss: one missed visit means about 25 dollars mid-period or up to 1,386 dollars if it drops the period below its floor. Period end: a new certification period is a new authorisation question and a new case-mix group.">
<defs><marker id="ar" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.5" orient="auto-start-reverse"><polygon points="0,0 10,4 0,8" fill="#1B211E"/></marker></defs>
<rect x="0" y="0" width="2600" height="1970" fill="#FBFBF8"/>
<text x="50" y="58" class="eyebrow" text-anchor="start">COMPASSUS HOME HEALTH  ·  PAYER ECONOMICS</text>
<text x="50" y="100" class="title" text-anchor="start">What the payer does to the schedule</text>
<text x="50" y="128" class="deck" text-anchor="start">The same operational event carries a different consequence in every payer class</text>
<line x1="50" y1="150" x2="2550" y2="150" stroke="#C9CCC5" stroke-width="1.4"/>
<circle cx="1493" cy="72" r="13" fill="#1F6F78"/>
<text x="1514" y="78" class="leg" text-anchor="start">Intake</text>
<circle cx="1613.4" cy="72" r="13" fill="#DF751D"/>
<text x="1634.4" y="78" class="leg" text-anchor="start">Insurance &amp; Auth</text>
<circle cx="1817.8000000000002" cy="72" r="13" fill="#C6A01F"/>
<text x="1838.8000000000002" y="78" class="leg" text-anchor="start">PCC / Scheduler</text>
<circle cx="2013.8000000000002" cy="72" r="13" fill="#2E599D"/>
<text x="2034.8000000000002" y="78" class="leg" text-anchor="start">Clinician</text>
<circle cx="1493" cy="106" r="13" fill="#792E2E"/>
<text x="1514" y="112" class="leg" text-anchor="start">DCS</text>
<circle cx="1588.2" cy="106" r="13" fill="#795CA7"/>
<text x="1609.2" y="112" class="leg" text-anchor="start">HCHB</text>
<rect x="320" y="190" width="1420" height="258" rx="10" fill="#E9E9E5"/>
<text x="342" y="224" class="band" text-anchor="start">1  ·  REFERRAL TO SCHEDULABLE</text>
<text x="1726" y="224" class="bandhi" text-anchor="end">THE GATE IS PAYER-DEPENDENT</text>
<text x="36" y="232" class="trg" text-anchor="start">TRIGGER</text>
<rect x="36" y="248" width="264" height="90" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="168.0" y="289.5" class="ct" text-anchor="middle" fill="#1B211E">Referral accepted</text>
<text x="168.0" y="306.5" class="ct" text-anchor="middle" fill="#1B211E">the clock starts</text>
<line x1="306" y1="293" x2="344" y2="293" class="ln" marker-end="url(#ar)"/>
<rect x="350" y="248" width="250" height="90" rx="6" fill="#1F6F78"/>
<text x="475.0" y="289.5" class="bt" style="fill:#fff" text-anchor="middle">Referral received</text>
<text x="475.0" y="308.5" class="bt" style="fill:#fff" text-anchor="middle">in Commure</text>
<rect x="628" y="248" width="250" height="90" rx="6" fill="#DF751D"/>
<text x="753.0" y="289.5" class="bt" style="fill:#fff" text-anchor="middle">Eligibility verified,</text>
<text x="753.0" y="308.5" class="bt" style="fill:#fff" text-anchor="middle">pending auth keyed</text>
<rect x="752.4" y="234" width="117.60000000000001" height="23" rx="11.5" fill="#FFFFFF" stroke="#DF751D" stroke-width="1.8"/>
<text x="811.2" y="250" class="bdg" text-anchor="middle" fill="#DF751D">NON-MEDICARE</text>
<text x="634" y="364" class="sub">·  allowance set by payer:</text>
<text x="634" y="381" class="sub">·  1, 3, 5 or 10 visits</text>
<text x="634" y="398" class="sub">·  traditional Medicare skips this</text>
<line x1="600" y1="293.0" x2="622" y2="293.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="248" width="250" height="90" rx="6" fill="#1F6F78"/>
<text x="1031.0" y="299.0" class="bt" style="fill:#fff" text-anchor="middle">Final approval</text>
<text x="912" y="364" class="sub">·  returns to intake</text>
<text x="912" y="381" class="sub">·  only now is it schedulable</text>
<line x1="878" y1="293.0" x2="900" y2="293.0" class="ln" marker-end="url(#ar)"/>
<rect x="1184" y="248" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="1309.0" y="299.0" class="bt" style="fill:#fff" text-anchor="middle">Welcome / intake call</text>
<text x="1190" y="364" class="sub">·  is the patient actually home</text>
<text x="1190" y="381" class="sub">·  the one true judgment call</text>
<line x1="1156" y1="293.0" x2="1178" y2="293.0" class="ln" marker-end="url(#ar)"/>
<rect x="1462" y="248" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="1587.0" y="299.0" class="bt" style="fill:#fff" text-anchor="middle">SOC and evals booked</text>
<text x="1468" y="364" class="sub">·  seen within 48 hours</text>
<text x="1468" y="381" class="sub">·  RN at SOC, therapy 1-2 days</text>
<line x1="1434" y1="293.0" x2="1456" y2="293.0" class="ln" marker-end="url(#ar)"/>
<text x="356" y="364" class="sub">·  payer class identified here</text>
<text x="356" y="381" class="sub">·  discharge date captured</text>
<text x="356" y="398" class="sub">·  benefit window may already run</text>
<rect x="320" y="472" width="1142" height="258" rx="10" fill="#E9E9E5"/>
<text x="342" y="506" class="band" text-anchor="start">2  ·  PLAN OF CARE</text>
<text x="1448" y="506" class="bandhi" text-anchor="end">PAYER LIMITS ARE INVISIBLE HERE</text>
<rect x="36" y="530" width="264" height="96" rx="3" fill="#E8EAED" stroke="#C6CBD1" stroke-width="1"/>
<text x="168.0" y="566.0" class="tg" text-anchor="middle">Payer rule already exists</text>
<text x="168.0" y="583.0" class="tg" text-anchor="middle">in a coordination note,</text>
<text x="168.0" y="600.0" class="tg" text-anchor="middle">written days earlier</text>
<line x1="306" y1="575" x2="344" y2="575" class="ln" stroke-dasharray="7 5" opacity=".68" marker-end="url(#ar)"/>
<rect x="350" y="530" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="475.0" y="571.5" class="bt" style="fill:#fff" text-anchor="middle">Each discipline plots</text>
<text x="475.0" y="590.5" class="bt" style="fill:#fff" text-anchor="middle">its own frequency</text>
<rect x="449.5" y="516" width="142.5" height="23" rx="11.5" fill="#FFFFFF" stroke="#2E599D" stroke-width="1.8"/>
<text x="520.75" y="532" class="bdg" text-anchor="middle" fill="#2E599D">x 4 DISCIPLINES</text>
<text x="356" y="646" class="sub">·  written to clinical need</text>
<text x="356" y="663" class="sub">·  the payer ceiling is not here</text>
<text x="356" y="680" class="sub">·  RN also plots aide and MSW</text>
<rect x="628" y="530" width="250" height="90" rx="6" fill="#795CA7"/>
<text x="753.0" y="571.5" class="bt" style="fill:#fff" text-anchor="middle">Workflow fires</text>
<text x="753.0" y="590.5" class="bt" style="fill:#fff" text-anchor="middle">per discipline</text>
<text x="634" y="646" class="sub">·  once at submission,</text>
<text x="634" y="663" class="sub">·  once again at approval</text>
<line x1="600" y1="575.0" x2="622" y2="575.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="530" width="250" height="90" rx="6" fill="#792E2E"/>
<text x="1031.0" y="571.5" class="bt" style="fill:#fff" text-anchor="middle">QA, POC lock, 485,</text>
<text x="1031.0" y="590.5" class="bt" style="fill:#fff" text-anchor="middle">orders to the MD</text>
<rect x="1038.7" y="516" width="109.30000000000001" height="23" rx="11.5" fill="#FFFFFF" stroke="#792E2E" stroke-width="1.8"/>
<text x="1093.35" y="532" class="bdg" text-anchor="middle" fill="#792E2E">ALL AT ONCE</text>
<text x="912" y="646" class="sub">·  a moment, not four gates</text>
<line x1="878" y1="575.0" x2="900" y2="575.0" class="ln" marker-end="url(#ar)"/>
<rect x="1184" y="530" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="1309.0" y="581.0" class="bt" style="fill:#fff" text-anchor="middle">One assignment pass</text>
<text x="1190" y="646" class="sub">·  one task per discipline</text>
<text x="1190" y="663" class="sub">·  assigns all visits at once</text>
<line x1="1156" y1="575.0" x2="1178" y2="575.0" class="ln" marker-end="url(#ar)"/>
<rect x="320" y="754" width="1976" height="176" rx="10" fill="#E9E9E5"/>
<text x="342" y="788" class="band" text-anchor="start">3  ·  WHAT A DELIVERED VISIT IS WORTH</text>
<text x="2282" y="788" class="bandhi" text-anchor="end">SAME VISIT, FIVE DIFFERENT VALUES</text>
<rect x="350" y="812" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="475.0" y="853.5" class="bt" style="fill:#fff" text-anchor="middle">Visit delivered</text>
<text x="475.0" y="872.5" class="bt" style="fill:#fff" text-anchor="middle">and documented</text>
<text x="36" y="828" class="note" text-anchor="start">White outline =</text>
<text x="36" y="850" class="note" text-anchor="start">a payment state,</text>
<text x="36" y="872" class="note" text-anchor="start">not an actor</text>
<rect x="646" y="811" width="300" height="92" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="796.0" y="845.0" class="ct" text-anchor="middle" fill="#1B211E">EPISODIC  ·  BELOW THE FLOOR</text>
<text x="796.0" y="862.0" class="ct" text-anchor="middle" fill="#1B211E">the visit that saves the period</text>
<text x="796.0" y="879.0" class="ct" text-anchor="middle" fill="#1B211E">worth 1,363 dollars</text>
<rect x="968" y="811" width="300" height="92" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1118.0" y="845.0" class="ct" text-anchor="middle" fill="#1B211E">EPISODIC  ·  ABOVE THE FLOOR</text>
<text x="1118.0" y="862.0" class="ct" text-anchor="middle" fill="#1B211E">no further revenue</text>
<text x="1118.0" y="879.0" class="ct" text-anchor="middle" fill="#1B211E">0 dollars, to ~15.8 visits</text>
<rect x="1290" y="811" width="300" height="92" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1440.0" y="853.5" class="ct" text-anchor="middle" fill="#1B211E">PER-VISIT  ·  AUTHORISED</text>
<text x="1440.0" y="870.5" class="ct" text-anchor="middle" fill="#1B211E">worth the contracted rate</text>
<rect x="1612" y="811" width="300" height="92" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1762.0" y="853.5" class="ct" text-anchor="middle" fill="#1B211E">PER-VISIT  ·  NOT AUTHORISED</text>
<text x="1762.0" y="870.5" class="ct" text-anchor="middle" fill="#1B211E">non-billable, whoever needed it</text>
<rect x="1934" y="811" width="300" height="92" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="2084.0" y="853.5" class="ct" text-anchor="middle" fill="#1B211E">CAPPED  ·  BENEFIT EXHAUSTED</text>
<text x="2084.0" y="870.5" class="ct" text-anchor="middle" fill="#1B211E">non-billable, care stops</text>
<rect x="320" y="954" width="1698" height="340" rx="10" fill="#E9E9E5"/>
<text x="342" y="988" class="band" text-anchor="start">4  ·  THE MISSED VISIT</text>
<text x="2004" y="988" class="bandhi" text-anchor="end">ONE EVENT, FOUR MEANINGS</text>
<rect x="350" y="1012" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="475.0" y="1053.5" class="bt" style="fill:#fff" text-anchor="middle">Disposition selected</text>
<text x="475.0" y="1072.5" class="bt" style="fill:#fff" text-anchor="middle">the day before</text>
<rect x="515.9" y="998" width="76.10000000000001" height="23" rx="11.5" fill="#FFFFFF" stroke="#2E599D" stroke-width="1.8"/>
<text x="553.95" y="1014" class="bdg" text-anchor="middle" fill="#2E599D">IN HCHB</text>
<text x="356" y="1128" class="sub">·  accept is the confirmed path</text>
<text x="356" y="1145" class="sub">·  reschedule is most likely</text>
<text x="356" y="1162" class="sub">·  reassign carries a plan</text>
<rect x="628" y="1012" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="753.0" y="1053.5" class="bt" style="fill:#fff" text-anchor="middle">Missed visit</text>
<text x="753.0" y="1072.5" class="bt" style="fill:#fff" text-anchor="middle">documented</text>
<text x="634" y="1128" class="sub">·  scheduled, then pending,</text>
<text x="634" y="1145" class="sub">·  then missed</text>
<line x1="600" y1="1057.0" x2="622" y2="1057.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="1012" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="1031.0" y="1053.5" class="bt" style="fill:#fff" text-anchor="middle">Notify the MD</text>
<text x="1031.0" y="1072.5" class="bt" style="fill:#fff" text-anchor="middle">within 48 hours</text>
<rect x="1063.6" y="998" width="84.4" height="23" rx="11.5" fill="#FFFFFF" stroke="#C6A01F" stroke-width="1.8"/>
<text x="1105.8" y="1014" class="bdg" text-anchor="middle" fill="#C6A01F">MEDICARE</text>
<text x="912" y="1128" class="sub">·  an HCHB hard stop</text>
<text x="912" y="1145" class="sub">·  late generates a DCS task</text>
<line x1="878" y1="1057.0" x2="900" y2="1057.0" class="ln" marker-end="url(#ar)"/>
<rect x="350" y="1196" width="380" height="80" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="540.0" y="1232.5" class="ct" text-anchor="middle" fill="#1B211E">EPISODIC  ·  MID-PERIOD</text>
<text x="540.0" y="1249.5" class="ct" text-anchor="middle" fill="#1B211E">about 25 dollars</text>
<rect x="758" y="1196" width="380" height="80" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="948.0" y="1232.5" class="ct" text-anchor="middle" fill="#1B211E">EPISODIC  ·  FLOOR-CRITICAL</text>
<text x="948.0" y="1249.5" class="ct" text-anchor="middle" fill="#1B211E">1,258 to 1,386 dollars</text>
<rect x="1166" y="1196" width="380" height="80" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1356.0" y="1232.5" class="ct" text-anchor="middle" fill="#1B211E">PER-VISIT</text>
<text x="1356.0" y="1249.5" class="ct" text-anchor="middle" fill="#1B211E">the visit's contracted rate</text>
<rect x="1574" y="1196" width="380" height="80" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1764.0" y="1232.5" class="ct" text-anchor="middle" fill="#1B211E">MANAGED  ·  ALSO</text>
<text x="1764.0" y="1249.5" class="ct" text-anchor="middle" fill="#1B211E">risks the completion gate</text>
<rect x="320" y="1318" width="1420" height="230" rx="10" fill="#E9E9E5"/>
<text x="342" y="1352" class="band" text-anchor="start">5  ·  PERIOD AND WINDOW END</text>
<text x="1726" y="1352" class="bandhi" text-anchor="end">A NEW PERIOD IS A NEW QUESTION</text>
<rect x="350" y="1376" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="475.0" y="1417.5" class="bt" style="fill:#fff" text-anchor="middle">Each discipline</text>
<text x="475.0" y="1436.5" class="bt" style="fill:#fff" text-anchor="middle">decides separately</text>
<text x="356" y="1492" class="sub">·  recert or discharge,</text>
<text x="356" y="1509" class="sub">·  against its own goals</text>
<rect x="628" y="1376" width="250" height="90" rx="6" fill="#795CA7"/>
<text x="753.0" y="1417.5" class="bt" style="fill:#fff" text-anchor="middle">New certification</text>
<text x="753.0" y="1436.5" class="bt" style="fill:#fff" text-anchor="middle">period generates</text>
<text x="634" y="1492" class="sub">·  recert visits already plotted</text>
<line x1="600" y1="1421.0" x2="622" y2="1421.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="1376" width="250" height="90" rx="6" fill="#DF751D"/>
<text x="1031.0" y="1427.0" class="bt" style="fill:#fff" text-anchor="middle">New auth question</text>
<rect x="1096.8" y="1362" width="51.2" height="23" rx="11.5" fill="#FFFFFF" stroke="#DF751D" stroke-width="1.8"/>
<text x="1122.4" y="1378" class="bdg" text-anchor="middle" fill="#DF751D">GATE</text>
<text x="912" y="1492" class="sub">·  every recert, ROC, physician order</text>
<text x="912" y="1509" class="sub">·  new window, new allowance</text>
<line x1="878" y1="1421.0" x2="900" y2="1421.0" class="ln" marker-end="url(#ar)"/>
<rect x="1184" y="1375" width="300" height="92" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1334.0" y="1409.0" class="ct" text-anchor="middle" fill="#1B211E">NEW 30-DAY PERIOD</text>
<text x="1334.0" y="1426.0" class="ct" text-anchor="middle" fill="#1B211E">new case-mix group,</text>
<text x="1334.0" y="1443.0" class="ct" text-anchor="middle" fill="#1B211E">new floor threshold</text>
<rect x="320" y="1572" width="1400" height="280" rx="10" fill="none" stroke="#C9CCC5" stroke-width="1.8" stroke-dasharray="8 6"/>
<text x="346" y="1608" class="pnl" text-anchor="start">THE FOUR CEILINGS ON ONE EPISODE  —  INDEPENDENT TESTS, NOT ONE RULE</text>
<line x1="336" y1="1632" x2="336" y2="1648" stroke="#1B211E" stroke-width="3"/>
<text x="336" y="1668" class="colh" text-anchor="start">PERMISSION</text>
<text x="336" y="1700" class="sub">·  what the payer allows</text>
<text x="336" y="1717" class="sub">·  unauthorised is non-billable</text>
<text x="336" y="1734" class="sub">·  backdating window 0-5 days</text>
<line x1="676" y1="1632" x2="676" y2="1648" stroke="#1B211E" stroke-width="3"/>
<text x="676" y="1668" class="colh" text-anchor="start">FLOOR</text>
<text x="676" y="1700" class="sub">·  LUPA, 2 to 5 visits by group</text>
<text x="676" y="1717" class="sub">·  below it the period reprices</text>
<text x="676" y="1734" class="sub">·  a cliff, not a slope</text>
<line x1="1016" y1="1632" x2="1016" y2="1648" stroke="#1B211E" stroke-width="3"/>
<text x="1016" y="1668" class="colh" text-anchor="start">CEILING</text>
<text x="1016" y="1700" class="sub">·  visits above the floor</text>
<text x="1016" y="1717" class="sub">·  earn nothing to ~15.8 visits</text>
<text x="1016" y="1734" class="sub">·  no one sees this today</text>
<line x1="1356" y1="1632" x2="1356" y2="1648" stroke="#1B211E" stroke-width="3"/>
<text x="1356" y="1668" class="colh" text-anchor="start">CAP</text>
<text x="1356" y="1700" class="sub">·  the annual benefit limit</text>
<text x="1356" y="1717" class="sub">·  commercial and Medicaid</text>
<text x="1356" y="1734" class="sub">·  the employer may set it</text>
<rect x="1750" y="1572" width="800" height="280" rx="10" fill="none" stroke="#C9CCC5" stroke-width="1.8" stroke-dasharray="8 6"/>
<text x="1776" y="1608" class="pnl" text-anchor="start">WHERE IT BREAKS</text>
<text x="1782" y="1648" class="sub">·  The payer rule is written days before the plan of care</text>
<text x="1782" y="1665" class="sub">·  and never surfaces at it</text>
<text x="1782" y="1682" class="sub">·  Pending-auth visits sit on no calendar, count toward nothing</text>
<text x="1782" y="1699" class="sub">·  Period state is invisible, so every miss is priced the same</text>
<text x="1782" y="1716" class="sub">·  About 50 pending-auth notices a day train bulk-clearing</text>
<text x="1782" y="1733" class="sub">·  A rebooked visit spends two slots to deliver one</text>
<line x1="50" y1="1898" x2="2550" y2="1898" stroke="#C9CCC5" stroke-width="1.4"/>
<text x="50" y="1930" class="foot" text-anchor="start">Current state, August 2026.  Nothing on this sheet is a proposal.</text>
<text x="2550" y="1930" class="foot" text-anchor="end">Compassus Home Health  ·  Payer economics and the schedule</text>
</svg>