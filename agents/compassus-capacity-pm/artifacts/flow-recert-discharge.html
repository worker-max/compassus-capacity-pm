<title>Recertification & Discharge</title>

<figure>
<svg viewBox="0 0 2200 1800" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Recertification and discharge at the end of a sixty-day certification period, shown through a worked example. Skilled nursing, physical therapy and occupational therapy are all active. Each discipline decides for itself against its goals. Nursing discharges seven to eight days before the period ends with a non-OASIS discipline discharge, and owes no visit in the five-day recert window. PT and OT recertify: both visit inside the window, PT carries the OASIS recert, OT performs a non-OASIS recert eval. Their next-period frequency orders, PT two-weekly times three then one-weekly times three, OT one-weekly times four, feed the same plan-of-care pattern as flow one, pass two.">
<defs><marker id="ar" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.5" orient="auto-start-reverse"><polygon points="0,0 10,4 0,8" fill="#1B211E"/></marker></defs>
<rect x="0" y="0" width="2200" height="1800" fill="#FBFBF8"/>
<text x="50" y="58" class="eyebrow" text-anchor="start">COMPASSUS HOME HEALTH  ·  FLOW 5</text>
<text x="50" y="100" class="title" text-anchor="start">Recertification &amp; Discharge</text>
<text x="50" y="128" class="deck" text-anchor="start">Each discipline decides for itself — and the last one out does the OASIS</text>
<circle cx="1113" cy="72" r="13" fill="#2E599D"/>
<text x="1134" y="78" class="leg" text-anchor="start">Clinician (SN · PT · OT)</text>
<circle cx="1384.6" cy="72" r="13" fill="#792E2E"/>
<text x="1405.6" y="78" class="leg" text-anchor="start">DCS</text>
<circle cx="1479.8" cy="72" r="13" fill="#C6A01F"/>
<text x="1500.8" y="78" class="leg" text-anchor="start">PCC / Scheduler</text>
<circle cx="1675.8" cy="72" r="13" fill="#795CA7"/>
<text x="1696.8" y="78" class="leg" text-anchor="start">HCHB</text>
<circle cx="1779.3999999999999" cy="72" r="13" fill="#DF751D"/>
<text x="1800.3999999999999" y="78" class="leg" text-anchor="start">Insurance &amp; Auth</text>
<line x1="50" y1="150" x2="2150" y2="150" stroke="#C9CCC5" stroke-width="1.4"/>
<rect x="320" y="185" width="1850" height="262" rx="10" fill="#E9E9E5"/>
<text x="342" y="219" class="band" text-anchor="start">THE DECISION  ·  EACH ACTIVE DISCIPLINE, SEPARATELY, AGAINST ITS OWN GOALS</text>
<rect x="350" y="247" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="475.0" y="279.0" class="bt" text-anchor="middle">Discipline reviews</text>
<text x="475.0" y="298.0" class="bt" text-anchor="middle">progress against</text>
<text x="475.0" y="317.0" class="bt" text-anchor="middle">its goals</text>
<polygon points="718,240.0 808.0,292.0 718,344.0 628.0,292.0" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="718" y="297.0" class="dt" text-anchor="middle">Goals met?</text>
<line x1="600" y1="292.0" x2="622" y2="292.0" class="ln" marker-end="url(#ar)"/>
<rect x="888" y="229" width="300" height="68" rx="6" fill="#2E599D"/>
<text x="1038.0" y="260.0" class="bt s" text-anchor="middle">Discharge — discipline level</text>
<text x="1038.0" y="276.0" class="bt s" text-anchor="middle">(non-OASIS)</text>
<rect x="888" y="341" width="300" height="68" rx="6" fill="#2E599D"/>
<text x="1038.0" y="372.0" class="bt s" text-anchor="middle">Recertify — visit inside</text>
<text x="1038.0" y="388.0" class="bt s" text-anchor="middle">the 5-day window</text>
<path d="M 808 292.0 L 842 292.0 L 842 263 L 882 263" fill="none" class="ln" marker-end="url(#ar)"/>
<text x="854" y="287" class="lb" text-anchor="start">Yes</text>
<path d="M 842 292.0 L 842 375 L 882 375" fill="none" class="ln" marker-end="url(#ar)"/>
<text x="854" y="327" class="lb" text-anchor="start">No — more care indicated</text>
<text x="1208" y="257" class="note" text-anchor="start">leaves before the window —</text>
<text x="1208" y="275" class="note" text-anchor="start">no recert visit owed</text>
<text x="1208" y="369" class="note" text-anchor="start">the visit is already on the calendar —</text>
<text x="1208" y="387" class="note" text-anchor="start">plotted at the original plan of care</text>
<text x="1650" y="255" class="colh" text-anchor="start">DISCIPLINE-DEPENDENT</text>
<text x="1650" y="279" class="sub">·  Some services discharge before recert</text>
<text x="1650" y="296" class="sub">·  Others continue on goals not yet met</text>
<text x="1650" y="313" class="sub">·  Slow progress mid-episode →</text>
<text x="1650" y="330" class="sub">·  add-on order extends care (Flow 1)</text>
<rect x="320" y="487" width="1850" height="560" rx="10" fill="#E9E9E5"/>
<text x="342" y="521" class="band" text-anchor="start">THE WORKED EXAMPLE  ·  SN DISCHARGES — PT AND OT RECERTIFY</text>
<text x="2156" y="521" class="bandhi" text-anchor="end">WINDOW EXPANDED — NOT TO SCALE</text>
<rect x="430" y="567" width="1030" height="34" rx="4" fill="#FFFFFF" stroke="#5A6560" stroke-width="1.6"/>
<rect x="1080" y="567" width="380" height="34" fill="#792E2E" opacity=".16"/>
<path d="M 640 561 l 10 46 m 12 -46 l 10 46" stroke="#5A6560" stroke-width="2" fill="none"/>
<text x="535.0" y="589" class="dt" text-anchor="middle">days 1–50</text>
<text x="430" y="553" class="trg" text-anchor="start">CURRENT 60-DAY CERTIFICATION PERIOD</text>
<line x1="700" y1="601" x2="700" y2="609" stroke="#5A6560" stroke-width="1.4"/>
<text x="738.0" y="625" class="lb" text-anchor="middle">51</text>
<line x1="776" y1="601" x2="776" y2="609" stroke="#5A6560" stroke-width="1.4"/>
<text x="814.0" y="625" class="lb" text-anchor="middle">52</text>
<line x1="852" y1="601" x2="852" y2="609" stroke="#5A6560" stroke-width="1.4"/>
<text x="890.0" y="625" class="lb" text-anchor="middle">53</text>
<line x1="928" y1="601" x2="928" y2="609" stroke="#5A6560" stroke-width="1.4"/>
<text x="966.0" y="625" class="lb" text-anchor="middle">54</text>
<line x1="1004" y1="601" x2="1004" y2="609" stroke="#5A6560" stroke-width="1.4"/>
<text x="1042.0" y="625" class="lb" text-anchor="middle">55</text>
<line x1="1080" y1="601" x2="1080" y2="609" stroke="#5A6560" stroke-width="1.4"/>
<text x="1118.0" y="625" class="lb" text-anchor="middle">56</text>
<line x1="1156" y1="601" x2="1156" y2="609" stroke="#5A6560" stroke-width="1.4"/>
<text x="1194.0" y="625" class="lb" text-anchor="middle">57</text>
<line x1="1232" y1="601" x2="1232" y2="609" stroke="#5A6560" stroke-width="1.4"/>
<text x="1270.0" y="625" class="lb" text-anchor="middle">58</text>
<line x1="1308" y1="601" x2="1308" y2="609" stroke="#5A6560" stroke-width="1.4"/>
<text x="1346.0" y="625" class="lb" text-anchor="middle">59</text>
<line x1="1384" y1="601" x2="1384" y2="609" stroke="#5A6560" stroke-width="1.4"/>
<text x="1422.0" y="625" class="lb" text-anchor="middle">60</text>
<text x="1270.0" y="553" class="pnl" text-anchor="middle">5-DAY RECERT WINDOW · DAYS 56–60</text>
<line x1="1460" y1="533" x2="1460" y2="951" stroke="#1B211E" stroke-width="2.5" stroke-dasharray="12 7"/>
<text x="1460" y="523" class="boundary" text-anchor="middle">DAY 60 → DAY 1</text>
<rect x="1460" y="567" width="670" height="34" rx="4" fill="#FFFFFF" stroke="#5A6560" stroke-width="1.6"/>
<text x="1795.0" y="589" class="dt" text-anchor="middle">NEW 60-DAY CERTIFICATION PERIOD</text>
<rect x="352" y="695" width="56" height="44" rx="22.0" fill="#FFFFFF" stroke="#2E599D" stroke-width="1.8"/>
<text x="380.0" y="722.0" class="ct" text-anchor="middle" fill="#2E599D">SN</text>
<line x1="418" y1="717" x2="448" y2="717" stroke="#C9CCC5" stroke-width="1.6"/>
<rect x="352" y="805" width="56" height="44" rx="22.0" fill="#FFFFFF" stroke="#2E599D" stroke-width="1.8"/>
<text x="380.0" y="832.0" class="ct" text-anchor="middle" fill="#2E599D">PT</text>
<line x1="418" y1="827" x2="448" y2="827" stroke="#C9CCC5" stroke-width="1.6"/>
<rect x="352" y="915" width="56" height="44" rx="22.0" fill="#FFFFFF" stroke="#2E599D" stroke-width="1.8"/>
<text x="380.0" y="942.0" class="ct" text-anchor="middle" fill="#2E599D">OT</text>
<line x1="418" y1="937" x2="448" y2="937" stroke="#C9CCC5" stroke-width="1.6"/>
<line x1="448" y1="717" x2="726" y2="717" stroke="#C9CCC5" stroke-width="1.6"/>
<rect x="730" y="685" width="300" height="64" rx="6" fill="#2E599D"/>
<text x="880.0" y="714.0" class="bt s" text-anchor="middle">SN final visit — discipline</text>
<text x="880.0" y="730.0" class="bt s" text-anchor="middle">discharge (non-OASIS)</text>
<circle cx="1056" cy="717" r="7" fill="none" stroke="#1B211E" stroke-width="2.2"/>
<text x="730" y="769" class="note" text-anchor="start">days 52–53 — 7–8 days before the period ends. A discipline that is not</text>
<text x="730" y="787" class="note" text-anchor="start">recertifying owes no visit inside the window. SN is off the case.</text>
<path d="M 814.0 679 L 814.0 635" fill="none" class="ln" stroke-dasharray="7 5" opacity=".68" marker-end="url(#ar)"/>
<line x1="448" y1="827" x2="1084" y2="827" stroke="#C9CCC5" stroke-width="1.6"/>
<rect x="1088" y="795" width="290" height="64" rx="6" fill="#2E599D"/>
<text x="1233.0" y="832.0" class="bt s" text-anchor="middle">PT — OASIS recert visit</text>
<rect x="1210.9" y="781" width="159.10000000000002" height="23" rx="11.5" fill="#FFFFFF" stroke="#2E599D" stroke-width="1.8"/>
<text x="1290.45" y="797" class="bdg" text-anchor="middle" fill="#2E599D">CARRIES THE OASIS</text>
<line x1="1378" y1="827" x2="1514" y2="827" class="ln" marker-end="url(#ar)"/>
<rect x="1520" y="795" width="330" height="64" rx="26" fill="#FFFFFF" stroke="#2E599D" stroke-width="1.8"/>
<text x="1685.0" y="823.5" class="ct" text-anchor="middle" fill="#2E599D">PT · 2w3, then 1w3</text>
<text x="1685.0" y="840.5" class="ct" text-anchor="middle" fill="#2E599D">6 + 3 = 9 visits over 6 weeks</text>
<line x1="448" y1="937" x2="1182" y2="937" stroke="#C9CCC5" stroke-width="1.6"/>
<rect x="1186" y="905" width="300" height="64" rx="6" fill="#2E599D"/>
<text x="1336.0" y="934.0" class="bt s" text-anchor="middle">OT — recert eval</text>
<text x="1336.0" y="950.0" class="bt s" text-anchor="middle">(non-OASIS)</text>
<line x1="1486" y1="937" x2="1514" y2="937" class="ln" marker-end="url(#ar)"/>
<rect x="1520" y="905" width="330" height="64" rx="26" fill="#FFFFFF" stroke="#2E599D" stroke-width="1.8"/>
<text x="1685.0" y="933.5" class="ct" text-anchor="middle" fill="#2E599D">OT · 1w4</text>
<text x="1685.0" y="950.5" class="ct" text-anchor="middle" fill="#2E599D">4 visits over 4 weeks</text>
<text x="358" y="1021" class="hi" text-anchor="start">one recertifying discipline carries the OASIS recert — here PT; OT's eval is non-OASIS · both visits were already plotted at the original plan of care</text>
<rect x="320" y="1087" width="1850" height="336" rx="10" fill="#E9E9E5"/>
<text x="342" y="1121" class="band" text-anchor="start">AFTER THE RECERT VISITS  ·  THE NEXT PERIOD IS BUILT</text>
<text x="2156" y="1121" class="bandhi" text-anchor="end">THE SAME PATTERN AS FLOW 1, PASS 2</text>
<rect x="350" y="1153" width="280" height="90" rx="6" fill="#2E599D"/>
<text x="490.0" y="1194.5" class="bt" text-anchor="middle">PT and OT establish next-</text>
<text x="490.0" y="1213.5" class="bt" text-anchor="middle">period frequency orders</text>
<rect x="479.5" y="1139" width="142.5" height="23" rx="11.5" fill="#FFFFFF" stroke="#2E599D" stroke-width="1.8"/>
<text x="550.75" y="1155" class="bdg" text-anchor="middle" fill="#2E599D">× 2 disciplines</text>
<rect x="660" y="1153" width="280" height="90" rx="6" fill="#792E2E"/>
<text x="800.0" y="1194.5" class="bt" text-anchor="middle">DCS reviews and approves</text>
<text x="800.0" y="1213.5" class="bt" text-anchor="middle">each plan of care</text>
<rect x="970" y="1153" width="280" height="90" rx="6" fill="#795CA7"/>
<text x="1110.0" y="1194.5" class="bt" text-anchor="middle">HCHB generates visits</text>
<text x="1110.0" y="1213.5" class="bt" text-anchor="middle">and assignment tasks</text>
<polygon points="1355,1146.0 1430.0,1198.0 1355,1250.0 1280.0,1198.0" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1355" y="1194.5" class="dt" text-anchor="middle">Auth on</text>
<text x="1355" y="1211.5" class="dt" text-anchor="middle">file?</text>
<rect x="1460" y="1153" width="280" height="90" rx="6" fill="#C6A01F"/>
<text x="1600.0" y="1194.5" class="bt" text-anchor="middle">Scheduler assigns all</text>
<text x="1600.0" y="1213.5" class="bt" text-anchor="middle">plotted visits — one pass</text>
<rect x="1770" y="1153" width="280" height="90" rx="6" fill="#2E599D"/>
<text x="1910.0" y="1194.5" class="bt" text-anchor="middle">New period's visits on</text>
<text x="1910.0" y="1213.5" class="bt" text-anchor="middle">PT and OT calendars</text>
<line x1="630" y1="1198.0" x2="654" y2="1198.0" class="ln" marker-end="url(#ar)"/>
<line x1="940" y1="1198.0" x2="964" y2="1198.0" class="ln" marker-end="url(#ar)"/>
<line x1="1250" y1="1198.0" x2="1274" y2="1198.0" class="ln" marker-end="url(#ar)"/>
<path d="M 1430 1198.0 L 1454 1198.0" fill="none" class="ln" marker-end="url(#ar)"/>
<text x="1445.0" y="1186.0" class="lb" text-anchor="middle">Yes</text>
<line x1="1740" y1="1198.0" x2="1764" y2="1198.0" class="ln" marker-end="url(#ar)"/>
<rect x="1165" y="1285" width="380" height="54" rx="6" fill="#DF751D"/>
<text x="1355.0" y="1309.0" class="bt s" text-anchor="middle">No auth → the visit sits pending —</text>
<text x="1355.0" y="1325.0" class="bt s" text-anchor="middle">not on the calendar, not counted</text>
<path d="M 1355 1250.0 L 1355 1279" fill="none" class="ln" stroke-dasharray="7 5" opacity=".68" marker-end="url(#ar)"/>
<text x="1369" y="1276.0" class="lb" text-anchor="start">No</text>
<text x="350" y="1269" class="sub" text-anchor="start">PT 2w3 → 1w3  ·  OT 1w4</text>
<text x="350" y="1289" class="sub" text-anchor="start">the scheduling workflow fires only now</text>
<text x="350" y="1403" class="hi" text-anchor="start">a new certification period is a new auth question — traditional Medicare passes straight through; any other payer re-enters the auth cycle (Flow 3) before these visits can be assigned</text>
<rect x="350" y="1463" width="1790" height="148" rx="10" fill="none" stroke="#C9CCC5" stroke-width="1.8" stroke-dasharray="8 6"/>
<text x="376" y="1499" class="pnl" text-anchor="start">IF NO DISCIPLINE RECERTIFIES — THE AGENCY DISCHARGE</text>
<text x="394" y="1529" class="sub">·  Every discipline still discharges separately — the earlier ones non-OASIS, exactly like SN above</text>
<text x="394" y="1546" class="sub">·  The last discipline active performs the agency discharge with the D/C OASIS — RN, PT or OT, whoever makes the final visit</text>
<text x="394" y="1563" class="sub">·  The owner of the agency discharge is unknown until it happens — and the episode's capacity returns to the branch</text>
<text x="50" y="1681" class="trg" text-anchor="start">BOUNDARIES</text>
<rect x="350" y="1659" width="433.0" height="42" rx="21.0" fill="#FFFFFF" stroke="#5A6560" stroke-width="1.8"/>
<text x="566.5" y="1685.0" class="ct" text-anchor="middle" fill="#5A6560">Recert visits are plotted at the original POC</text>
<rect x="803.0" y="1659" width="441.59999999999997" height="42" rx="21.0" fill="#FFFFFF" stroke="#5A6560" stroke-width="1.8"/>
<text x="1023.8" y="1685.0" class="ct" text-anchor="middle" fill="#5A6560">The window binds only recertifying disciplines</text>
<rect x="1264.6" y="1659" width="338.4" height="42" rx="21.0" fill="#FFFFFF" stroke="#5A6560" stroke-width="1.8"/>
<text x="1433.8" y="1685.0" class="ct" text-anchor="middle" fill="#5A6560">Each discipline decides separately</text>
<rect x="1623.0" y="1659" width="424.4" height="42" rx="21.0" fill="#FFFFFF" stroke="#5A6560" stroke-width="1.8"/>
<text x="1835.2" y="1685.0" class="ct" text-anchor="middle" fill="#5A6560">Scheduling fires only after frequency is set</text>
<line x1="50" y1="1728" x2="2150" y2="1728" stroke="#C9CCC5" stroke-width="1.4"/>
<text x="50" y="1760" class="foot" text-anchor="start">Current state · condensed on the primary map as phase 4</text>
<text x="2150" y="1760" class="foot" text-anchor="end">Flow 5 · recertification &amp; discharge</text>
</svg>
</figure>
