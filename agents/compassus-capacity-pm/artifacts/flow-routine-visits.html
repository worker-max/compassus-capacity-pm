<title>Routine Visit Scheduling</title>

<figure>
<svg viewBox="0 0 2200 1290" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Routine visit scheduling in two phases. Phase one is a burst of scheduler work at admission: each discipline plots its own frequency, every submission generates its own assignment task. After the 485 the episode enters phase two, where the clinician manages their own week with no scheduler workflow at all, and reassignment is the only thing that pulls the scheduler back in.">
<defs><marker id="ar" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.5" orient="auto-start-reverse"><polygon points="0,0 10,4 0,8" fill="#1B211E"/></marker></defs>
<rect x="0" y="0" width="2200" height="1290" fill="#FBFBF8"/>
<text x="50" y="58" class="eyebrow" text-anchor="start">COMPASSUS HOME HEALTH  ·  FLOW 2</text>
<text x="50" y="100" class="title" text-anchor="start">Routine Visit Scheduling</text>
<text x="50" y="128" class="deck" text-anchor="start">A burst of scheduler work at admission, then the clinician runs their own week</text>
<circle cx="1313" cy="72" r="13" fill="#792E2E"/>
<text x="1334" y="78" class="leg" text-anchor="start">DCS</text>
<circle cx="1412.2" cy="72" r="13" fill="#C6A01F"/>
<text x="1433.2" y="78" class="leg" text-anchor="start">PCC / Scheduler</text>
<circle cx="1612.2" cy="72" r="13" fill="#2E599D"/>
<text x="1633.2" y="78" class="leg" text-anchor="start">Clinician</text>
<circle cx="1761.8000000000002" cy="72" r="13" fill="#795CA7"/>
<text x="1782.8000000000002" y="78" class="leg" text-anchor="start">HCHB</text>
<line x1="50" y1="150" x2="2150" y2="150" stroke="#C9CCC5" stroke-width="1.4"/>
<rect x="320" y="185" width="1142" height="205" rx="10" fill="#E9E9E5"/>
<text x="342" y="219" class="band" text-anchor="start">PHASE 1  ·  FREQUENCY PLOTTING &amp; INITIAL ASSIGNMENT — the burst</text>
<rect x="350" y="245" width="250" height="90" rx="5" fill="#2E599D"/>
<text x="475.0" y="277.0" class="bt" text-anchor="middle">Evaluating clinician</text>
<text x="475.0" y="296.0" class="bt" text-anchor="middle">plots own discipline</text>
<text x="475.0" y="315.0" class="bt" text-anchor="middle">frequency</text>
<rect x="449.5" y="231" width="142.5" height="23" rx="11.5" fill="#FFFFFF" stroke="#2E599D" stroke-width="1.8"/>
<text x="520.75" y="247" class="bdg" text-anchor="middle" fill="#2E599D">× N disciplines</text>
<rect x="628" y="245" width="250" height="90" rx="5" fill="#2E599D"/>
<text x="753.0" y="277.0" class="bt" text-anchor="middle">RN also plots aide</text>
<text x="753.0" y="296.0" class="bt" text-anchor="middle">frequency + MSW / ST</text>
<text x="753.0" y="315.0" class="bt" text-anchor="middle">initial eval</text>
<rect x="906" y="245" width="250" height="90" rx="5" fill="#795CA7"/>
<text x="1031.0" y="277.0" class="bt" text-anchor="middle">Each submission</text>
<text x="1031.0" y="296.0" class="bt" text-anchor="middle">generates its own</text>
<text x="1031.0" y="315.0" class="bt" text-anchor="middle">assignment task</text>
<rect x="1005.5" y="231" width="142.5" height="23" rx="11.5" fill="#FFFFFF" stroke="#795CA7" stroke-width="1.8"/>
<text x="1076.75" y="247" class="bdg" text-anchor="middle" fill="#795CA7">× N disciplines</text>
<rect x="1184" y="245" width="250" height="90" rx="5" fill="#C6A01F"/>
<text x="1309.0" y="286.5" class="bt" text-anchor="middle">Scheduler assigns</text>
<text x="1309.0" y="305.5" class="bt" text-anchor="middle">visits to care team</text>
<line x1="600" y1="290.0" x2="622" y2="290.0" class="ln" marker-end="url(#ar)"/>
<line x1="878" y1="290.0" x2="900" y2="290.0" class="ln" marker-end="url(#ar)"/>
<line x1="1156" y1="290.0" x2="1178" y2="290.0" class="ln" marker-end="url(#ar)"/>
<rect x="50" y="251.0" width="250" height="78" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="175.0" y="286.5" class="ct" text-anchor="middle" fill="#1B211E">Admission</text>
<text x="175.0" y="303.5" class="ct" text-anchor="middle" fill="#1B211E">SOC or eval visit</text>
<line x1="300" y1="290.0" x2="344" y2="290.0" class="ln" marker-end="url(#ar)"/>
<text x="50" y="237.0" class="trg" text-anchor="start">TRIGGER</text>
<text x="350" y="361" class="note" text-anchor="start">RN at the SOC; PT and OT at their own evals, 1–2 days later</text>
<line x1="320" y1="462" x2="336" y2="462" stroke="#1B211E" stroke-width="2.5" stroke-dasharray="14 7"/>
<line x1="844" y1="462" x2="2018" y2="462" stroke="#1B211E" stroke-width="2.5" stroke-dasharray="14 7"/>
<rect x="350" y="442" width="480" height="40" rx="20" fill="#FBFBF8" stroke="#1B211E" stroke-width="2"/>
<text x="590" y="468" class="boundary" text-anchor="middle">485 SUBMITTED — after this, every order is an add-on</text>
<text x="590" y="502" class="note" text-anchor="middle">add-on orders route through DCS approval and auth before reaching the scheduler</text>
<rect x="320" y="528" width="1698" height="205" rx="10" fill="#E9E9E5"/>
<text x="342" y="562" class="band" text-anchor="start">PHASE 2  ·  STEADY STATE — the clinician runs their own week</text>
<text x="1996" y="562" class="bandhi" text-anchor="end">NO SCHEDULER WORKFLOW</text>
<rect x="350" y="588" width="250" height="90" rx="5" fill="#2E599D"/>
<text x="475.0" y="620.0" class="bt" text-anchor="middle">Evaluate own</text>
<text x="475.0" y="639.0" class="bt" text-anchor="middle">capacity for</text>
<text x="475.0" y="658.0" class="bt" text-anchor="middle">the week</text>
<rect x="628" y="588" width="250" height="90" rx="5" fill="#2E599D"/>
<text x="753.0" y="620.0" class="bt" text-anchor="middle">Prioritise clinical</text>
<text x="753.0" y="639.0" class="bt" text-anchor="middle">need across</text>
<text x="753.0" y="658.0" class="bt" text-anchor="middle">the caseload</text>
<line x1="600" y1="633.0" x2="622" y2="633.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="588" width="250" height="90" rx="5" fill="#2E599D"/>
<text x="1031.0" y="629.5" class="bt" text-anchor="middle">Group visits</text>
<text x="1031.0" y="648.5" class="bt" text-anchor="middle">geographically</text>
<line x1="878" y1="633.0" x2="900" y2="633.0" class="ln" marker-end="url(#ar)"/>
<rect x="1184" y="588" width="250" height="90" rx="5" fill="#2E599D"/>
<text x="1309.0" y="629.5" class="bt" text-anchor="middle">Test against hard</text>
<text x="1309.0" y="648.5" class="bt" text-anchor="middle">constraints</text>
<line x1="1156" y1="633.0" x2="1178" y2="633.0" class="ln" marker-end="url(#ar)"/>
<rect x="1462" y="588" width="250" height="90" rx="5" fill="#2E599D"/>
<text x="1587.0" y="629.5" class="bt" text-anchor="middle">Confirm with the</text>
<text x="1587.0" y="648.5" class="bt" text-anchor="middle">patient — day before</text>
<line x1="1434" y1="633.0" x2="1456" y2="633.0" class="ln" marker-end="url(#ar)"/>
<rect x="1740" y="588" width="250" height="90" rx="5" fill="#2E599D"/>
<text x="1865.0" y="629.5" class="bt" text-anchor="middle">Route — HCHB suggests,</text>
<text x="1865.0" y="648.5" class="bt" text-anchor="middle">clinician adjusts</text>
<line x1="1712" y1="633.0" x2="1734" y2="633.0" class="ln" marker-end="url(#ar)"/>
<text x="1309.0" y="704" class="note" text-anchor="middle">wound timing · catheter · IV · patient preference · competing appointments</text>
<rect x="320" y="791" width="1420" height="165" rx="10" fill="#E9E9E5"/>
<text x="342" y="825" class="band" text-anchor="start">AT THE VISIT  ·  THE CLINICIAN'S FIVE DISPOSITIONS</text>
<rect x="350" y="851" width="250" height="76" rx="5" fill="#2E599D"/>
<text x="475.0" y="886.25" class="bt s" text-anchor="middle">Accept</text>
<text x="475.0" y="901.75" class="bt s" text-anchor="middle">visit delivered</text>
<rect x="628" y="851" width="250" height="76" rx="5" fill="#2E599D"/>
<text x="753.0" y="886.25" class="bt s" text-anchor="middle">Reschedule</text>
<text x="753.0" y="901.75" class="bt s" text-anchor="middle">within the week</text>
<rect x="906" y="851" width="250" height="76" rx="5" fill="#C6A01F"/>
<text x="1031.0" y="878.5" class="bt s" text-anchor="middle">Reassign</text>
<text x="1031.0" y="894.0" class="bt s" text-anchor="middle">back to scheduler —</text>
<text x="1031.0" y="909.5" class="bt s" text-anchor="middle">usually RN to her own LPN</text>
<rect x="1184" y="851" width="250" height="76" rx="5" fill="#792E2E"/>
<text x="1309.0" y="886.25" class="bt s" text-anchor="middle">Miss</text>
<text x="1309.0" y="901.75" class="bt s" text-anchor="middle">→ compliance chain</text>
<rect x="1462" y="851" width="250" height="76" rx="5" fill="#C6A01F"/>
<text x="1587.0" y="878.5" class="bt s" text-anchor="middle">Decline</text>
<text x="1587.0" y="894.0" class="bt s" text-anchor="middle">back to scheduler —</text>
<text x="1587.0" y="909.5" class="bt s" text-anchor="middle">must go to a different clinician</text>
<path d="M 1865.0 684 L 1865.0 765 L 1031.0 765" fill="none" class="ln"/>
<line x1="1031.0" y1="765" x2="1031.0" y2="845" class="ln" marker-end="url(#ar)"/>
<text x="1031.0" y="953" class="hi" text-anchor="middle">the only recurring scheduler trigger</text>
<text x="1587.0" y="953" class="hi" text-anchor="middle">the scheduler sees it was declined</text>
<text x="50" y="1052" class="trg" text-anchor="start">BOUNDARIES</text>
<rect x="350" y="1030" width="252.39999999999998" height="42" rx="21.0" fill="#FFFFFF" stroke="#5A6560" stroke-width="1.8"/>
<text x="476.2" y="1056.0" class="ct" text-anchor="middle" fill="#5A6560">OASIS visits do not move</text>
<rect x="622.4" y="1030" width="321.2" height="42" rx="21.0" fill="#FFFFFF" stroke="#5A6560" stroke-width="1.8"/>
<text x="783.0" y="1056.0" class="ct" text-anchor="middle" fill="#5A6560">Medicare week is Sunday–Saturday</text>
<rect x="963.5999999999999" y="1030" width="372.8" height="42" rx="21.0" fill="#FFFFFF" stroke="#5A6560" stroke-width="1.8"/>
<text x="1150.0" y="1056.0" class="ct" text-anchor="middle" fill="#5A6560">Inside the 60-day certification period</text>
<rect x="1356.3999999999999" y="1030" width="278.2" height="42" rx="21.0" fill="#FFFFFF" stroke="#5A6560" stroke-width="1.8"/>
<text x="1495.4999999999998" y="1056.0" class="ct" text-anchor="middle" fill="#5A6560">Auth still gates assignment</text>
<text x="50" y="1138" class="trg" text-anchor="start">WHERE IT</text>
<text x="50" y="1156" class="trg" text-anchor="start">BREAKS</text>
<rect x="350" y="1112" width="420" height="70" rx="5" fill="#792E2E"/>
<text x="560.0" y="1144.25" class="bt s" text-anchor="middle">RN cannot reassign to her own LPN</text>
<text x="560.0" y="1159.75" class="bt s" text-anchor="middle">an HCHB rule, not Medicare</text>
<rect x="790" y="1112" width="420" height="70" rx="5" fill="#792E2E"/>
<text x="1000.0" y="1144.25" class="bt s" text-anchor="middle">Supervisor cannot see</text>
<text x="1000.0" y="1159.75" class="bt s" text-anchor="middle">the supervisee's schedule</text>
<rect x="1230" y="1112" width="420" height="70" rx="5" fill="#2E599D"/>
<text x="1440.0" y="1144.25" class="bt s" text-anchor="middle">Day-before calls are</text>
<text x="1440.0" y="1159.75" class="bt s" text-anchor="middle">unpaid evening work</text>
<rect x="1670" y="1112" width="420" height="70" rx="5" fill="#2E599D"/>
<text x="1880.0" y="1144.25" class="bt s" text-anchor="middle">The weekly logic is</text>
<text x="1880.0" y="1159.75" class="bt s" text-anchor="middle">undocumented and unassisted</text>
<line x1="50" y1="1218" x2="2150" y2="1218" stroke="#C9CCC5" stroke-width="1.4"/>
<text x="50" y="1250" class="foot" text-anchor="start">Current state · variables are named in the variable reference, not on this sheet</text>
<text x="2150" y="1250" class="foot" text-anchor="end">Flow 2 of 4 · routine visits</text>
</svg>
</figure>
