<rect x="350" y="1498" width="2300" height="154" rx="10" fill="none" stroke="#C9CCC5" stroke-width="1.8" stroke-dasharray="8 6"/>
<text x="376" y="1534" class="pnl" text-anchor="start">WHAT THE ENGINE MAY ONLY SURFACE — the gating constraints a person still decides</text>
<line x1="376" y1="1552" x2="376" y2="1638" stroke="#1B211E" stroke-width="3"/>
<text x="396" y="1578" class="sub">·  Is the patient actually available, before anything books</text>
<text x="396" y="1595" class="sub">·  The caregiver must be present  ·  the caregiver's own changing schedule</text>

<text x="1662" y="1595" class="sub">·  Finding coverage when someone calls out</text>
<text x="1662" y="1612" class="sub">·  Each is a hard constraint that lives in someone's head today</text>
