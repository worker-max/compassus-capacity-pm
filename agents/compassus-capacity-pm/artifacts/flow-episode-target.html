<title>The Episode, End to End — Target State</title>

<figure>
<svg viewBox="0 0 2450 1690" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="The whole home health episode in target state, in four phases. Phase one, referral to admission: capture, eligibility and pending authorisation, and release to scheduling are automated; the care team and the welcome contact are proposed by the tool and confirmed by a person; confirming the patient is genuinely available stays a human decision and nothing books until it clears. Phase two, the plan of care: each discipline plots frequency against a visit budget the tool now shows, the DCS still approves each plan of care as a hard stop, the 485 moment is unchanged, visits generate, authorisation is checked with pending visits staying visible, and assignment is proposed in one pass. Phase three, steady state: the week is proposed against committed load, routing is automated, and the day-before confirmation becomes automated text and voice instead of the clinician's own evening calls — but clinical priority and the caregiver constraints stay human. Phase four: the recertification window is tracked by the tool, each discipline still decides for itself, and a new period is a new authorisation question.">
