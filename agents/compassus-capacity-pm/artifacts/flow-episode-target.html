<text x="350" y="992" class="pnl" text-anchor="start">THE DISPOSITIONS  —  chosen the day before, selected in HCHB</text>
<rect x="350" y="1006" width="113.4" height="40" rx="20.0" fill="#FFFFFF" stroke="#2E599D" stroke-width="1.8"/>
<text x="406.7" y="1031.0" class="ct" text-anchor="middle" fill="#2E599D">Accept</text>
<text x="477.4" y="1032" class="note" text-anchor="start">confirmed → accepted</text>
<text x="635.4" y="1032" class="trg" text-anchor="start">NOT CONFIRMED →</text>
<rect x="787.4" y="1006" width="149.0" height="40" rx="20.0" fill="#FFFFFF" stroke="#2E599D" stroke-width="1.8"/>
<text x="861.9" y="1031.0" class="ct" text-anchor="middle" fill="#2E599D">Reschedule</text>
<rect x="950.4" y="1006" width="131.2" height="40" rx="20.0" fill="#FFFFFF" stroke="#C6A01F" stroke-width="1.8"/>
<text x="1016.0" y="1031.0" class="ct" text-anchor="middle" fill="#C6A01F">Reassign</text>
<rect x="1095.6" y="1006" width="95.6" height="40" rx="20.0" fill="#FFFFFF" stroke="#792E2E" stroke-width="1.8"/>
<text x="1143.3999999999999" y="1031.0" class="ct" text-anchor="middle" fill="#792E2E">Miss</text>
<rect x="1205.1999999999998" y="1006" width="122.30000000000001" height="40" rx="20.0" fill="#FFFFFF" stroke="#C6A01F" stroke-width="1.8"/>
<text x="1266.35" y="1031.0" class="ct" text-anchor="middle" fill="#C6A01F">Decline</text>
<text x="1349.4999999999998" y="1032" class="note" text-anchor="start">reassign returns with a plan, decline without one — decline is the least used</text>
<rect x="320" y="1094" width="1774" height="230" rx="10" fill="#E9E9E5"/>
<text x="342" y="1128" class="band" text-anchor="start">PHASE 4  ·  END OF EPISODE — recertify or discharge</text>
<text x="2080" y="1128" class="bandhi" text-anchor="end">CONDENSED · DETAIL IN FLOW 5</text>
<rect x="350" y="1156" width="250" height="90" rx="5" fill="#A6E22E"/>
<text x="475.0" y="1197.5" class="bt" style="fill:#1B211E" text-anchor="middle">Recert window opens</text>
<text x="475.0" y="1216.5" class="bt" style="fill:#1B211E" text-anchor="middle">— last 5 days</text>
<rect x="358" y="1142" width="24.3" height="22" rx="5" fill="#FFFFFF" stroke="#5A6560" stroke-width="1.3"/>
<text x="370.15" y="1157" class="bdg" text-anchor="middle" fill="#5A6560">1</text>
<text x="356" y="1272" class="sub">·  Recert visits are already booked</text>
<text x="356" y="1289" class="sub">·  Plotted at the original POC</text>
<rect x="628" y="1156" width="250" height="90" rx="5" fill="#2E599D"/>
<text x="753.0" y="1197.5" class="bt" style="fill:#fff" text-anchor="middle">Recertifying disciplines</text>
<text x="753.0" y="1216.5" class="bt" style="fill:#fff" text-anchor="middle">set the next 60 days</text>
<path d="M 634 1156 L 872 1156 A 6 6 0 0 1 878 1162 L 878 1169 L 628 1169 L 628 1162 A 6 6 0 0 1 634 1156 Z" fill="#A6E22E"/>
<rect x="636" y="1142" width="24.3" height="22" rx="5" fill="#FFFFFF" stroke="#5A6560" stroke-width="1.3"/>
<text x="648.15" y="1157" class="bdg" text-anchor="middle" fill="#5A6560">2</text>
<text x="634" y="1272" class="sub">·  Discipline by discipline</text>
<text x="634" y="1289" class="sub">·  Goals met → discharge instead</text>
<line x1="600" y1="1201.0" x2="622" y2="1201.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="1156" width="250" height="90" rx="5" fill="#A6E22E"/>
<path d="M 1104 1156 L 1150 1156 A 6 6 0 0 1 1156 1162 L 1156 1240 A 6 6 0 0 1 1150 1246 L 1104 1246 Z" fill="#C6A01F"/>
<text x="1005.0" y="1197.5" class="bt" style="fill:#1B211E" text-anchor="middle">The next period</text>
<text x="1005.0" y="1216.5" class="bt" style="fill:#1B211E" text-anchor="middle">is assigned</text>
<rect x="1080.2" y="1142" width="67.80000000000001" height="23" rx="11.5" fill="#FFFFFF" stroke="#C6A01F" stroke-width="1.8"/>
<text x="1114.1" y="1158" class="bdg" text-anchor="middle" fill="#C6A01F">ASSIST</text>
<rect x="914" y="1142" width="24.3" height="22" rx="5" fill="#FFFFFF" stroke="#5A6560" stroke-width="1.3"/>
<text x="926.15" y="1157" class="bdg" text-anchor="middle" fill="#5A6560">3</text>
<text x="912" y="1272" class="sub">·  Only after frequency is set</text>
<text x="912" y="1289" class="sub">·  Same one-pass proposal</text>
<line x1="878" y1="1201.0" x2="900" y2="1201.0" class="ln" marker-end="url(#ar)"/>
<rect x="1184" y="1156" width="250" height="90" rx="5" fill="#2E599D"/>
<text x="1309.0" y="1197.5" class="bt" style="fill:#fff" text-anchor="middle">Or discharge — each</text>
<text x="1309.0" y="1216.5" class="bt" style="fill:#fff" text-anchor="middle">discipline separately</text>
<rect x="1192" y="1142" width="24.3" height="22" rx="5" fill="#FFFFFF" stroke="#5A6560" stroke-width="1.3"/>
<text x="1204.15" y="1157" class="bdg" text-anchor="middle" fill="#5A6560">4</text>
<text x="1190" y="1272" class="sub">·  Discipline discharges are non-OASIS</text>
<text x="1190" y="1289" class="sub">·  Staggered, not simultaneous</text>
<line x1="1170.0" y1="1152" x2="1170.0" y2="1250" stroke="#5A6560" stroke-width="2" stroke-dasharray="6 5"/>
<text x="1170.0" y="1140" class="trg" text-anchor="middle">OR</text>
<rect x="1462" y="1156" width="250" height="90" rx="5" fill="#2E599D"/>
<text x="1587.0" y="1197.5" class="bt" style="fill:#fff" text-anchor="middle">The last discipline out</text>
<text x="1587.0" y="1216.5" class="bt" style="fill:#fff" text-anchor="middle">does the agency D/C OASIS</text>
<rect x="1470" y="1142" width="24.3" height="22" rx="5" fill="#FFFFFF" stroke="#5A6560" stroke-width="1.3"/>
<text x="1482.15" y="1157" class="bdg" text-anchor="middle" fill="#5A6560">5</text>
<text x="1468" y="1272" class="sub">·  RN, PT, OT — whoever visits last</text>
<text x="1468" y="1289" class="sub">·  Owner is unknown until it happens</text>
<line x1="1434" y1="1201.0" x2="1456" y2="1201.0" class="ln" marker-end="url(#ar)"/>
<rect x="1764" y="1162.0" width="300" height="78" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1914.0" y="1197.5" class="ct" text-anchor="middle" fill="#1B211E">Capacity returns</text>
<text x="1914.0" y="1214.5" class="ct" text-anchor="middle" fill="#1B211E">to the branch</text>
<line x1="1712" y1="1201.0" x2="1758" y2="1201.0" class="ln" marker-end="url(#ar)"/>
<path d="M 1120 1252 L 1120 1350 L 286 1350 L 286 573.0 L 344 573.0" fill="none" class="ln" stroke-dasharray="7 5" opacity=".68" marker-end="url(#ar)"/>
<text x="1096" y="1338" class="hi" text-anchor="end">a new certification period re-enters the plan-of-care phase</text>
<text x="50" y="1434" class="trg" text-anchor="start">MISSED VISIT</text>
<text x="50" y="1452" class="trg" text-anchor="start">AND LEVERS</text>
<rect x="350" y="1404" width="250" height="90" rx="5" fill="#2E599D"/>
<text x="475.0" y="1445.5" class="bt" style="fill:#fff" text-anchor="middle">Clinician documents</text>
<text x="475.0" y="1464.5" class="bt" style="fill:#fff" text-anchor="middle">a missed visit</text>
<rect x="628" y="1404" width="250" height="90" rx="5" fill="#A6E22E"/>
<text x="753.0" y="1445.5" class="bt" style="fill:#1B211E" text-anchor="middle">MD notified inside</text>
<text x="753.0" y="1464.5" class="bt" style="fill:#1B211E" text-anchor="middle">48 hours</text>
<line x1="600" y1="1449.0" x2="622" y2="1449.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="1404" width="250" height="90" rx="5" fill="#792E2E"/>
<text x="1031.0" y="1445.5" class="bt" style="fill:#fff" text-anchor="middle">Not in time →</text>
<text x="1031.0" y="1464.5" class="bt" style="fill:#fff" text-anchor="middle">workflow to the DCS</text>
<line x1="878" y1="1449.0" x2="900" y2="1449.0" class="ln" marker-end="url(#ar)"/>
<text x="350" y="1520" class="note" text-anchor="start">A compliance chain, not a dead end — Medicare requirement and an HCHB hard stop</text>
<rect x="1224" y="1404" width="528" height="90" rx="5" fill="#795933"/>
<text x="1488.0" y="1445.5" class="bt" style="fill:#fff" text-anchor="middle">Per diem / float pool</text>
<text x="1488.0" y="1464.5" class="bt" style="fill:#fff" text-anchor="middle">— no territory, on purpose</text>
<text x="1230" y="1520" class="sub">·  Takes the SOCs, absorbing the admission spike</text>
<text x="1230" y="1537" class="sub">·  Or covers visits to free a territory clinician</text>
<rect x="1780" y="1404" width="528" height="90" rx="5" fill="#1A1A1A"/>
<text x="2044.0" y="1445.5" class="bt" style="fill:#fff" text-anchor="middle">Branch leadership</text>
<text x="2044.0" y="1464.5" class="bt" style="fill:#fff" text-anchor="middle">— the capacity decision</text>
<text x="1786" y="1520" class="sub">·  Territory alignment</text>
<text x="1786" y="1537" class="sub">·  Referral acceptance when capacity tightens</text>
<text x="1224" y="1390" class="trg" text-anchor="start">PULLED ON PURPOSE WHEN CAPACITY TIGHTENS — not recovery, instrument</text>
<rect x="350" y="1574" width="1916" height="160" rx="10" fill="none" stroke="#C9CCC5" stroke-width="1.8" stroke-dasharray="8 6"/>

<line x1="376" y1="1628" x2="376" y2="1718" stroke="#1B211E" stroke-width="3"/>
<text x="394" y="1648" class="colh" text-anchor="start">THREE DIFFERENT CEILINGS ON ONE EPISODE</text>
<text x="394" y="1672" class="sub">·  Auth is permission — how many visits the payer will allow</text>
<text x="394" y="1689" class="sub">·  LUPA is the floor — too few visits and the period pays per visit</text>
<text x="394" y="1706" class="sub">·  Utilisation management is the ceiling — extra visits earn nothing</text>
<line x1="1360" y1="1628" x2="1360" y2="1718" stroke="#C6A01F" stroke-width="3"/>
<text x="1378" y="1648" class="colhb" text-anchor="start">WHAT THIS MAP IS</text>
<text x="1378" y="1672" class="sub">·  Target state — every block sits where the current-state map put it</text>
<text x="1378" y="1689" class="sub">·  Green is the engine. Purple is still HCHB. A colour bar means a person decides</text>
<text x="1378" y="1706" class="sub">·  Numbered chips read against the same numbers on Primary-Flow-Map</text>
<text x="50" y="1816" class="trg" text-anchor="start">WHERE IT</text>
<text x="50" y="1834" class="trg" text-anchor="start">BROKE</text>

<text x="590.0" y="1838.0" class="bt s" style="fill:#5A6560" text-anchor="middle" opacity=".85">the per-discipline explosion</text>

<text x="590.0" y="1878" class="trg" text-anchor="middle">ADDRESSED ABOVE</text>

<text x="1090.0" y="1822.0" class="bt s" style="fill:#5A6560" text-anchor="middle" opacity=".85">Pending-auth visits are invisible</text>

<line x1="985.0" y1="1833.0" x2="1195.0" y2="1833.0" stroke="#5A6560" stroke-width="1.2" opacity=".8"/>
<text x="1090.0" y="1878" class="trg" text-anchor="middle">ADDRESSED ABOVE</text>
<rect x="1350" y="1790" width="480" height="70" rx="5" fill="#FBFBF8" stroke="#5A6560" stroke-width="1.7" stroke-dasharray="7 5" opacity=".8"/>
<text x="1590.0" y="1822.0" class="bt s" style="fill:#5A6560" text-anchor="middle" opacity=".85">The weekly logic is undocumented</text>
<line x1="1478.0" y1="1817.0" x2="1702.0" y2="1817.0" stroke="#5A6560" stroke-width="1.2" opacity=".8"/>
<text x="1590.0" y="1838.0" class="bt s" style="fill:#5A6560" text-anchor="middle" opacity=".85">and entirely unassisted</text>

<text x="1590.0" y="1878" class="trg" text-anchor="middle">ADDRESSED ABOVE</text>
<rect x="1850" y="1790" width="480" height="70" rx="5" fill="#FBFBF8" stroke="#5A6560" stroke-width="1.7" stroke-dasharray="7 5" opacity=".8"/>
<text x="2090.0" y="1822.0" class="bt s" style="fill:#5A6560" text-anchor="middle" opacity=".85">Capacity is read, never modelled</text>
<line x1="1978.0" y1="1817.0" x2="2202.0" y2="1817.0" stroke="#5A6560" stroke-width="1.2" opacity=".8"/>
<text x="2090.0" y="1838.0" class="bt s" style="fill:#5A6560" text-anchor="middle" opacity=".85">so the levers are pulled late</text>
