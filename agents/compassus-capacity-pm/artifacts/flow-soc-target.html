--shadow:0 1px 2px rgba(23,30,26,.05),0 12px 34px -22px rgba(23,30,26,.35);
--body:"Avenir Next",Avenir,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
--display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
--mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#101412;--rule:#2C342E;
--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px -22px rgba(0,0,0,.85);}}
:root[data-theme="dark"]{--paper:#101412;--rule:#2C342E;
--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px -22px rgba(0,0,0,.85);}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);font-family:var(--body);
padding:clamp(10px,2vw,32px);-webkit-font-smoothing:antialiased}
figure{margin:0 auto;max-width:1900px;border:1px solid var(--rule);border-radius:12px;
box-shadow:var(--shadow);overflow-x:auto;background:#FBFBF8}
svg{display:block;width:100%;min-width:1180px;height:auto}
/* --- in-SVG type. units are points on the output sheet --- */
.bt{font-family:var(--body);font-size:16px;font-weight:600;fill:#fff}
.bt.s{font-size:13.5px}
.dt{font-family:var(--body);font-size:15px;font-weight:600;fill:#1B211E}
.ct{font-family:var(--body);font-size:15px;font-weight:600}
.bdg{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.03em}
.ln{stroke:#1B211E;stroke-width:2}
.lb{font-family:var(--mono);font-size:13.5px;fill:#5A6560}
.conn{font-family:var(--mono);font-size:13.5px;fill:#5A6560}
.leg{font-family:var(--body);font-size:15.5px;font-weight:600;fill:#1B211E}
.key{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;fill:#7C8781}
.band{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.12em;fill:#5A6560}
.trg{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.16em;fill:#7C8781}
.pnl{font-family:var(--mono);font-size:13.5px;font-weight:700;letter-spacing:.09em;fill:#792E2E}
.pnlA{font-family:var(--mono);font-size:13.5px;font-weight:700;letter-spacing:.09em;fill:#DF751D}
.note{font-family:var(--body);font-size:14px;fill:#5A6560}
.sub{font-family:var(--body);font-size:13.5px;fill:#5A6560}
.hi{font-family:var(--body);font-size:15px;font-weight:600;fill:#C6A01F}
.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.2em;fill:#7C8781}
.title{font-family:var(--display);font-size:34px;font-weight:600;fill:#1B211E}
.deck{font-family:var(--body);font-size:16px;fill:#5A6560}
.foot{font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;fill:#7C8781}
.boundary{font-family:var(--mono);font-size:13.5px;font-weight:700;letter-spacing:.08em;fill:#1B211E}
.bandhi{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.12em;fill:#2E599D}
.colh{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.11em;fill:#1B211E}
.colhb{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.11em;fill:#2E599D}
.colhA{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.11em;fill:#DF751D}
.vid{font-family:var(--mono);font-size:11.8px;letter-spacing:.06em;fill:#5A6560}
.colt{font-family:var(--body);font-size:18px;font-weight:700}
.tg{font-family:var(--body);font-size:14px;fill:#1B211E}
.spine{font-family:var(--body);font-size:15px;font-weight:700;fill:#1B211E}
@media print{@page{size:2600pt 1780pt;margin:0}
body{background:#fff;padding:0}
figure{max-width:none;border:0;border-radius:0;box-shadow:none;overflow:visible}
svg{min-width:0;width:2600pt;height:1780pt}}
</style>
