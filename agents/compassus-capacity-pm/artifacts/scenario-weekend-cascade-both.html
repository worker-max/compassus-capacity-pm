<text x="3110.0" y="720" class="sub">·  one planned, one recovered</text>
<text x="3110.0" y="737" class="sub">·  from a slot that would have expired</text>
<text x="3110.0" y="754" class="sub">·  the same nurse, the same shift</text>
<rect x="3440" y="604" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="3660.0" y="640.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="3660.0" y="657.0" class="ct" text-anchor="middle" fill="#1B211E">The late discharge cost nothing</text>
<text x="3660.0" y="674.0" class="ct" text-anchor="middle" fill="#1B211E">except a different patient's order.</text>
<text x="3660.0" y="634" class="ct" text-anchor="middle" style="fill:#1E7A46;font-weight:700">A FULL SATURDAY</text>
<rect x="2270" y="918" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="2395.0" y="959.5" class="bt" style="fill:#fff" text-anchor="middle">Welcome call made</text>
<text x="2395.0" y="978.5" class="bt" style="fill:#fff" text-anchor="middle">at eight</text>
<text x="2276" y="1034" class="sub">·  standardised, and early</text>
<text x="2276" y="1051" class="sub">·  not waiting on office capacity</text>
<text x="2276" y="1068" class="sub">·  four hours earlier than before</text>
<rect x="2548" y="918" width="250" height="90" rx="6" fill="#4E8A5B"/>
<text x="2673.0" y="959.5" class="bt" style="fill:#fff" text-anchor="middle">The family still</text>
<text x="2673.0" y="978.5" class="bt" style="fill:#fff" text-anchor="middle">defers to Monday</text>
<text x="2554" y="1034" class="sub">·  the same reasonable decision</text>
<text x="2554" y="1051" class="sub">·  no system changes that</text>
<text x="2554" y="1068" class="sub">·  but we know at eight, not at noon</text>
<line x1="2520" y1="963.0" x2="2542" y2="963.0" class="ln" marker-end="url(#ar)"/>
<rect x="2826" y="918" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="2951.0" y="959.5" class="bt" style="fill:#fff" text-anchor="middle">Both slots reassigned</text>
<text x="2951.0" y="978.5" class="bt" style="fill:#fff" text-anchor="middle">by ten</text>
<text x="2832" y="1034" class="sub">·  to patients ready today</text>
<text x="2832" y="1051" class="sub">·  with the whole day still ahead</text>
<text x="2832" y="1068" class="sub">·  the nurse works a full Sunday</text>
<line x1="2798" y1="963.0" x2="2820" y2="963.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="3229.0" cy="963" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="3229.0" y="968.0" class="bt s" style="fill:#1B211E" text-anchor="middle">Two starts on Sunday</text>
<line x1="3076.0" y1="963" x2="3098.0" y2="963" class="ln" marker-end="url(#ar)"/>
<text x="3110.0" y="1034" class="sub">·  not the ones planned on Friday</text>
<text x="3110.0" y="1051" class="sub">·  the slots were used, which is</text>
<text x="3110.0" y="1068" class="sub">·  what the week actually needed</text>
<rect x="3440" y="918" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="3660.0" y="954.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="3660.0" y="971.0" class="ct" text-anchor="middle" fill="#1B211E">The deferral was never the problem.</text>
<text x="3660.0" y="988.0" class="ct" text-anchor="middle" fill="#1B211E">Finding out too late was.</text>
<text x="3660.0" y="948" class="ct" text-anchor="middle" style="fill:#1E7A46;font-weight:700">A SUNDAY THAT HELD</text>
<rect x="2270" y="1232" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="2395.0" y="1273.5" class="bt" style="fill:#fff" text-anchor="middle">One admission</text>
<text x="2395.0" y="1292.5" class="bt" style="fill:#fff" text-anchor="middle">lands on Monday</text>
<text x="2276" y="1348" class="sub">·  the deferred patient, as agreed</text>
<text x="2276" y="1365" class="sub">·  four already started</text>
<text x="2276" y="1382" class="sub">·  Monday was planned for two</text>
<rect x="2548" y="1232" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="2673.0" y="1273.5" class="bt" style="fill:#fff" text-anchor="middle">Routine visits</text>
<text x="2673.0" y="1292.5" class="bt" style="fill:#fff" text-anchor="middle">run as planned</text>
<text x="2554" y="1348" class="sub">·  nothing pushed into Tuesday</text>
<text x="2554" y="1365" class="sub">·  nothing compressed</text>
<text x="2554" y="1382" class="sub">·  no window put at risk</text>
<line x1="2520" y1="1277.0" x2="2542" y2="1277.0" class="ln" marker-end="url(#ar)"/>
<rect x="2826" y="1232" width="250" height="90" rx="6" fill="#1A1A1A"/>
<text x="2951.0" y="1273.5" class="bt" style="fill:#fff" text-anchor="middle">Thursday's referral</text>
<text x="2951.0" y="1292.5" class="bt" style="fill:#fff" text-anchor="middle">is accepted</text>
<text x="2832" y="1348" class="sub">·  the branch has genuine room</text>
<text x="2832" y="1365" class="sub">·  because the weekend did its work</text>
<text x="2832" y="1382" class="sub">·  the source is told yes</text>
<line x1="2798" y1="1277.0" x2="2820" y2="1277.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="3229.0" cy="1277" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="3229.0" y="1282.0" class="bt s" style="fill:#1B211E" text-anchor="middle">The target is met</text>
<line x1="3076.0" y1="1277" x2="3098.0" y2="1277" class="ln" marker-end="url(#ar)"/>
<text x="3110.0" y="1348" class="sub">·  from the same demand</text>
<text x="3110.0" y="1365" class="sub">·  and the same people</text>
<text x="3110.0" y="1382" class="sub">·  with four weekend starts, not one</text>
<rect x="3440" y="1232" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="3660.0" y="1268.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="3660.0" y="1285.0" class="ct" text-anchor="middle" fill="#1B211E">The weekend set the week up</text>
<text x="3660.0" y="1302.0" class="ct" text-anchor="middle" fill="#1B211E">instead of setting it back.</text>
<text x="3660.0" y="1262" class="ct" text-anchor="middle" style="fill:#1E7A46;font-weight:700">ONE WEEKEND, ONE WHOLE WEEK</text>
<rect x="320" y="1504" width="1858" height="180" rx="10" fill="none" stroke="#C9CCC5" stroke-width="1.8" stroke-dasharray="8 6"/>
<text x="346" y="1540" class="pnl" text-anchor="start">WHAT IT COST</text>
<rect x="2240" y="1504" width="1858" height="180" rx="10" fill="none" stroke="#C9CCC5" stroke-width="1.8" stroke-dasharray="8 6"/>
<text x="2266" y="1540" class="pnl" text-anchor="start">WHAT CHANGED</text>
<line x1="336" y1="1554" x2="336" y2="1570" stroke="#B03A2E" stroke-width="3"/>
<text x="336" y="1592" class="colh" text-anchor="start">1  FRIDAY</text>
<text x="336" y="1620" class="sub">·  three assumptions, none of</text>
<text x="336" y="1637" class="sub">·  them tested until the weekend</text>
<line x1="2256" y1="1554" x2="2256" y2="1570" stroke="#1E7A46" stroke-width="3"/>
<text x="2256" y="1592" class="colh" text-anchor="start">1  FRIDAY</text>
<text x="2256" y="1620" class="sub">·  the same three, each carrying</text>
<text x="2256" y="1637" class="sub">·  a readiness state and a backup</text>
<line x1="788" y1="1554" x2="788" y2="1570" stroke="#B03A2E" stroke-width="3"/>
<text x="788" y="1592" class="colh" text-anchor="start">2  SATURDAY</text>
<text x="788" y="1620" class="sub">·  a late discharge takes a slot</text>
<text x="788" y="1637" class="sub">·  with nothing to replace it</text>
<line x1="2708" y1="1554" x2="2708" y2="1570" stroke="#1E7A46" stroke-width="3"/>
<text x="2708" y="1592" class="colh" text-anchor="start">2  SATURDAY</text>
<text x="2708" y="1620" class="sub">·  the slot is offered on by eight,</text>
<text x="2708" y="1637" class="sub">·  the day stays full</text>
<line x1="1240" y1="1554" x2="1240" y2="1570" stroke="#B03A2E" stroke-width="3"/>
<text x="1240" y="1592" class="colh" text-anchor="start">3  SUNDAY</text>
<text x="1240" y="1620" class="sub">·  a midday call, a deferral,</text>
<text x="1240" y="1637" class="sub">·  and two slots gone</text>
<line x1="3160" y1="1554" x2="3160" y2="1570" stroke="#1E7A46" stroke-width="3"/>
<text x="3160" y="1592" class="colh" text-anchor="start">3  SUNDAY</text>
<text x="3160" y="1620" class="sub">·  an eight o'clock call, the same</text>
<text x="3160" y="1637" class="sub">·  deferral, both slots reused</text>
<line x1="1692" y1="1554" x2="1692" y2="1570" stroke="#B03A2E" stroke-width="3"/>
<text x="1692" y="1592" class="colh" text-anchor="start">4  THE WEEK</text>
<text x="1692" y="1620" class="sub">·  three admissions land Monday,</text>
<text x="1692" y="1637" class="sub">·  the week compresses, a referral declined</text>
<line x1="3612" y1="1554" x2="3612" y2="1570" stroke="#1E7A46" stroke-width="3"/>
<text x="3612" y="1592" class="colh" text-anchor="start">4  THE WEEK</text>
<text x="3612" y="1620" class="sub">·  one lands Monday, the week runs</text>
<text x="3612" y="1637" class="sub">·  as planned, the referral accepted</text>
<rect x="320" y="1704" width="1858" height="112" rx="8" fill="none" stroke="#C9CCC5" stroke-width="1.6" stroke-dasharray="7 5"/>

<text x="378" y="1756" class="sub">Admission Throughput, in depth</text>
