<rect x="2240" y="172" width="1858" height="38" rx="6" fill="#1E7A46"/>
<text x="3169" y="198" class="band" text-anchor="middle" style="fill:#fff">EIGHTEEN MONTHS ON</text>
<rect x="320" y="232" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="266" class="band" text-anchor="start">1  ·  THE QUEUE   ·   MONDAY MORNING</text>
<text x="2004" y="266" class="bandhi" text-anchor="end">MOST OF THE DAY IS NOT A DECISION</text>
<rect x="2240" y="232" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="2262" y="266" class="band" text-anchor="start"></text>
<text x="3924" y="266" class="bandhi" text-anchor="end">THE QUEUE ONLY CARRIES DECISIONS</text>
<rect x="320" y="546" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="580" class="band" text-anchor="start">2  ·  THE CALL-OUT   ·   WEDNESDAY, 7AM</text>
<text x="2004" y="580" class="bandhi" text-anchor="end">THE MOST EXPENSIVE OPTION IS THE FASTEST</text>
<rect x="2240" y="546" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="2262" y="580" class="band" text-anchor="start"></text>
<text x="3924" y="580" class="bandhi" text-anchor="end">COVERAGE IS FOUND BEFORE IT IS BOUGHT</text>
<rect x="320" y="860" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="894" class="band" text-anchor="start">3  ·  A REFERRAL ARRIVES   ·   THURSDAY</text>
<text x="2004" y="894" class="bandhi" text-anchor="end">TURNED DOWN WITH CAPACITY IN THE BUILDING</text>
<rect x="2240" y="860" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="2262" y="894" class="band" text-anchor="start"></text>
<text x="3924" y="894" class="bandhi" text-anchor="end">ACCEPTED, USING THE SAME PEOPLE</text>
<rect x="320" y="1174" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="1208" class="band" text-anchor="start">4  ·  THE WEEK IN REVIEW   ·   FRIDAY</text>
<text x="2004" y="1208" class="bandhi" text-anchor="end">NONE OF THIS APPEARS AS A NUMBER</text>
<rect x="2240" y="1174" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="2262" y="1208" class="band" text-anchor="start"></text>
<text x="3924" y="1208" class="bandhi" text-anchor="end">THE LOSSES BECOME NUMBERS</text>
<rect x="350" y="290" width="250" height="90" rx="6" fill="#795CA7"/>
<text x="475.0" y="331.5" class="bt" style="fill:#fff" text-anchor="middle">The queue rebuilds</text>
<text x="475.0" y="350.5" class="bt" style="fill:#fff" text-anchor="middle">overnight</text>
<text x="356" y="406" class="sub">·  a task for every discipline</text>
<text x="356" y="423" class="sub">·  and again at approval</text>
<text x="356" y="440" class="sub">·  plus one per patient awaiting approval</text>
<rect x="628" y="290" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="753.0" y="331.5" class="bt" style="fill:#fff" text-anchor="middle">The scheduler opens</text>
<text x="753.0" y="350.5" class="bt" style="fill:#fff" text-anchor="middle">them one at a time</text>
<text x="634" y="406" class="sub">·  most need no action at all</text>
<text x="634" y="423" class="sub">·  but each must be opened to know</text>
<text x="634" y="440" class="sub">·  the day is spent finding out</text>
<line x1="600" y1="335.0" x2="622" y2="335.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="290" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="1031.0" y="331.5" class="bt" style="fill:#fff" text-anchor="middle">Bulk clearing</text>
<text x="1031.0" y="350.5" class="bt" style="fill:#fff" text-anchor="middle">becomes the habit</text>
<text x="912" y="406" class="sub">·  a rational response to the volume</text>
<text x="912" y="423" class="sub">·  the one that mattered goes with it</text>
<text x="912" y="440" class="sub">·  nobody can tell which</text>
<line x1="878" y1="335.0" x2="900" y2="335.0" class="ln" marker-end="url(#ar)"/>
<rect x="1184" y="290" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="1309.0" y="331.5" class="bt" style="fill:#fff" text-anchor="middle">Real decisions get</text>
<text x="1309.0" y="350.5" class="bt" style="fill:#fff" text-anchor="middle">the time that is left</text>
<text x="1190" y="406" class="sub">·  the welcome call is one of them</text>
<text x="1190" y="423" class="sub">·  it slips to the afternoon</text>
<text x="1190" y="440" class="sub">·  or to tomorrow</text>
<line x1="1156" y1="335.0" x2="1178" y2="335.0" class="ln" marker-end="url(#ar)"/>
<rect x="1520" y="290" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="326.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="343.0" class="ct" text-anchor="middle" fill="#1B211E">The judgment work is squeezed</text>
<text x="1740.0" y="360.0" class="ct" text-anchor="middle" fill="#1B211E">into what the queue leaves over.</text>
<text x="1740.0" y="320" class="ct" text-anchor="middle" style="fill:#B03A2E;font-weight:700">ADMINISTRATION, NOT SCHEDULING</text>
<rect x="350" y="604" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="475.0" y="645.5" class="bt" style="fill:#fff" text-anchor="middle">A clinician calls</text>
<text x="475.0" y="664.5" class="bt" style="fill:#fff" text-anchor="middle">out at seven</text>
<text x="356" y="720" class="sub">·  six visits on her day</text>
<text x="356" y="737" class="sub">·  two are time-sensitive</text>
<text x="356" y="754" class="sub">·  four could move if someone knew</text>
<rect x="628" y="604" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="753.0" y="645.5" class="bt" style="fill:#fff" text-anchor="middle">Nobody can see</text>
<text x="753.0" y="664.5" class="bt" style="fill:#fff" text-anchor="middle">who has room</text>
<text x="634" y="720" class="sub">·  capacity lives in a spreadsheet</text>
<text x="634" y="737" class="sub">·  updated when someone remembers</text>
<text x="634" y="754" class="sub">·  and not this morning</text>
<line x1="600" y1="649.0" x2="622" y2="649.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="604" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="1031.0" y="645.5" class="bt" style="fill:#fff" text-anchor="middle">The branch calls</text>
<text x="1031.0" y="664.5" class="bt" style="fill:#fff" text-anchor="middle">around</text>
<text x="912" y="720" class="sub">·  per diem first, then contract</text>
<text x="912" y="737" class="sub">·  then incentive pay for extra work</text>
<text x="912" y="754" class="sub">·  whoever answers first</text>
<line x1="878" y1="649.0" x2="900" y2="649.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="1309.0" cy="649" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1309.0" y="654.0" class="bt s" style="fill:#1B211E" text-anchor="middle">Covered, at a premium</text>
<line x1="1156.0" y1="649" x2="1178.0" y2="649" class="ln" marker-end="url(#ar)"/>
<text x="1190.0" y="720" class="sub">·  two visits covered this way</text>
<text x="1190.0" y="737" class="sub">·  two moved, two simply missed</text>
<text x="1190.0" y="754" class="sub">·  the cost lands in the month</text>
<rect x="1520" y="604" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="640.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="657.0" class="ct" text-anchor="middle" fill="#1B211E">Not because coverage was scarce.</text>
<text x="1740.0" y="674.0" class="ct" text-anchor="middle" fill="#1B211E">Because it could not be seen.</text>
<text x="1740.0" y="634" class="ct" text-anchor="middle" style="fill:#B03A2E;font-weight:700">PREMIUM SPEND, BOUGHT IN A HURRY</text>
<rect x="350" y="918" width="250" height="90" rx="6" fill="#1F6F78"/>
<text x="475.0" y="959.5" class="bt" style="fill:#fff" text-anchor="middle">Referral offered</text>
<text x="475.0" y="978.5" class="bt" style="fill:#fff" text-anchor="middle">by the hospital</text>
<text x="356" y="1034" class="sub">·  a good fit for the branch</text>
<text x="356" y="1051" class="sub">·  the kind we want</text>
<text x="356" y="1068" class="sub">·  an answer needed today</text>
<rect x="628" y="918" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="753.0" y="959.5" class="bt" style="fill:#fff" text-anchor="middle">Both admitting nurses</text>
<text x="753.0" y="978.5" class="bt" style="fill:#fff" text-anchor="middle">look full</text>
<text x="634" y="1034" class="sub">·  their weeks are full of routine visits</text>
<text x="634" y="1051" class="sub">·  an assistant could take many</text>
<text x="634" y="1068" class="sub">·  no view of the assistant's week</text>
<line x1="600" y1="963.0" x2="622" y2="963.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="918" width="250" height="90" rx="6" fill="#1A1A1A"/>
<text x="1031.0" y="969.0" class="bt" style="fill:#fff" text-anchor="middle">The branch declines</text>
<text x="912" y="1034" class="sub">·  a defensible call on what is visible</text>
<text x="912" y="1051" class="sub">·  the wrong call on what is true</text>
<text x="912" y="1068" class="sub">·  the source notices</text>
<line x1="878" y1="963.0" x2="900" y2="963.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="1309.0" cy="963" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1309.0" y="968.0" class="bt s" style="fill:#1B211E" text-anchor="middle">Capacity existed</text>
<line x1="1156.0" y1="963" x2="1178.0" y2="963" class="ln" marker-end="url(#ar)"/>
<text x="1190.0" y="1034" class="sub">·  it was in the wrong hands</text>
<text x="1190.0" y="1051" class="sub">·  and nobody could see it</text>
<text x="1190.0" y="1068" class="sub">·  the referral goes elsewhere</text>
<rect x="1520" y="918" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="954.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="971.0" class="ct" text-anchor="middle" fill="#1B211E">Declined for want of capacity</text>
<text x="1740.0" y="988.0" class="ct" text-anchor="middle" fill="#1B211E">the branch actually had.</text>
<text x="1740.0" y="948" class="ct" text-anchor="middle" style="fill:#B03A2E;font-weight:700">AN ADMISSION LOST</text>
<rect x="350" y="1232" width="250" height="90" rx="6" fill="#1A1A1A"/>
<text x="475.0" y="1273.5" class="bt" style="fill:#fff" text-anchor="middle">The branch reviews</text>
<text x="475.0" y="1292.5" class="bt" style="fill:#fff" text-anchor="middle">the week</text>
<text x="356" y="1348" class="sub">·  visits delivered, points, census</text>
<text x="356" y="1365" class="sub">·  all of it accurate</text>
<text x="356" y="1382" class="sub">·  none of it showing what was lost</text>
<rect x="628" y="1232" width="250" height="90" rx="6" fill="#795CA7"/>
<text x="753.0" y="1273.5" class="bt" style="fill:#fff" text-anchor="middle">Premium spend</text>
<text x="753.0" y="1292.5" class="bt" style="fill:#fff" text-anchor="middle">posts to the month</text>
<text x="634" y="1348" class="sub">·  without the reason attached</text>
<text x="634" y="1365" class="sub">·  read as a staffing problem</text>
<text x="634" y="1382" class="sub">·  not a visibility problem</text>
<line x1="600" y1="1277.0" x2="622" y2="1277.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="1232" width="250" height="90" rx="6" fill="#1A1A1A"/>
<text x="1031.0" y="1273.5" class="bt" style="fill:#fff" text-anchor="middle">The declined referral</text>
<text x="1031.0" y="1292.5" class="bt" style="fill:#fff" text-anchor="middle">is not recorded</text>
<text x="912" y="1348" class="sub">·  no reason code exists for it</text>
<text x="912" y="1365" class="sub">·  so it never happened</text>
<text x="912" y="1382" class="sub">·  and cannot be counted</text>
<line x1="878" y1="1277.0" x2="900" y2="1277.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="1309.0" cy="1277" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1309.0" y="1282.0" class="bt s" style="fill:#1B211E" text-anchor="middle">The week looks fine</text>
<line x1="1156.0" y1="1277" x2="1178.0" y2="1277" class="ln" marker-end="url(#ar)"/>
<text x="1190.0" y="1348" class="sub">·  every number is defensible</text>
<text x="1190.0" y="1365" class="sub">·  the losses are all invisible</text>
<text x="1190.0" y="1382" class="sub">·  so nothing changes next week</text>
<rect x="1520" y="1232" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="1268.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="1285.0" class="ct" text-anchor="middle" fill="#1B211E">What cannot be counted cannot</text>
<text x="1740.0" y="1302.0" class="ct" text-anchor="middle" fill="#1B211E">be managed, or improved.</text>
<text x="1740.0" y="1262" class="ct" text-anchor="middle" style="fill:#B03A2E;font-weight:700">INVISIBLE, THEREFORE PERMANENT</text>
<rect x="2270" y="290" width="250" height="90" rx="6" fill="#795CA7"/>
<text x="2395.0" y="331.5" class="bt" style="fill:#fff" text-anchor="middle">Notifications fire</text>
<text x="2395.0" y="350.5" class="bt" style="fill:#fff" text-anchor="middle">on change only</text>
<text x="2276" y="406" class="sub">·  not on the same state each day</text>
<text x="2276" y="423" class="sub">·  the volume falls away</text>
<text x="2276" y="440" class="sub">·  what remains needs an answer</text>
<rect x="2548" y="290" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="2673.0" y="331.5" class="bt" style="fill:#fff" text-anchor="middle">The scheduler works</text>
<text x="2673.0" y="350.5" class="bt" style="fill:#fff" text-anchor="middle">exceptions</text>
<text x="2554" y="406" class="sub">·  urgency, coverage, local knowledge</text>
<text x="2554" y="423" class="sub">·  the work only a person can do</text>
<text x="2554" y="440" class="sub">·  fewer people, better used</text>
<line x1="2520" y1="335.0" x2="2542" y2="335.0" class="ln" marker-end="url(#ar)"/>
<rect x="2826" y="290" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="2951.0" y="331.5" class="bt" style="fill:#fff" text-anchor="middle">Welcome calls go</text>
<text x="2951.0" y="350.5" class="bt" style="fill:#fff" text-anchor="middle">out first thing</text>
<text x="2832" y="406" class="sub">·  standardised, and early</text>
<text x="2832" y="423" class="sub">·  before the day fills</text>
<text x="2832" y="440" class="sub">·  readiness known while it is useful</text>
<line x1="2798" y1="335.0" x2="2820" y2="335.0" class="ln" marker-end="url(#ar)"/>
<rect x="3104" y="290" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="3229.0" y="331.5" class="bt" style="fill:#fff" text-anchor="middle">Care team assigned</text>
<text x="3229.0" y="350.5" class="bt" style="fill:#fff" text-anchor="middle">once, at referral</text>
<text x="3110" y="406" class="sub">·  not once per discipline</text>
<text x="3110" y="423" class="sub">·  the task burst never forms</text>
<text x="3110" y="440" class="sub">·  approval is a single step</text>
<line x1="3076" y1="335.0" x2="3098" y2="335.0" class="ln" marker-end="url(#ar)"/>
<rect x="3440" y="290" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="3660.0" y="326.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="3660.0" y="343.0" class="ct" text-anchor="middle" fill="#1B211E">The queue holds decisions, and</text>
<text x="3660.0" y="360.0" class="ct" text-anchor="middle" fill="#1B211E">the day holds judgment work.</text>
<text x="3660.0" y="320" class="ct" text-anchor="middle" style="fill:#1E7A46;font-weight:700">SCHEDULING, NOT ADMINISTRATION</text>
<rect x="2270" y="604" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="2395.0" y="645.5" class="bt" style="fill:#fff" text-anchor="middle">A clinician calls</text>
<text x="2395.0" y="664.5" class="bt" style="fill:#fff" text-anchor="middle">out at seven</text>
<text x="2276" y="720" class="sub">·  the same six visits</text>
<text x="2276" y="737" class="sub">·  the same two time-sensitive</text>
<text x="2276" y="754" class="sub">·  nothing about this changes</text>
<rect x="2548" y="604" width="250" height="90" rx="6" fill="#795CA7"/>
<text x="2673.0" y="645.5" class="bt" style="fill:#fff" text-anchor="middle">The branch can see</text>
<text x="2673.0" y="664.5" class="bt" style="fill:#fff" text-anchor="middle">who has room</text>
<text x="2554" y="720" class="sub">·  live, across the whole branch</text>
<text x="2554" y="737" class="sub">·  approval and discipline checked</text>
<text x="2554" y="754" class="sub">·  including flexible visits</text>
<line x1="2520" y1="649.0" x2="2542" y2="649.0" class="ln" marker-end="url(#ar)"/>
<rect x="2826" y="604" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="2951.0" y="645.5" class="bt" style="fill:#fff" text-anchor="middle">Two covered from</text>
<text x="2951.0" y="664.5" class="bt" style="fill:#fff" text-anchor="middle">existing capacity</text>
<text x="2832" y="720" class="sub">·  clinicians already on the payroll</text>
<text x="2832" y="737" class="sub">·  who had room and were near</text>
<text x="2832" y="754" class="sub">·  offered, and they accepted</text>
<line x1="2798" y1="649.0" x2="2820" y2="649.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="3229.0" cy="649" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="3229.0" y="654.0" class="bt s" style="fill:#1B211E" text-anchor="middle">Premium used once, not four times</text>
<line x1="3076.0" y1="649" x2="3098.0" y2="649" class="ln" marker-end="url(#ar)"/>
<text x="3110.0" y="720" class="sub">·  for the visit that genuinely</text>
