<text x="394" y="932" class="colh" text-anchor="start">HARD  —  accept it and build the day around it</text>

<text x="1068" y="956" class="sub">·  “Can you come after lunch?”</text>
<text x="1068" y="973" class="sub">·  “Not first thing”  ·  “Not Mondays”</text>
<text x="1068" y="990" class="sub">·  A preferred time with no reason behind it</text>
<line x1="376" y1="914" x2="376" y2="998" stroke="#1B211E" stroke-width="3"/>
<text x="350" y="1048" class="hi" text-anchor="start">The first visit at 8 or 9am is the single largest lever on an individual clinician's capacity.</text>
<text x="350" y="1070" class="note" text-anchor="start">Newer clinicians let the patient set the time, become over-accommodating, and push the cost onto the rest of the team.</text>
<rect x="320" y="1124" width="1420" height="246" rx="10" fill="#E9E9E5"/>

<text x="1718" y="1158" class="bandhi" text-anchor="end">SELECTED IN HCHB</text>
<text x="342" y="1182" class="note" text-anchor="start">chosen the day prior, straight after the confirmation call — not at the door on the day of the visit</text>
<rect x="350" y="1200" width="250" height="76" rx="5" fill="#2E599D"/>
<text x="475.0" y="1235.25" class="bt s" style="fill:#fff" text-anchor="middle">Accept</text>
<text x="475.0" y="1250.75" class="bt s" style="fill:#fff" text-anchor="middle">visit delivered as planned</text>
<text x="475.0" y="1302" class="hi" text-anchor="middle">the most common disposition</text>
<rect x="628" y="1200" width="250" height="76" rx="5" fill="#2E599D"/>
<text x="753.0" y="1235.25" class="bt s" style="fill:#fff" text-anchor="middle">Reschedule</text>
<text x="753.0" y="1250.75" class="bt s" style="fill:#fff" text-anchor="middle">within the week</text>
<text x="753.0" y="1302" class="hi" text-anchor="middle">no scheduler workflow if rapid</text>
<text x="753.0" y="1320" class="hi" text-anchor="middle">reschedule is turned on in HCHB</text>
<rect x="906" y="1200" width="250" height="76" rx="5" fill="#C6A01F"/>
<text x="1031.0" y="1227.5" class="bt s" style="fill:#fff" text-anchor="middle">Reassign</text>
<text x="1031.0" y="1243.0" class="bt s" style="fill:#fff" text-anchor="middle">back to the scheduler</text>
<text x="1031.0" y="1258.5" class="bt s" style="fill:#fff" text-anchor="middle">WITH a plan</text>
<text x="1031.0" y="1302" class="note" text-anchor="middle">the clinician recommends</text>
<text x="1031.0" y="1320" class="note" text-anchor="middle">who should take it</text>
<rect x="1184" y="1200" width="250" height="76" rx="5" fill="#792E2E"/>
<text x="1309.0" y="1235.25" class="bt s" style="fill:#fff" text-anchor="middle">Miss</text>
<text x="1309.0" y="1250.75" class="bt s" style="fill:#fff" text-anchor="middle">→ compliance chain</text>
<text x="1309.0" y="1302" class="note" text-anchor="middle">documentation and</text>
<text x="1309.0" y="1320" class="note" text-anchor="middle">compliance chain follow</text>
<rect x="1462" y="1200" width="250" height="76" rx="5" fill="#C6A01F"/>

<text x="1587.0" y="1243.0" class="bt s" style="fill:#fff" text-anchor="middle">back to the scheduler</text>
<text x="1587.0" y="1258.5" class="bt s" style="fill:#fff" text-anchor="middle">WITHOUT a plan</text>
<text x="1587.0" y="1302" class="note" text-anchor="middle">nothing recommended —</text>
<text x="1587.0" y="1320" class="note" text-anchor="middle">the branch manages placement</text>

<text x="350" y="1354" class="hi" text-anchor="start">Reassign and Decline are both clinician selections in HCHB, and both return the visit to the scheduler — the difference is whether a recommendation comes with it.</text>

<text x="560.0" y="1538.25" class="bt s" style="fill:#fff" text-anchor="middle">RN cannot reassign to her own LPN</text>

const vp = document.getElementById('vp'), vpT = document.getElementById('vp-t'),
      vpB = document.getElementById('vp-b'), vpF = document.getElementById('vp-f'),
      hits = document.getElementById('hits');
let pinned = null;

const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function tags(d){
  const t = [];
  if (d.constraint) t.push(`<span class="tag${/Hard/.test(d.constraint)?' hard':''}">${esc(d.constraint)}</span>`);
  if (d.mvp === 'Yes') t.push('<span class="tag mvp">MVP</span>');
  else if (d.mvp) t.push(`<span class="tag">MVP ${esc(d.mvp)}</span>`);
  if (d.posture) t.push(`<span class="tag">${esc(d.posture)}</span>`);
  if (d.gating === 'Y') t.push('<span class="tag gate">GATING</span>');
  if (d.confidence) t.push(`<span class="tag${d.confidence==='Low'?' lo':''}">conf ${esc(d.confidence)}</span>`);
  if (d.current) t.push(`<span class="tag">${esc(d.current)}</span>`);
  return `<div class="tags">${t.join('')}</div>`;
}

function show(i){
  const s = HOT[i];
  vpT.textContent = s.t;
  vpB.innerHTML = s.v.map(id => {
    const d = VARS[id];
    if (!d) return `<div class="v"><span class="id">${esc(id)}</span>
      <div class="nt">not in the 13 Aug inventory — check the backlog</div></div>`;
    return `<div class="v"><span class="id">${esc(id)} &middot; ${esc(d.layer)}</span>
      <div class="nm">${esc(d.variable)}</div>${tags(d)}
      ${d.notes ? `<div class="nt">${esc(d.notes)}</div>` : ''}
      ${d.sot ? `<div class="nt"><b>Source of truth:</b> ${esc(d.sot)}${
        d.sourced ? ` &middot; sourced by ${esc(d.sourced)}` : ''}</div>` : ''}</div>`;
  }).join('');
  const n = s.v.length;
  vpF.textContent = `${n} variable${n===1?'':'s'} · 13 Aug workbook inventory`;
  // keep the panel off the block being read
  const r = document.querySelector(`.hit[data-i="${i}"]`).getBoundingClientRect();
  vp.classList.toggle('left', r.left + r.width / 2 > window.innerWidth / 2);
  vp.hidden = false;
  hits.classList.add('on');
}

function clear(){
  if (pinned !== null) return;
  vp.hidden = true;
  hits.classList.remove('on');
}

document.querySelectorAll('.hit').forEach(el => {
  const i = +el.dataset.i;
  el.addEventListener('mouseenter', () => { if (pinned === null) show(i); });
  el.addEventListener('mouseleave', clear);
  el.addEventListener('click', e => {
    e.stopPropagation();
    document.querySelectorAll('.hit.pin').forEach(p => p.classList.remove('pin'));
    if (pinned === i) { pinned = null; clear(); return; }
    pinned = i; el.classList.add('pin'); show(i);
  });
});

function unpin(){
  pinned = null;
  document.querySelectorAll('.hit.pin').forEach(p => p.classList.remove('pin'));
  clear();
}
document.getElementById('vp-x').addEventListener('click', unpin);
document.addEventListener('keydown', e => { if (e.key === 'Escape') unpin(); });
document.addEventListener('click', e => { if (!vp.contains(e.target)) unpin(); });
</script>
