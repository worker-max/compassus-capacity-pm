<figure>
<svg viewBox="0 0 2600 1880" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="One clinician's week. A registered nurse who can admit, paid per visit. Monday to Friday, and what the week actually paid her.">
<defs><marker id="ar" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.5" orient="auto-start-reverse"><polygon points="0,0 10,4 0,8" fill="#1B211E"/></marker></defs>
<rect x="0" y="0" width="2600" height="1880" fill="#FBFBF8"/>
<text x="50" y="58" class="eyebrow" text-anchor="start">COMPASSUS HOME HEALTH  ·  CURRENT STATE</text>
<text x="50" y="100" class="title" text-anchor="start">One clinician's week</text>
<text x="50" y="128" class="deck" text-anchor="start">A registered nurse who can admit, paid per visit. Monday to Friday, and what the week actually paid her.</text>
<line x1="50" y1="150" x2="2550" y2="150" stroke="#C9CCC5" stroke-width="1.4"/>
<circle cx="1433" cy="72" r="13" fill="#1F6F78"/>
<text x="1454" y="78" class="leg" text-anchor="start">Intake</text>
<circle cx="1553.4" cy="72" r="13" fill="#DF751D"/>
<text x="1574.4" y="78" class="leg" text-anchor="start">Insurance &amp; Auth</text>
<circle cx="1757.8000000000002" cy="72" r="13" fill="#C6A01F"/>
<text x="1778.8000000000002" y="78" class="leg" text-anchor="start">PCC / Scheduler</text>
<circle cx="1953.8000000000002" cy="72" r="13" fill="#2E599D"/>
<text x="1974.8000000000002" y="78" class="leg" text-anchor="start">Clinician</text>
<circle cx="2099.4" cy="72" r="13" fill="#792E2E"/>
<text x="2120.4" y="78" class="leg" text-anchor="start">DCS</text>
<circle cx="1433" cy="106" r="13" fill="#795CA7"/>
<text x="1454" y="112" class="leg" text-anchor="start">HCHB</text>
<circle cx="1536.6" cy="106" r="13" fill="#795933"/>
<text x="1557.6" y="112" class="leg" text-anchor="start">Per Diem / Float</text>
<circle cx="1741.0" cy="106" r="13" fill="#4E8A5B"/>
<text x="1762.0" y="112" class="leg" text-anchor="start">Patient</text>
<circle cx="1869.8" cy="106" r="13" fill="#1A1A1A"/>
<text x="1890.8" y="112" class="leg" text-anchor="start">Branch leadership</text>
<text x="36" y="224" class="trg" text-anchor="start">TRIGGER</text>
<rect x="36" y="248" width="264" height="90" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="168.0" y="289.5" class="ct" text-anchor="middle" fill="#1B211E">Monday, 7am</text>
<text x="168.0" y="306.5" class="ct" text-anchor="middle" fill="#1B211E">the week as assigned</text>
<line x1="306" y1="293" x2="344" y2="293" class="ln" marker-end="url(#ar)"/>
<rect x="320" y="190" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="224" class="band" text-anchor="start">1  ·  THE WEEK AS IT IS BUILT   ·   MONDAY</text>
<text x="2004" y="224" class="bandhi" text-anchor="end">ADMITTING TIME SPENT ON ROUTINE WORK</text>
<rect x="320" y="504" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="538" class="band" text-anchor="start">2  ·  A DAY INSIDE THAT WEEK   ·   TUESDAY</text>
<text x="2004" y="538" class="bandhi" text-anchor="end">THE DAY IS NEVER ANCHORED</text>
<rect x="320" y="818" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="852" class="band" text-anchor="start">3  ·  WHEN A VISIT FALLS THROUGH   ·   WEDNESDAY</text>
<text x="2004" y="852" class="bandhi" text-anchor="end">A GAP SHE CANNOT FILL HERSELF</text>
<rect x="320" y="1132" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="1166" class="band" text-anchor="start">4  ·  WHAT THE WEEK PAID   ·   FRIDAY</text>
<text x="2004" y="1166" class="bandhi" text-anchor="end">SHORT AGAIN, FOR THE FOURTH WEEK</text>
<rect x="350" y="248" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="475.0" y="289.5" class="bt" style="fill:#fff" text-anchor="middle">Week assigned</text>
<text x="475.0" y="308.5" class="bt" style="fill:#fff" text-anchor="middle">from the queue</text>
<text x="356" y="364" class="sub">·  a points target for the week</text>
<text x="356" y="381" class="sub">·  no view of who else could go</text>
<text x="356" y="398" class="sub">·  assignment by availability</text>
<rect x="628" y="248" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="753.0" y="289.5" class="bt" style="fill:#fff" text-anchor="middle">She plots her own</text>
<text x="753.0" y="308.5" class="bt" style="fill:#fff" text-anchor="middle">week around it</text>
<text x="634" y="364" class="sub">·  no scheduler workflow at all</text>
<text x="634" y="381" class="sub">·  grouped by distance on a map</text>
<text x="634" y="398" class="sub">·  not by how long the drive takes</text>
<line x1="600" y1="293.0" x2="622" y2="293.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="248" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="1031.0" y="289.5" class="bt" style="fill:#fff" text-anchor="middle">Eleven routine visits</text>
<text x="1031.0" y="308.5" class="bt" style="fill:#fff" text-anchor="middle">stay on her list</text>
<text x="912" y="364" class="sub">·  an assistant could take most</text>
<text x="912" y="381" class="sub">·  nobody can see the assistant's week</text>
<text x="912" y="398" class="sub">·  so they stay where they are</text>
<line x1="878" y1="293.0" x2="900" y2="293.0" class="ln" marker-end="url(#ar)"/>
<rect x="1184" y="248" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="1309.0" y="289.5" class="bt" style="fill:#fff" text-anchor="middle">Two admissions</text>
<text x="1309.0" y="308.5" class="bt" style="fill:#fff" text-anchor="middle">is all that fits</text>
<text x="1190" y="364" class="sub">·  she is one of two who can admit</text>
<text x="1190" y="381" class="sub">·  the branch turns one referral away</text>
<text x="1190" y="398" class="sub">·  on Wednesday</text>
<line x1="1156" y1="293.0" x2="1178" y2="293.0" class="ln" marker-end="url(#ar)"/>
<rect x="1520" y="248" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="284.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="301.0" class="ct" text-anchor="middle" fill="#1B211E">Routine work she did not need to</text>
<text x="1740.0" y="318.0" class="ct" text-anchor="middle" fill="#1B211E">carry crowds out two admissions.</text>
<text x="1740.0" y="278" class="ct" text-anchor="middle" style="fill:#B03A2E;font-weight:700">ADMITTING CAPACITY CONSUMED</text>
<rect x="350" y="562" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="475.0" y="603.5" class="bt" style="fill:#fff" text-anchor="middle">First visit</text>
<text x="475.0" y="622.5" class="bt" style="fill:#fff" text-anchor="middle">starts at 10am</text>
<text x="356" y="678" class="sub">·  the patient preferred later</text>
<text x="356" y="695" class="sub">·  nobody pushed back</text>
<text x="356" y="712" class="sub">·  the whole day slides with it</text>
<rect x="628" y="562" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="753.0" y="603.5" class="bt" style="fill:#fff" text-anchor="middle">Crosses the territory</text>
<text x="753.0" y="622.5" class="bt" style="fill:#fff" text-anchor="middle">twice</text>
<text x="634" y="678" class="sub">·  visits grouped by distance</text>
<text x="634" y="695" class="sub">·  not by drive time</text>
<text x="634" y="712" class="sub">·  forty minutes she will not bill</text>
<line x1="600" y1="607.0" x2="622" y2="607.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="562" width="250" height="90" rx="6" fill="#4E8A5B"/>
<text x="1031.0" y="603.5" class="bt" style="fill:#fff" text-anchor="middle">A patient is</text>
<text x="1031.0" y="622.5" class="bt" style="fill:#fff" text-anchor="middle">not ready</text>
<text x="912" y="678" class="sub">·  fifteen minutes on the doorstep</text>
<text x="912" y="695" class="sub">·  then a call to reschedule</text>
<text x="912" y="712" class="sub">·  no replacement to offer</text>
<line x1="878" y1="607.0" x2="900" y2="607.0" class="ln" marker-end="url(#ar)"/>
<rect x="1184" y="562" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="1309.0" y="603.5" class="bt" style="fill:#fff" text-anchor="middle">Documentation</text>
<text x="1309.0" y="622.5" class="bt" style="fill:#fff" text-anchor="middle">after eight</text>
<text x="1190" y="678" class="sub">·  at home, unpaid</text>
<text x="1190" y="695" class="sub">·  plus tomorrow's confirmation calls</text>
<text x="1190" y="712" class="sub">·  about thirty minutes more</text>
<line x1="1156" y1="607.0" x2="1178" y2="607.0" class="ln" marker-end="url(#ar)"/>
<rect x="1520" y="562" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="598.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="615.0" class="ct" text-anchor="middle" fill="#1B211E">Roughly two hours she is not</text>
<text x="1740.0" y="632.0" class="ct" text-anchor="middle" fill="#1B211E">paid for, in a single day.</text>
<text x="1740.0" y="592" class="ct" text-anchor="middle" style="fill:#B03A2E;font-weight:700">UNPAID TIME</text>
<rect x="350" y="876" width="250" height="90" rx="6" fill="#4E8A5B"/>
<text x="475.0" y="917.5" class="bt" style="fill:#fff" text-anchor="middle">Patient cancels</text>
<text x="475.0" y="936.5" class="bt" style="fill:#fff" text-anchor="middle">the evening before</text>
<text x="356" y="992" class="sub">·  rescheduled on the call</text>
<text x="356" y="1009" class="sub">·  that part already works</text>
<text x="356" y="1026" class="sub">·  the gap is the problem</text>
<rect x="628" y="876" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="753.0" y="917.5" class="bt" style="fill:#fff" text-anchor="middle">Two hours open</text>
<text x="753.0" y="936.5" class="bt" style="fill:#fff" text-anchor="middle">in the middle</text>
<text x="634" y="992" class="sub">·  two of her own patients are due</text>
<text x="634" y="1009" class="sub">·  neither is due today</text>
<text x="634" y="1026" class="sub">·  she has no view of anyone else's</text>
<line x1="600" y1="921.0" x2="622" y2="921.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="876" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="1031.0" y="917.5" class="bt" style="fill:#fff" text-anchor="middle">The branch cannot</text>
<text x="1031.0" y="936.5" class="bt" style="fill:#fff" text-anchor="middle">fill it in time</text>
<text x="912" y="992" class="sub">·  no view of who is approved</text>
<text x="912" y="1009" class="sub">·  no view of what could move</text>
<text x="912" y="1026" class="sub">·  by the time it is found, too late</text>
<line x1="878" y1="921.0" x2="900" y2="921.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="1309.0" cy="921" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1309.0" y="926.0" class="bt s" style="fill:#1B211E" text-anchor="middle">The gap goes unused</text>
<line x1="1156.0" y1="921" x2="1178.0" y2="921" class="ln" marker-end="url(#ar)"/>
<text x="1190.0" y="992" class="sub">·  one visit fewer this week</text>
<text x="1190.0" y="1009" class="sub">·  paid per visit, so unpaid</text>
<text x="1190.0" y="1026" class="sub">·  the drive was already made</text>
<rect x="1520" y="876" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="912.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="929.0" class="ct" text-anchor="middle" fill="#1B211E">She absorbs it. It never appears</text>
<text x="1740.0" y="946.0" class="ct" text-anchor="middle" fill="#1B211E">in a branch cost report.</text>
<text x="1740.0" y="906" class="ct" text-anchor="middle" style="fill:#B03A2E;font-weight:700">INCOME LOST, NOT COST SAVED</text>
<rect x="350" y="1190" width="250" height="90" rx="6" fill="#795CA7"/>
<text x="475.0" y="1231.5" class="bt" style="fill:#fff" text-anchor="middle">Points fall short</text>
<text x="475.0" y="1250.5" class="bt" style="fill:#fff" text-anchor="middle">of the target</text>
<text x="356" y="1306" class="sub">·  not through any fault of hers</text>
<text x="356" y="1323" class="sub">·  the work was not there to take</text>
<text x="356" y="1340" class="sub">·  or could not be reached</text>
<rect x="628" y="1190" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="753.0" y="1231.5" class="bt" style="fill:#fff" text-anchor="middle">Her pay lands below</text>
<text x="753.0" y="1250.5" class="bt" style="fill:#fff" text-anchor="middle">what she expected</text>
<text x="634" y="1306" class="sub">·  quoted a figure when hired</text>
<text x="634" y="1323" class="sub">·  has not reached it since</text>
<text x="634" y="1340" class="sub">·  no one has noticed</text>
<line x1="600" y1="1235.0" x2="622" y2="1235.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="1190" width="250" height="90" rx="6" fill="#1A1A1A"/>
<text x="1031.0" y="1231.5" class="bt" style="fill:#fff" text-anchor="middle">Leadership sees</text>
<text x="1031.0" y="1250.5" class="bt" style="fill:#fff" text-anchor="middle">a productivity number</text>
<text x="912" y="1306" class="sub">·  reported after the fact</text>
<text x="912" y="1323" class="sub">·  read as performance</text>
<text x="912" y="1340" class="sub">·  not as a signal she is struggling</text>
<line x1="878" y1="1235.0" x2="900" y2="1235.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="1309.0" cy="1235" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1309.0" y="1240.0" class="bt s" style="fill:#1B211E" text-anchor="middle">She starts looking</text>
<line x1="1156.0" y1="1235" x2="1178.0" y2="1235" class="ln" marker-end="url(#ar)"/>
<text x="1190.0" y="1306" class="sub">·  at six months in</text>
<text x="1190.0" y="1323" class="sub">·  the branch finds out at exit</text>
<text x="1190.0" y="1340" class="sub">·  replacement takes ninety days</text>
<rect x="1520" y="1190" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="1226.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="1243.0" class="ct" text-anchor="middle" fill="#1B211E">Every signal existed. None of it</text>
<text x="1740.0" y="1260.0" class="ct" text-anchor="middle" fill="#1B211E">reached anyone in time.</text>
<text x="1740.0" y="1220" class="ct" text-anchor="middle" style="fill:#B03A2E;font-weight:700">A RESIGNATION IN PROGRESS</text>
<rect x="320" y="1455" width="1698" height="195" rx="10" fill="none" stroke="#C9CCC5" stroke-width="1.8" stroke-dasharray="8 6"/>
<text x="346" y="1491" class="pnl" text-anchor="start">WHAT THE WEEK COST HER, AND US</text>
<line x1="336" y1="1509" x2="336" y2="1525" stroke="#B03A2E" stroke-width="3"/>
<text x="336" y="1547" class="colh" text-anchor="start">1  ADMITTING TIME</text>
<text x="336" y="1577" class="sub">·  routine work she did not</text>
<text x="336" y="1594" class="sub">·  need to carry</text>
<line x1="756" y1="1509" x2="756" y2="1525" stroke="#B03A2E" stroke-width="3"/>
<text x="756" y="1547" class="colh" text-anchor="start">2  THE SHAPE OF THE DAY</text>
<text x="756" y="1577" class="sub">·  a ten o'clock start and</text>
<text x="756" y="1594" class="sub">·  two territory crossings</text>
<line x1="1176" y1="1509" x2="1176" y2="1525" stroke="#B03A2E" stroke-width="3"/>
<text x="1176" y="1547" class="colh" text-anchor="start">3  THE CANCELLED VISIT</text>
<text x="1176" y="1577" class="sub">·  a gap she could not fill,</text>
<text x="1176" y="1594" class="sub">·  absorbed as lost income</text>
<line x1="1596" y1="1509" x2="1596" y2="1525" stroke="#B03A2E" stroke-width="3"/>
<text x="1596" y="1547" class="colh" text-anchor="start">4  WHAT IT PAID</text>
<text x="1596" y="1577" class="sub">·  short again, and nobody</text>
<text x="1596" y="1594" class="sub">·  saw it happening</text>
<rect x="2060" y="1475" width="470" height="112" rx="8" fill="none" stroke="#C9CCC5" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="2080" y="1503" class="colh" text-anchor="start">LEVERS ON THIS SHEET</text>
<text x="2080" y="1527" class="sub" style="fill:#B03A2E;font-weight:700">L2</text>
<text x="2118" y="1527" class="sub">Assessment Capacity Release</text>
<text x="2080" y="1546" class="sub" style="fill:#B03A2E;font-weight:700">L3</text>
<text x="2118" y="1546" class="sub">Same-Day Schedule Recovery</text>
<text x="2080" y="1565" class="sub" style="fill:#B03A2E;font-weight:700">L8</text>
<text x="2118" y="1565" class="sub">Clinician Retention</text>
<text x="2080" y="1584" class="sub" style="fill:#B03A2E;font-weight:700">L9</text>
<text x="2118" y="1584" class="sub">Travel and Territory Efficiency</text>
<line x1="50" y1="1808" x2="2550" y2="1808" stroke="#C9CCC5" stroke-width="1.4"/>
<text x="50" y="1840" class="foot" text-anchor="start">Current state, August 2026.  A representative composite of documented branch patterns, not a single named case.  Nothing on this sheet is a proposal.</text>
<text x="2550" y="1840" class="foot" text-anchor="end">Compassus Home Health  ·  One clinician's week</text>
</svg>
</figure>

<style>
:root{--paper:#F2F3EF;--rule:#D8DAD2;
--shadow:0 1px 2px rgba(23,30,26,.05),0 12px 34px -22px rgba(23,30,26,.35);
--body:"Avenir Next",Avenir,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
--display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
--mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#101412;--rule:#2C342E;
--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px -22px rgba(0,0,0,.85);}}
:root[data-theme="dark"]{--paper:#101412;--rule:#2C342E;
--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px -22px rgba(0,0,0,.85);}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);font-family:var(--body);
padding:clamp(10px,2vw,32px);-webkit-font-smoothing:antialiased}

box-shadow:var(--shadow);overflow-x:auto;background:#FBFBF8}
svg{display:block;width:100%;min-width:1180px;height:auto}
/* --- in-SVG type. units are points on the output sheet --- */
.bt{font-family:var(--body);font-size:16px;font-weight:600;fill:#fff}
.bt.s{font-size:13.5px}
.dt{font-family:var(--body);font-size:15px;font-weight:600;fill:#1B211E}
.ct{font-family:var(--body);font-size:15px;font-weight:600}
.bdg{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.03em}
.ln{stroke:#1B211E;stroke-width:2}
.lb{font-family:var(--mono);font-size:13.5px;fill:#5A6560}
.conn{font-family:var(--mono);font-size:13.5px;fill:#5A6560}
.leg{font-family:var(--body);font-size:15.5px;font-weight:600;fill:#1B211E}
.key{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;fill:#7C8781}
.band{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.12em;fill:#5A6560}
.trg{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.16em;fill:#7C8781}
.pnl{font-family:var(--mono);font-size:13.5px;font-weight:700;letter-spacing:.09em;fill:#792E2E}
.pnlA{font-family:var(--mono);font-size:13.5px;font-weight:700;letter-spacing:.09em;fill:#DF751D}
.note{font-family:var(--body);font-size:14px;fill:#5A6560}
.sub{font-family:var(--body);font-size:13.5px;fill:#5A6560}
.hi{font-family:var(--body);font-size:15px;font-weight:600;fill:#C6A01F}
