<text x="475.0" y="664.5" class="bt" style="fill:#fff" text-anchor="middle">starts at 10am</text>

<text x="753.0" y="664.5" class="bt" style="fill:#fff" text-anchor="middle">twice</text>
<text x="634" y="720" class="sub">·  visits grouped by distance</text>
<text x="634" y="737" class="sub">·  not by drive time</text>
<text x="634" y="754" class="sub">·  forty minutes she will not bill</text>

<text x="1740.0" y="657.0" class="ct" text-anchor="middle" fill="#1B211E">Roughly two hours she is not</text>
<text x="1740.0" y="674.0" class="ct" text-anchor="middle" fill="#1B211E">paid for, in a single day.</text>

<text x="475.0" y="978.5" class="bt" style="fill:#fff" text-anchor="middle">the evening before</text>
<text x="356" y="1034" class="sub">·  rescheduled on the call</text>

<text x="356" y="1068" class="sub">·  the gap is the problem</text>

<text x="634" y="1034" class="sub">·  two of her own patients are due</text>

<text x="912" y="1068" class="sub">·  by the time it is found, too late</text>

<line x1="1156.0" y1="963" x2="1178.0" y2="963" class="ln" marker-end="url(#ar)"/>
<text x="1190.0" y="1034" class="sub">·  one visit fewer this week</text>
<text x="1190.0" y="1051" class="sub">·  paid per visit, so unpaid</text>
<text x="1190.0" y="1068" class="sub">·  the drive was already made</text>

<text x="1740.0" y="971.0" class="ct" text-anchor="middle" fill="#1B211E">She absorbs it. It never appears</text>

<text x="1740.0" y="948" class="ct" text-anchor="middle" style="fill:#B03A2E;font-weight:700">INCOME LOST, NOT COST SAVED</text>

<text x="356" y="1348" class="sub">·  not through any fault of hers</text>

<text x="356" y="1382" class="sub">·  or could not be reached</text>

<text x="634" y="1365" class="sub">·  has not reached it since</text>
<text x="634" y="1382" class="sub">·  no one has noticed</text>

<text x="1309.0" y="1282.0" class="bt s" style="fill:#1B211E" text-anchor="middle">She starts looking</text>

<text x="1190.0" y="1348" class="sub">·  at six months in</text>
<text x="1190.0" y="1365" class="sub">·  the branch finds out at exit</text>
<text x="1190.0" y="1382" class="sub">·  replacement takes ninety days</text>

<text x="1740.0" y="1285.0" class="ct" text-anchor="middle" fill="#1B211E">Every signal existed. None of it</text>
<text x="1740.0" y="1302.0" class="ct" text-anchor="middle" fill="#1B211E">reached anyone in time.</text>
<text x="1740.0" y="1262" class="ct" text-anchor="middle" style="fill:#B03A2E;font-weight:700">A RESIGNATION IN PROGRESS</text>

<text x="2395.0" y="331.5" class="bt" style="fill:#fff" text-anchor="middle">Week proposed</text>

<text x="2276" y="406" class="sub">·  routine work offered to assistants</text>
<text x="2276" y="423" class="sub">·  only where they have room</text>
<text x="2276" y="440" class="sub">·  she reviews and adjusts</text>
<rect x="2548" y="290" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="2673.0" y="331.5" class="bt" style="fill:#fff" text-anchor="middle">She still plots</text>
<text x="2673.0" y="350.5" class="bt" style="fill:#fff" text-anchor="middle">her own week</text>
<text x="2554" y="406" class="sub">·  the tool recommends, she accepts</text>
<text x="2554" y="423" class="sub">·  nothing is assigned to her</text>
<text x="2554" y="440" class="sub">·  grouped by real drive time</text>

<text x="2832" y="406" class="sub">·  who had the capacity</text>
<text x="2832" y="423" class="sub">·  and the right qualification</text>
<text x="2832" y="440" class="sub">·  visible for the first time</text>

<text x="3229.0" y="331.5" class="bt" style="fill:#fff" text-anchor="middle">Four admissions</text>

<text x="3110" y="406" class="sub">·  two more than before</text>

<text x="3110" y="440" class="sub">·  no one was hired</text>
<line x1="3076" y1="335.0" x2="3098" y2="335.0" class="ln" marker-end="url(#ar)"/>
<rect x="3440" y="290" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="3660.0" y="326.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="3660.0" y="343.0" class="ct" text-anchor="middle" fill="#1B211E">Two more admissions from the</text>
<text x="3660.0" y="360.0" class="ct" text-anchor="middle" fill="#1B211E">same nurse and the same week.</text>
<text x="3660.0" y="320" class="ct" text-anchor="middle" style="fill:#1E7A46;font-weight:700">ADMITTING CAPACITY RELEASED</text>

<text x="2832" y="754" class="sub">·  forty minutes back in the day</text>

<text x="3229.0" y="645.5" class="bt" style="fill:#fff" text-anchor="middle">Documentation</text>
<text x="3229.0" y="664.5" class="bt" style="fill:#fff" text-anchor="middle">inside the day</text>
<text x="3110" y="720" class="sub">·  the evening is her own</text>
<text x="3110" y="737" class="sub">·  no confirmation calls to make</text>
<text x="3110" y="754" class="sub">·  roughly two hours returned</text>

<rect x="3440" y="604" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="3660.0" y="640.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="3660.0" y="657.0" class="ct" text-anchor="middle" fill="#1B211E">About two hours a day, and the</text>
<text x="3660.0" y="674.0" class="ct" text-anchor="middle" fill="#1B211E">evening back.</text>
<text x="3660.0" y="634" class="ct" text-anchor="middle" style="fill:#1E7A46;font-weight:700">TIME RETURNED</text>

<text x="2395.0" y="959.5" class="bt" style="fill:#fff" text-anchor="middle">Patient cancels</text>
<text x="2395.0" y="978.5" class="bt" style="fill:#fff" text-anchor="middle">the evening before</text>
<text x="2276" y="1034" class="sub">·  rescheduled on the call</text>
<text x="2276" y="1051" class="sub">·  unchanged from today</text>
<text x="2276" y="1068" class="sub">·  the gap is now visible</text>
<rect x="2548" y="918" width="250" height="90" rx="6" fill="#795CA7"/>
<text x="2673.0" y="959.5" class="bt" style="fill:#fff" text-anchor="middle">Options ranked</text>
<text x="2673.0" y="978.5" class="bt" style="fill:#fff" text-anchor="middle">immediately</text>
<text x="2554" y="1034" class="sub">·  approval and discipline checked</text>
<text x="2554" y="1051" class="sub">·  drive time from where she is</text>
<text x="2554" y="1068" class="sub">·  flexible visits identified</text>
<line x1="2520" y1="963.0" x2="2542" y2="963.0" class="ln" marker-end="url(#ar)"/>
<rect x="2826" y="918" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="2951.0" y="959.5" class="bt" style="fill:#fff" text-anchor="middle">Three offers</text>
<text x="2951.0" y="978.5" class="bt" style="fill:#fff" text-anchor="middle">on her phone</text>
<text x="2832" y="1034" class="sub">·  she chooses, or declines all</text>
<text x="2832" y="1051" class="sub">·  accepted in eight minutes</text>
<text x="2832" y="1068" class="sub">·  including one moved forward</text>
<line x1="2798" y1="963.0" x2="2820" y2="963.0" class="ln" marker-end="url(#ar)"/>

<text x="3229.0" y="968.0" class="bt s" style="fill:#1B211E" text-anchor="middle">The gap is filled</text>
<line x1="3076.0" y1="963" x2="3098.0" y2="963" class="ln" marker-end="url(#ar)"/>
<text x="3110.0" y="1034" class="sub">·  the week stays whole</text>
<text x="3110.0" y="1051" class="sub">·  the patient is seen sooner</text>
<text x="3110.0" y="1068" class="sub">·  the later gap has days to fill</text>
<rect x="3440" y="918" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="3660.0" y="954.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="3660.0" y="971.0" class="ct" text-anchor="middle" fill="#1B211E">The week holds, and so does</text>
<text x="3660.0" y="988.0" class="ct" text-anchor="middle" fill="#1B211E">her paycheck.</text>
<text x="3660.0" y="948" class="ct" text-anchor="middle" style="fill:#1E7A46;font-weight:700">INCOME PROTECTED</text>
<rect x="2270" y="1232" width="250" height="90" rx="6" fill="#795CA7"/>

<text x="2395.0" y="1292.5" class="bt" style="fill:#fff" text-anchor="middle">target</text>
<text x="2276" y="1348" class="sub">·  the work was there</text>
<text x="2276" y="1365" class="sub">·  and it was reachable</text>
<text x="2276" y="1382" class="sub">·  for the fourth week running</text>
<rect x="2548" y="1232" width="250" height="90" rx="6" fill="#2E599D"/>

<text x="2673.0" y="1292.5" class="bt" style="fill:#fff" text-anchor="middle">she was quoted</text>
<text x="2554" y="1348" class="sub">·  the number recruiting gave her</text>
<text x="2554" y="1365" class="sub">·  is the number she earns</text>
<text x="2554" y="1382" class="sub">·  at ninety days and at a year</text>
<line x1="2520" y1="1277.0" x2="2542" y2="1277.0" class="ln" marker-end="url(#ar)"/>
<rect x="2826" y="1232" width="250" height="90" rx="6" fill="#1A1A1A"/>

<text x="2951.0" y="1292.5" class="bt" style="fill:#fff" text-anchor="middle">the trend, not the total</text>
<text x="2832" y="1348" class="sub">·  a dip is visible in week one</text>
<text x="2832" y="1365" class="sub">·  read as a signal, not a score</text>
<text x="2832" y="1382" class="sub">·  a conversation, not a review</text>
<line x1="2798" y1="1277.0" x2="2820" y2="1277.0" class="ln" marker-end="url(#ar)"/>

<text x="3110.0" y="1348" class="sub">·  the reason she leaves is removed</text>
<text x="3110.0" y="1365" class="sub">·  not persuaded, just paid</text>
<text x="3110.0" y="1382" class="sub">·  the caseload holds</text>

<text x="3660.0" y="1268.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="3660.0" y="1285.0" class="ct" text-anchor="middle" fill="#1B211E">The signals reached someone</text>
<text x="3660.0" y="1302.0" class="ct" text-anchor="middle" fill="#1B211E">while it still mattered.</text>
<text x="3660.0" y="1262" class="ct" text-anchor="middle" style="fill:#1E7A46;font-weight:700">A RESIGNATION AVOIDED</text>
