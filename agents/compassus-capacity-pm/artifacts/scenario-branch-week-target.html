<figure>
<svg viewBox="0 0 2600 1880" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="One branch's week. The same branch, the same week, and what it is able to do instead.">
<defs><marker id="ar" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.5" orient="auto-start-reverse"><polygon points="0,0 10,4 0,8" fill="#1B211E"/></marker></defs>
<rect x="0" y="0" width="2600" height="1880" fill="#FBFBF8"/>
<text x="50" y="58" class="eyebrow" text-anchor="start">COMPASSUS HOME HEALTH  ·  TARGET STATE, EIGHTEEN MONTHS ON</text>
<text x="50" y="100" class="title" text-anchor="start">One branch's week  —  the same week, after</text>
<text x="50" y="128" class="deck" text-anchor="start">The same branch, the same week, and what it is able to do instead.</text>
<line x1="50" y1="150" x2="2550" y2="150" stroke="#C9CCC5" stroke-width="1.4"/>
<circle cx="1433" cy="72" r="13" fill="#1F6F78"/>
<text x="1454" y="78" class="leg" text-anchor="start">Intake</text>
<circle cx="1553.4" cy="72" r="13" fill="#DF751D"/>
<text x="1574.4" y="78" class="leg" text-anchor="start">Insurance &amp; Auth</text>
<circle cx="1757.8000000000002" cy="72" r="13" fill="#C6A01F"/>
<text x="1778.8000000000002" y="78" class="leg" text-anchor="start">PCC / Scheduler</text>
<circle cx="1953.8000000000002" cy="72" r="13" fill="#2E599D"/>
<text x="1974.8000000000002" y="78" class="leg" text-anchor="start">Clinician</text>
<circle cx="2099.4" cy="72" r="13" fill="#792E2E"/>
<text x="2120.4" y="78" class="leg" text-anchor="start">DCS</text>
<circle cx="1433" cy="106" r="13" fill="#795CA7"/>
<text x="1454" y="112" class="leg" text-anchor="start">HCHB</text>
<circle cx="1536.6" cy="106" r="13" fill="#795933"/>
<text x="1557.6" y="112" class="leg" text-anchor="start">Per Diem / Float</text>
<circle cx="1741.0" cy="106" r="13" fill="#4E8A5B"/>
<text x="1762.0" y="112" class="leg" text-anchor="start">Patient</text>
<circle cx="1869.8" cy="106" r="13" fill="#1A1A1A"/>
<text x="1890.8" y="112" class="leg" text-anchor="start">Branch leadership</text>
<text x="36" y="224" class="trg" text-anchor="start">TRIGGER</text>
<rect x="36" y="248" width="264" height="90" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="168.0" y="289.5" class="ct" text-anchor="middle" fill="#1B211E">Monday, 7am</text>
<text x="168.0" y="306.5" class="ct" text-anchor="middle" fill="#1B211E">the queue as it stands</text>
<line x1="306" y1="293" x2="344" y2="293" class="ln" marker-end="url(#ar)"/>
<rect x="320" y="190" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="224" class="band" text-anchor="start">1  ·  THE QUEUE   ·   MONDAY MORNING</text>
<text x="2004" y="224" class="bandhi" text-anchor="end">THE QUEUE ONLY CARRIES DECISIONS</text>
<rect x="320" y="504" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="538" class="band" text-anchor="start">2  ·  THE CALL-OUT   ·   WEDNESDAY, 7AM</text>
<text x="2004" y="538" class="bandhi" text-anchor="end">COVERAGE IS FOUND BEFORE IT IS BOUGHT</text>
<rect x="320" y="818" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="852" class="band" text-anchor="start">3  ·  A REFERRAL ARRIVES   ·   THURSDAY</text>
<text x="2004" y="852" class="bandhi" text-anchor="end">ACCEPTED, USING THE SAME PEOPLE</text>
<rect x="320" y="1132" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="1166" class="band" text-anchor="start">4  ·  THE WEEK IN REVIEW   ·   FRIDAY</text>
<text x="2004" y="1166" class="bandhi" text-anchor="end">THE LOSSES BECOME NUMBERS</text>
<rect x="350" y="248" width="250" height="90" rx="6" fill="#795CA7"/>
<text x="475.0" y="289.5" class="bt" style="fill:#fff" text-anchor="middle">Notifications fire</text>
<text x="475.0" y="308.5" class="bt" style="fill:#fff" text-anchor="middle">on change only</text>
<text x="356" y="364" class="sub">·  not on the same state each day</text>
<text x="356" y="381" class="sub">·  the volume falls away</text>
<text x="356" y="398" class="sub">·  what remains needs an answer</text>
<rect x="628" y="248" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="753.0" y="289.5" class="bt" style="fill:#fff" text-anchor="middle">The scheduler works</text>
<text x="753.0" y="308.5" class="bt" style="fill:#fff" text-anchor="middle">exceptions</text>
<text x="634" y="364" class="sub">·  urgency, coverage, local knowledge</text>
<text x="634" y="381" class="sub">·  the work only a person can do</text>
<text x="634" y="398" class="sub">·  fewer people, better used</text>
<line x1="600" y1="293.0" x2="622" y2="293.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="248" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="1031.0" y="289.5" class="bt" style="fill:#fff" text-anchor="middle">Welcome calls go</text>
<text x="1031.0" y="308.5" class="bt" style="fill:#fff" text-anchor="middle">out first thing</text>
<text x="912" y="364" class="sub">·  standardised, and early</text>
<text x="912" y="381" class="sub">·  before the day fills</text>
<text x="912" y="398" class="sub">·  readiness known while it is useful</text>
<line x1="878" y1="293.0" x2="900" y2="293.0" class="ln" marker-end="url(#ar)"/>
<rect x="1184" y="248" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="1309.0" y="289.5" class="bt" style="fill:#fff" text-anchor="middle">Care team assigned</text>
<text x="1309.0" y="308.5" class="bt" style="fill:#fff" text-anchor="middle">once, at referral</text>
<text x="1190" y="364" class="sub">·  not once per discipline</text>
<text x="1190" y="381" class="sub">·  the task burst never forms</text>
<text x="1190" y="398" class="sub">·  approval is a single step</text>
<line x1="1156" y1="293.0" x2="1178" y2="293.0" class="ln" marker-end="url(#ar)"/>
<rect x="1520" y="248" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="284.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="301.0" class="ct" text-anchor="middle" fill="#1B211E">The queue holds decisions, and</text>
<text x="1740.0" y="318.0" class="ct" text-anchor="middle" fill="#1B211E">the day holds judgment work.</text>
<text x="1740.0" y="278" class="ct" text-anchor="middle" style="fill:#1E7A46;font-weight:700">SCHEDULING, NOT ADMINISTRATION</text>
<rect x="350" y="562" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="475.0" y="603.5" class="bt" style="fill:#fff" text-anchor="middle">A clinician calls</text>
<text x="475.0" y="622.5" class="bt" style="fill:#fff" text-anchor="middle">out at seven</text>
<text x="356" y="678" class="sub">·  the same six visits</text>
<text x="356" y="695" class="sub">·  the same two time-sensitive</text>
<text x="356" y="712" class="sub">·  nothing about this changes</text>
<rect x="628" y="562" width="250" height="90" rx="6" fill="#795CA7"/>
<text x="753.0" y="603.5" class="bt" style="fill:#fff" text-anchor="middle">The branch can see</text>
<text x="753.0" y="622.5" class="bt" style="fill:#fff" text-anchor="middle">who has room</text>
<text x="634" y="678" class="sub">·  live, across the whole branch</text>
<text x="634" y="695" class="sub">·  approval and discipline checked</text>
<text x="634" y="712" class="sub">·  including flexible visits</text>
<line x1="600" y1="607.0" x2="622" y2="607.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="562" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="1031.0" y="603.5" class="bt" style="fill:#fff" text-anchor="middle">Two covered from</text>
<text x="1031.0" y="622.5" class="bt" style="fill:#fff" text-anchor="middle">existing capacity</text>
<text x="912" y="678" class="sub">·  clinicians already on the payroll</text>
<text x="912" y="695" class="sub">·  who had room and were near</text>
<text x="912" y="712" class="sub">·  offered, and they accepted</text>
<line x1="878" y1="607.0" x2="900" y2="607.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="1309.0" cy="607" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1309.0" y="612.0" class="bt s" style="fill:#1B211E" text-anchor="middle">Premium used once, not four times</text>
<line x1="1156.0" y1="607" x2="1178.0" y2="607" class="ln" marker-end="url(#ar)"/>
<text x="1190.0" y="678" class="sub">·  for the visit that genuinely</text>
<text x="1190.0" y="695" class="sub">·  had no other option</text>
<text x="1190.0" y="712" class="sub">·  the rest cost nothing extra</text>
<rect x="1520" y="562" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="598.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="615.0" class="ct" text-anchor="middle" fill="#1B211E">Bought where it was needed,</text>
<text x="1740.0" y="632.0" class="ct" text-anchor="middle" fill="#1B211E">not where it was quickest.</text>
<text x="1740.0" y="592" class="ct" text-anchor="middle" style="fill:#1E7A46;font-weight:700">PREMIUM SPEND, PLANNED</text>
<rect x="350" y="876" width="250" height="90" rx="6" fill="#1F6F78"/>
<text x="475.0" y="917.5" class="bt" style="fill:#fff" text-anchor="middle">Referral offered</text>
<text x="475.0" y="936.5" class="bt" style="fill:#fff" text-anchor="middle">by the hospital</text>
<text x="356" y="992" class="sub">·  the same referral</text>
<text x="356" y="1009" class="sub">·  the same day</text>
<text x="356" y="1026" class="sub">·  the same people available</text>
<rect x="628" y="876" width="250" height="90" rx="6" fill="#795CA7"/>
<text x="753.0" y="917.5" class="bt" style="fill:#fff" text-anchor="middle">Admitting capacity</text>
<text x="753.0" y="936.5" class="bt" style="fill:#fff" text-anchor="middle">shown honestly</text>
<text x="634" y="992" class="sub">·  routine work that could move</text>
<text x="634" y="1009" class="sub">·  assistants with room to take it</text>
<text x="634" y="1026" class="sub">·  the true number, not the visible one</text>
<line x1="600" y1="921.0" x2="622" y2="921.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="876" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="1031.0" y="917.5" class="bt" style="fill:#fff" text-anchor="middle">Routine visits</text>
<text x="1031.0" y="936.5" class="bt" style="fill:#fff" text-anchor="middle">shift to assistants</text>
<text x="912" y="992" class="sub">·  only where they have capacity</text>
<text x="912" y="1009" class="sub">·  and the right qualification</text>
<text x="912" y="1026" class="sub">·  the nurse reviews and accepts</text>
<line x1="878" y1="921.0" x2="900" y2="921.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="1309.0" cy="921" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1309.0" y="926.0" class="bt s" style="fill:#1B211E" text-anchor="middle">The referral is accepted</text>
<line x1="1156.0" y1="921" x2="1178.0" y2="921" class="ln" marker-end="url(#ar)"/>
<text x="1190.0" y="992" class="sub">·  an admission the branch would</text>
<text x="1190.0" y="1009" class="sub">·  otherwise have declined</text>
<text x="1190.0" y="1026" class="sub">·  no one was hired</text>
<rect x="1520" y="876" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="912.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="929.0" class="ct" text-anchor="middle" fill="#1B211E">The capacity was always there.</text>
<text x="1740.0" y="946.0" class="ct" text-anchor="middle" fill="#1B211E">Now it can be seen and used.</text>
<text x="1740.0" y="906" class="ct" text-anchor="middle" style="fill:#1E7A46;font-weight:700">AN ADMISSION GAINED</text>
<rect x="350" y="1190" width="250" height="90" rx="6" fill="#1A1A1A"/>
<text x="475.0" y="1231.5" class="bt" style="fill:#fff" text-anchor="middle">The branch reviews</text>
<text x="475.0" y="1250.5" class="bt" style="fill:#fff" text-anchor="middle">the week</text>
<text x="356" y="1306" class="sub">·  the same accurate figures</text>
<text x="356" y="1323" class="sub">·  plus the ones that were missing</text>
<text x="356" y="1340" class="sub">·  capacity offered against filled</text>
<rect x="628" y="1190" width="250" height="90" rx="6" fill="#795CA7"/>
<text x="753.0" y="1231.5" class="bt" style="fill:#fff" text-anchor="middle">Premium spend shows</text>
<text x="753.0" y="1250.5" class="bt" style="fill:#fff" text-anchor="middle">its reason</text>
<text x="634" y="1306" class="sub">·  reactive or planned, per event</text>
<text x="634" y="1323" class="sub">·  a visibility problem is visible</text>
<text x="634" y="1340" class="sub">·  and therefore fixable</text>
<line x1="600" y1="1235.0" x2="622" y2="1235.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="1190" width="250" height="90" rx="6" fill="#1A1A1A"/>
<text x="1031.0" y="1231.5" class="bt" style="fill:#fff" text-anchor="middle">Declines are recorded</text>
<text x="1031.0" y="1250.5" class="bt" style="fill:#fff" text-anchor="middle">with a reason</text>
<text x="912" y="1306" class="sub">·  capacity, clinical, or geography</text>
<text x="912" y="1323" class="sub">·  counted, and trended</text>
<text x="912" y="1340" class="sub">·  the argument for hiring gets evidence</text>
<line x1="878" y1="1235.0" x2="900" y2="1235.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="1309.0" cy="1235" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1309.0" y="1240.0" class="bt s" style="fill:#1B211E" text-anchor="middle">The week can be improved</text>
<line x1="1156.0" y1="1235" x2="1178.0" y2="1235" class="ln" marker-end="url(#ar)"/>
<text x="1190.0" y="1306" class="sub">·  because it can be measured</text>
<text x="1190.0" y="1323" class="sub">·  the same week, next week,</text>
<text x="1190.0" y="1340" class="sub">·  is a decision, not a hope</text>
<rect x="1520" y="1190" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="1226.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="1243.0" class="ct" text-anchor="middle" fill="#1B211E">The first week the branch could</text>
<text x="1740.0" y="1260.0" class="ct" text-anchor="middle" fill="#1B211E">see what it lost.</text>
<text x="1740.0" y="1220" class="ct" text-anchor="middle" style="fill:#1E7A46;font-weight:700">MEASURED, THEREFORE MANAGEABLE</text>
<rect x="320" y="1455" width="1698" height="195" rx="10" fill="none" stroke="#C9CCC5" stroke-width="1.8" stroke-dasharray="8 6"/>
<text x="346" y="1491" class="pnl" text-anchor="start">WHAT CHANGED</text>
<line x1="336" y1="1509" x2="336" y2="1525" stroke="#1E7A46" stroke-width="3"/>
<text x="336" y="1547" class="colh" text-anchor="start">1  THE QUEUE</text>
<text x="336" y="1577" class="sub">·  a queue that only carries</text>
<text x="336" y="1594" class="sub">·  things needing a decision</text>
<line x1="756" y1="1509" x2="756" y2="1525" stroke="#1E7A46" stroke-width="3"/>
<text x="756" y="1547" class="colh" text-anchor="start">2  THE CALL-OUT</text>
<text x="756" y="1577" class="sub">·  premium bought once, where</text>
<text x="756" y="1594" class="sub">·  it was genuinely needed</text>
<line x1="1176" y1="1509" x2="1176" y2="1525" stroke="#1E7A46" stroke-width="3"/>
<text x="1176" y="1547" class="colh" text-anchor="start">3  THE REFERRAL</text>
<text x="1176" y="1577" class="sub">·  accepted, by moving routine</text>
<text x="1176" y="1594" class="sub">·  work to assistants with room</text>
<line x1="1596" y1="1509" x2="1596" y2="1525" stroke="#1E7A46" stroke-width="3"/>
<text x="1596" y="1547" class="colh" text-anchor="start">4  THE REVIEW</text>
<text x="1596" y="1577" class="sub">·  losses counted, so the week</text>
<text x="1596" y="1594" class="sub">·  can actually be improved</text>
<rect x="2060" y="1475" width="470" height="112" rx="8" fill="none" stroke="#C9CCC5" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="2080" y="1503" class="colh" text-anchor="start">LEVERS ON THIS SHEET</text>
<text x="2080" y="1527" class="sub" style="fill:#1E7A46;font-weight:700">L1</text>
<text x="2118" y="1527" class="sub">Admission Throughput</text>
<text x="2080" y="1546" class="sub" style="fill:#1E7A46;font-weight:700">L2</text>
<text x="2118" y="1546" class="sub">Assessment Capacity Release</text>
<text x="2080" y="1565" class="sub" style="fill:#1E7A46;font-weight:700">L6</text>
<text x="2118" y="1565" class="sub">Scheduling Administration Cost</text>
<text x="2080" y="1584" class="sub" style="fill:#1E7A46;font-weight:700">L7</text>
<text x="2118" y="1584" class="sub">Premium Labor Avoidance</text>
<line x1="50" y1="1808" x2="2550" y2="1808" stroke="#C9CCC5" stroke-width="1.4"/>
<text x="50" y="1840" class="foot" text-anchor="start">TARGET STATE  ·  A PROPOSAL.  Eighteen months after implementation.  Drawn against the same week and the same decisions people make.</text>
<text x="2550" y="1840" class="foot" text-anchor="end">Compassus Home Health  ·  One branch's week</text>
</svg>
</figure>

<style>
