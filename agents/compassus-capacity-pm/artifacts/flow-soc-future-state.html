<title>Start of Care — Future State</title>

<figure>
<svg viewBox="0 0 2600 1830" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Future-state start-of-care flow. The capacity answer moves to the front: the platform reads the referral on arrival, tests it against admission capacity by discipline, and the branch director accepts or declines with a captured reason. Authorization keeps its human verification but the payer's rules are surfaced into the plan of care and pending-auth visits become visible in the capacity picture. Readiness outreach runs as an agentic voice call, because consent for text and email is not signed until the start-of-care visit; power-of-attorney status is surfaced before booking; the scheduler keeps the judgment the call raises. Assignment is proposed by the platform and confirmed by a person, always. The plan-of-care pass is largely unchanged -- the change is upstream. Constraints captured at the start of care are handed to the weekly build and the day-before confirmation round, because they drift.">

<text x="50" y="128" class="deck" text-anchor="start">What the platform takes over, what it proposes, and what stays a human call — referral to visits on the calendar</text>
<line x1="50" y1="150" x2="2550" y2="150" stroke="#C9CCC5" stroke-width="1.4"/>

<text x="1478.4" y="64" class="leg" text-anchor="start">Insurance &amp; Auth</text>
<circle cx="1655.8000000000002" cy="58" r="13" fill="#792E2E"/>
<text x="1676.8000000000002" y="64" class="leg" text-anchor="start">DCS</text>

<text x="1766.0000000000002" y="64" class="leg" text-anchor="start">PCC / Scheduler</text>

<text x="1364" y="98" class="leg" text-anchor="start">Clinician</text>
<circle cx="1482.6" cy="92" r="13" fill="#1A1A1A"/>
<text x="1503.6" y="98" class="leg" text-anchor="start">Branch Leadership</text>
<circle cx="1689.3999999999999" cy="92" r="13" fill="#A63A79"/>
<text x="1710.3999999999999" y="98" class="leg" text-anchor="start">The platform</text>
<text x="2550" y="132" class="key" text-anchor="end">BADGE = HOW FAR THE SOFTWARE GOES   ·   automated   ·   proposes, you confirm   ·   surfaces, you decide   ·   stays human</text>
<rect x="320" y="190" width="1976" height="250" rx="10" fill="#E9E9E5"/>
<text x="342" y="224" class="band" text-anchor="start">1  ·  REFERRAL  →  CAN WE TAKE IT?</text>
<text x="2282" y="224" class="bandhi" text-anchor="end">THE CAPACITY ANSWER MOVES TO THE FRONT</text>
<rect x="350" y="252" width="250" height="90" rx="6" fill="#1F6F78"/>
<text x="475.0" y="293.5" class="bt" style="fill:#fff" text-anchor="middle">Intake receives</text>
<text x="475.0" y="312.5" class="bt" style="fill:#fff" text-anchor="middle">the referral</text>
<rect x="482.7" y="238" width="109.30000000000001" height="23" rx="11.5" fill="#FFFFFF" stroke="#1F6F78" stroke-width="1.8"/>
<text x="537.35" y="254" class="bdg" text-anchor="middle" fill="#1F6F78">STAYS HUMAN</text>
<text x="356" y="368" class="sub">·  unchanged</text>
<rect x="628" y="252" width="528" height="90" rx="6" fill="#A63A79"/>
<text x="892.0" y="293.5" class="bt" style="fill:#fff" text-anchor="middle">Referral read</text>
<text x="892.0" y="312.5" class="bt" style="fill:#fff" text-anchor="middle">on arrival</text>
<rect x="1055.3" y="238" width="92.7" height="23" rx="11.5" fill="#FFFFFF" stroke="#A63A79" stroke-width="1.8"/>
<text x="1101.65" y="254" class="bdg" text-anchor="middle" fill="#A63A79">AUTOMATED</text>
<text x="634" y="368" class="sub">·  payer, zip, disciplines ordered</text>
<text x="634" y="385" class="sub">·  expected start-of-care date</text>
<text x="634" y="402" class="sub">·  a verified number for the right person</text>
<line x1="600" y1="297.0" x2="622" y2="297.0" class="ln" marker-end="url(#ar)"/>
<rect x="1184" y="252" width="528" height="90" rx="6" fill="#A63A79"/>
<text x="1448.0" y="293.5" class="bt" style="fill:#fff" text-anchor="middle">Admission capacity</text>
<text x="1448.0" y="312.5" class="bt" style="fill:#fff" text-anchor="middle">tested against it</text>
<rect x="1611.3" y="238" width="92.7" height="23" rx="11.5" fill="#FFFFFF" stroke="#A63A79" stroke-width="1.8"/>
<text x="1657.65" y="254" class="bdg" text-anchor="middle" fill="#A63A79">AUTOMATED</text>
<text x="1190" y="368" class="sub">·  start-of-care-capable clinicians, by discipline</text>
<text x="1190" y="385" class="sub">·  open room this week, by territory</text>
<text x="1190" y="402" class="sub">·  including visits held in pending auth</text>
<line x1="1156" y1="297.0" x2="1178" y2="297.0" class="ln" marker-end="url(#ar)"/>
<rect x="1740" y="252" width="528" height="90" rx="6" fill="#1A1A1A"/>
<text x="2004.0" y="293.5" class="bt" style="fill:#fff" text-anchor="middle">Branch director accepts</text>
<text x="2004.0" y="312.5" class="bt" style="fill:#fff" text-anchor="middle">or declines — with a reason</text>
<rect x="2100.9" y="238" width="159.10000000000002" height="23" rx="11.5" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.8"/>
<text x="2180.45" y="254" class="bdg" text-anchor="middle" fill="#1A1A1A">SURFACES · DECIDE</text>
<text x="1746" y="368" class="sub">·  capacity, clinical or geography — captured, not lost</text>
<text x="1746" y="385" class="sub">·  the reason is what makes next quarter's territory review real</text>
<line x1="1712" y1="297.0" x2="1734" y2="297.0" class="ln" marker-end="url(#ar)"/>
<rect x="50" y="259.0" width="250" height="76" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="175.0" y="293.5" class="ct" text-anchor="middle" fill="#1B211E">Referral arrives</text>
<text x="175.0" y="310.5" class="ct" text-anchor="middle" fill="#1B211E">in Commure</text>
<line x1="300" y1="297.0" x2="344" y2="297.0" class="ln" marker-end="url(#ar)"/>
<text x="50" y="245.0" class="trg" text-anchor="start">TRIGGER</text>
<text x="350" y="424" class="hi" text-anchor="start">Today nobody can see admission capacity — acceptance runs on a proxy and the decline reason is not kept.</text>
<rect x="320" y="474" width="1976" height="250" rx="10" fill="#E9E9E5"/>
<text x="342" y="508" class="band" text-anchor="start">2  ·  AUTHORIZATION — THE RULES, BEFORE THEY BITE</text>
<text x="2282" y="508" class="bandhi" text-anchor="end">THE PAYER'S RULES ALREADY EXIST IN WRITING</text>
<rect x="350" y="536" width="528" height="90" rx="6" fill="#DF751D"/>
<text x="614.0" y="568.0" class="bt" style="fill:#fff" text-anchor="middle">Auth team verifies</text>
<text x="614.0" y="587.0" class="bt" style="fill:#fff" text-anchor="middle">eligibility, keys</text>
<text x="614.0" y="606.0" class="bt" style="fill:#fff" text-anchor="middle">pending auth</text>
<rect x="760.7" y="522" width="109.30000000000001" height="23" rx="11.5" fill="#FFFFFF" stroke="#DF751D" stroke-width="1.8"/>
<text x="815.35" y="538" class="bdg" text-anchor="middle" fill="#DF751D">STAYS HUMAN</text>
<text x="356" y="652" class="sub">·  unchanged — judgment against payer policy</text>
<text x="356" y="669" class="sub">·  the allowance is the payer's, not clinical</text>
<rect x="906" y="536" width="250" height="90" rx="6" fill="#1F6F78"/>
<text x="1031.0" y="577.5" class="bt" style="fill:#fff" text-anchor="middle">Intake final</text>
<text x="1031.0" y="596.5" class="bt" style="fill:#fff" text-anchor="middle">approval</text>
<text x="912" y="652" class="sub">·  unchanged</text>
<line x1="878" y1="581.0" x2="900" y2="581.0" class="ln" marker-end="url(#ar)"/>
<rect x="1184" y="536" width="528" height="90" rx="6" fill="#A63A79"/>
<text x="1448.0" y="577.5" class="bt" style="fill:#fff" text-anchor="middle">Payer rules surfaced</text>
<text x="1448.0" y="596.5" class="bt" style="fill:#fff" text-anchor="middle">into the plan of care</text>
<rect x="1536.6" y="522" width="167.4" height="23" rx="11.5" fill="#FFFFFF" stroke="#A63A79" stroke-width="1.8"/>
<text x="1620.3" y="538" class="bdg" text-anchor="middle" fill="#A63A79">PROPOSES · CONFIRM</text>
<text x="1190" y="652" class="sub">·  the coordination note read at plan-of-care creation, not days after</text>
<text x="1190" y="669" class="sub">·  the pending-auth allowance shown as a ceiling while frequency is plotted</text>
<text x="1190" y="686" class="sub">·  every add-on, recert and resumption re-enters the same loop</text>
<line x1="1156" y1="581.0" x2="1178" y2="581.0" class="ln" marker-end="url(#ar)"/>
<rect x="1740" y="536" width="528" height="90" rx="6" fill="#A63A79"/>
<text x="2004.0" y="577.5" class="bt" style="fill:#fff" text-anchor="middle">Held visits appear</text>
<text x="2004.0" y="596.5" class="bt" style="fill:#fff" text-anchor="middle">in the capacity picture</text>
<rect x="2167.3" y="522" width="92.7" height="23" rx="11.5" fill="#FFFFFF" stroke="#A63A79" stroke-width="1.8"/>
<text x="2213.65" y="538" class="bdg" text-anchor="middle" fill="#A63A79">AUTOMATED</text>
<text x="1746" y="652" class="sub">·  on a calendar, counted, forecastable</text>
<text x="1746" y="669" class="sub">·  the ~50-a-day queue triaged, not bulk-cleared</text>
<line x1="1712" y1="581.0" x2="1734" y2="581.0" class="ln" marker-end="url(#ar)"/>
<text x="350" y="708" class="hi" text-anchor="start">Today a held visit sits on no calendar and counts toward nothing. If you cannot see it, you cannot plan it.</text>
<rect x="320" y="758" width="1976" height="250" rx="10" fill="#E9E9E5"/>
<text x="342" y="792" class="band" text-anchor="start">3  ·  READINESS — AND WHY IT HAS TO BE A VOICE CALL</text>
<text x="2282" y="792" class="bandhi" text-anchor="end">CONSENT IS SIGNED AT THE SOC VISIT — NOTHING TEXTED CAN PRECEDE IT</text>
<rect x="350" y="820" width="806" height="90" rx="6" fill="#A63A79"/>
<text x="753.0" y="861.5" class="bt" style="fill:#fff" text-anchor="middle">Readiness outreach</text>
<text x="753.0" y="880.5" class="bt" style="fill:#fff" text-anchor="middle">— agentic voice</text>
<rect x="1055.3" y="806" width="92.7" height="23" rx="11.5" fill="#FFFFFF" stroke="#A63A79" stroke-width="1.8"/>
<text x="1101.65" y="822" class="bdg" text-anchor="middle" fill="#A63A79">AUTOMATED</text>
<text x="356" y="936" class="sub">·  reaches the verified contact, not the chart's oldest number</text>
<text x="356" y="953" class="sub">·  is the patient home — not still inpatient, not deferring</text>
<text x="356" y="970" class="sub">·  text and email are unavailable until consent is signed</text>
<rect x="1184" y="820" width="528" height="90" rx="6" fill="#A63A79"/>
<text x="1448.0" y="861.5" class="bt" style="fill:#fff" text-anchor="middle">Signing authority</text>
<text x="1448.0" y="880.5" class="bt" style="fill:#fff" text-anchor="middle">surfaced before booking</text>
<rect x="1544.9" y="806" width="159.10000000000002" height="23" rx="11.5" fill="#FFFFFF" stroke="#A63A79" stroke-width="1.8"/>
<text x="1624.45" y="822" class="bdg" text-anchor="middle" fill="#A63A79">SURFACES · DECIDE</text>
<text x="1190" y="936" class="sub">·  who may sign the consent</text>
<text x="1190" y="953" class="sub">·  who may be contacted at all</text>
<line x1="1156" y1="865.0" x2="1178" y2="865.0" class="ln" marker-end="url(#ar)"/>
<rect x="1740" y="820" width="528" height="90" rx="6" fill="#C6A01F"/>
<text x="2004.0" y="861.5" class="bt" style="fill:#fff" text-anchor="middle">Scheduler owns what</text>
<text x="2004.0" y="880.5" class="bt" style="fill:#fff" text-anchor="middle">the call turns up</text>
<rect x="2150.7" y="806" width="109.30000000000001" height="23" rx="11.5" fill="#FFFFFF" stroke="#C6A01F" stroke-width="1.8"/>
<text x="2205.35" y="822" class="bdg" text-anchor="middle" fill="#C6A01F">STAYS HUMAN</text>
<text x="1746" y="936" class="sub">·  deferring admission, family not ready, not home</text>
<text x="1746" y="953" class="sub">·  the exception now — not every referral</text>
<line x1="1712" y1="865.0" x2="1734" y2="865.0" class="ln" marker-end="url(#ar)"/>
<text x="350" y="992" class="hi" text-anchor="start">This is the scheduler's one true judgment call today, and they make it on every single referral.</text>
<rect x="320" y="1042" width="1976" height="250" rx="10" fill="#E9E9E5"/>
<text x="342" y="1076" class="band" text-anchor="start">4  ·  ASSIGNMENT — PROPOSED, THEN CONFIRMED</text>
<text x="2282" y="1076" class="bandhi" text-anchor="end">HUMAN CONFIRM IS THE LAST STEP, ALWAYS</text>
<rect x="350" y="1104" width="806" height="90" rx="6" fill="#A63A79"/>
<text x="753.0" y="1145.5" class="bt" style="fill:#fff" text-anchor="middle">Platform proposes</text>
<text x="753.0" y="1164.5" class="bt" style="fill:#fff" text-anchor="middle">clinician and slot</text>
<rect x="980.6" y="1090" width="167.4" height="23" rx="11.5" fill="#FFFFFF" stroke="#A63A79" stroke-width="1.8"/>
<text x="1064.3" y="1106" class="bdg" text-anchor="middle" fill="#A63A79">PROPOSES · CONFIRM</text>
<text x="356" y="1220" class="sub">·  discipline and role, competency, acuity to skill</text>
<text x="356" y="1237" class="sub">·  reachability by drive time, not distance</text>
<text x="356" y="1254" class="sub">·  continuity, and the compliance window it has to land in</text>
<rect x="1184" y="1104" width="528" height="90" rx="6" fill="#C6A01F"/>
<text x="1448.0" y="1145.5" class="bt" style="fill:#fff" text-anchor="middle">Scheduler confirms</text>
<text x="1448.0" y="1164.5" class="bt" style="fill:#fff" text-anchor="middle">or overrides</text>
<rect x="1594.7" y="1090" width="109.30000000000001" height="23" rx="11.5" fill="#FFFFFF" stroke="#C6A01F" stroke-width="1.8"/>
<text x="1649.35" y="1106" class="bdg" text-anchor="middle" fill="#C6A01F">STAYS HUMAN</text>
<text x="1190" y="1220" class="sub">·  the override reason is captured</text>
<text x="1190" y="1237" class="sub">·  it is the best training signal in the process</text>
<line x1="1156" y1="1149.0" x2="1178" y2="1149.0" class="ln" marker-end="url(#ar)"/>
<rect x="1740" y="1104" width="528" height="90" rx="6" fill="#2E599D"/>
<text x="2004.0" y="1145.5" class="bt" style="fill:#fff" text-anchor="middle">SOC / ROC and the</text>
<text x="2004.0" y="1164.5" class="bt" style="fill:#fff" text-anchor="middle">discipline evals performed</text>
<text x="1746" y="1220" class="sub">·  RN at the start of care</text>
<text x="1746" y="1237" class="sub">·  PT, OT, ST at their own evals, 1–2 days later</text>
<line x1="1712" y1="1149.0" x2="1734" y2="1149.0" class="ln" marker-end="url(#ar)"/>
<text x="350" y="1276" class="hi" text-anchor="start">Clinicians already do this by hand when they recommend who should take a visit they cannot. That is the model, unpaid.</text>
<rect x="320" y="1326" width="1976" height="178" rx="10" fill="#E9E9E5"/>
<text x="342" y="1360" class="band" text-anchor="start">5  ·  PLAN OF CARE  →  VISITS ON THE CALENDAR</text>
<text x="2282" y="1360" class="bandhi" text-anchor="end">LARGELY UNCHANGED — THE CHANGE IS UPSTREAM</text>
<rect x="350" y="1388" width="528" height="90" rx="6" fill="#2E599D"/>
<text x="614.0" y="1429.5" class="bt" style="fill:#fff" text-anchor="middle">Clinician plots</text>
<text x="614.0" y="1448.5" class="bt" style="fill:#fff" text-anchor="middle">frequency</text>
<rect x="727.5" y="1374" width="142.5" height="23" rx="11.5" fill="#FFFFFF" stroke="#2E599D" stroke-width="1.8"/>
<text x="798.75" y="1390" class="bdg" text-anchor="middle" fill="#2E599D">× N disciplines</text>
<rect x="906" y="1388" width="250" height="90" rx="6" fill="#792E2E"/>
<text x="1031.0" y="1429.5" class="bt" style="fill:#fff" text-anchor="middle">DCS reviews</text>
<text x="1031.0" y="1448.5" class="bt" style="fill:#fff" text-anchor="middle">and approves</text>
<line x1="878" y1="1433.0" x2="900" y2="1433.0" class="ln" marker-end="url(#ar)"/>
<rect x="1184" y="1388" width="528" height="90" rx="6" fill="#A63A79"/>
<text x="1448.0" y="1429.5" class="bt" style="fill:#fff" text-anchor="middle">Queue age visible to</text>
<text x="1448.0" y="1448.5" class="bt" style="fill:#fff" text-anchor="middle">the people it blocks</text>
<rect x="1619.6" y="1374" width="84.4" height="23" rx="11.5" fill="#FFFFFF" stroke="#A63A79" stroke-width="1.8"/>
<text x="1661.8" y="1390" class="bdg" text-anchor="middle" fill="#A63A79">SURFACES</text>
<line x1="1156" y1="1433.0" x2="1178" y2="1433.0" class="ln" marker-end="url(#ar)"/>
<rect x="1740" y="1388" width="528" height="90" rx="6" fill="#A63A79"/>
<text x="2004.0" y="1429.5" class="bt" style="fill:#fff" text-anchor="middle">Visits generate ·</text>
<text x="2004.0" y="1448.5" class="bt" style="fill:#fff" text-anchor="middle">auth checked per visit</text>
<rect x="2167.3" y="1374" width="92.7" height="23" rx="11.5" fill="#FFFFFF" stroke="#A63A79" stroke-width="1.8"/>
<text x="2213.65" y="1390" class="bdg" text-anchor="middle" fill="#A63A79">AUTOMATED</text>
<line x1="1712" y1="1433.0" x2="1734" y2="1433.0" class="ln" marker-end="url(#ar)"/>
<rect x="320" y="1544" width="1976" height="172" rx="10" fill="none" stroke="#C9CCC5" stroke-width="1.8" stroke-dasharray="8 6"/>
<text x="346" y="1580" class="pnl" text-anchor="start">WHAT THE START OF CARE HANDS TO THE WEEK — captured here, but none of it stays true on its own</text>
<rect x="346" y="1600" width="255.0" height="46" rx="23.0" fill="#FFFFFF" stroke="#4E8A5B" stroke-width="1.8"/>
<text x="473.5" y="1628.0" class="ct" text-anchor="middle" fill="#4E8A5B">Caregiver must be present</text>
<rect x="617.0" y="1600" width="246.39999999999998" height="46" rx="23.0" fill="#FFFFFF" stroke="#4E8A5B" stroke-width="1.8"/>
<text x="740.2" y="1628.0" class="ct" text-anchor="middle" fill="#4E8A5B">Caregiver's own schedule</text>
<rect x="879.4" y="1600" width="229.2" height="46" rx="23.0" fill="#FFFFFF" stroke="#4E8A5B" stroke-width="1.8"/>
<text x="994.0" y="1628.0" class="ct" text-anchor="middle" fill="#4E8A5B">Competing appointments</text>
<rect x="1124.6" y="1600" width="255.0" height="46" rx="23.0" fill="#FFFFFF" stroke="#4E8A5B" stroke-width="1.8"/>
<text x="1252.1" y="1628.0" class="ct" text-anchor="middle" fill="#4E8A5B">Times the patient refuses</text>
<rect x="1395.6" y="1600" width="272.2" height="46" rx="23.0" fill="#FFFFFF" stroke="#4E8A5B" stroke-width="1.8"/>
<text x="1531.6999999999998" y="1628.0" class="ct" text-anchor="middle" fill="#4E8A5B">How they want to be reached</text>
<text x="346" y="1678" class="note" text-anchor="start">Each of these is real at admission and quietly stops being real — the caregiver who has to open the door until mobility improves, the</text>
<text x="346" y="1698" class="note" text-anchor="start">appointment booked in week four. They are re-established in the weekly build and the day-before round, not captured once and trusted.</text>
<path d="M 2296 1630.0 L 2386 1630.0" fill="none" class="ln" marker-end="url(#ar)"/>

<text x="50" y="1790" class="foot" text-anchor="start">FUTURE STATE — every box on this sheet is a proposal. Current practice is Flow 1. Postures and owners are read from the variable workbook, not invented here.</text>
