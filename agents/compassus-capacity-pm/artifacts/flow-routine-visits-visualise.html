<title>Routine visits — visualise only</title>

<text x="634" y="739" class="sub">·  Wound · IV · catheter due</text>
<text x="634" y="756" class="sub">·  Labs due</text>
<text x="634" y="773" class="sub">·  Who can safely wait</text>

<text x="912" y="756" class="sub">·  Bridges · rivers · crossings</text>
<text x="912" y="773" class="sub">·  Where the day starts</text>

<text x="1309.0" y="666.5" class="bt" text-anchor="middle">constraints</text>
<text x="1190" y="722" class="sub">·  Wound care timing</text>
<text x="1190" y="739" class="sub">·  Catheter and IV schedules</text>
<text x="1190" y="756" class="sub">·  Caregiver must be present</text>
<text x="1190" y="773" class="sub">·  Dialysis · MD appointments</text>

<text x="1468" y="756" class="sub">·  Patient not home</text>
<text x="1468" y="773" class="sub">·  → see the panel below</text>

<text x="1746" y="756" class="sub">·  Traffic and time of day</text>
<text x="1746" y="773" class="sub">·  Where the day must end</text>

<text x="376" y="896" class="pnl" text-anchor="start">THE DAY-BEFORE NEGOTIATION — what the clinician has to hold</text>
<text x="394" y="932" class="colh" text-anchor="start">HARD  —  accept it and build the day around it</text>
<text x="394" y="956" class="sub">·  Dialysis days and times</text>
<text x="394" y="973" class="sub">·  MD and specialist appointments</text>
<text x="394" y="990" class="sub">·  Caregiver's working hours</text>
<text x="394" y="1007" class="sub">·  Patient genuinely not home</text>
<line x1="1050" y1="914" x2="1050" y2="998" stroke="#2E599D" stroke-width="3"/>
<text x="1068" y="932" class="colhb" text-anchor="start">SOFT  —  negotiable, and worth holding the line on</text>
<text x="1068" y="956" class="sub">·  “Can you come after lunch?”</text>
<text x="1068" y="973" class="sub">·  “Not first thing”  ·  “Not Mondays”</text>
<text x="1068" y="990" class="sub">·  A preferred time with no reason behind it</text>
<line x1="376" y1="914" x2="376" y2="998" stroke="#1B211E" stroke-width="3"/>
<text x="350" y="1048" class="hi" text-anchor="start">The first visit at 8 or 9am is the single largest lever on an individual clinician's capacity.</text>
<text x="350" y="1070" class="note" text-anchor="start">Newer clinicians let the patient set the time, become over-accommodating, and push the cost onto the rest of the team.</text>
<rect x="320" y="1124" width="1420" height="246" rx="10" fill="#E9E9E5"/>
<text x="342" y="1158" class="band" text-anchor="start">THE DAY BEFORE  ·  THE CLINICIAN'S FIVE DISPOSITIONS</text>
<text x="1718" y="1158" class="bandhi" text-anchor="end">SELECTED IN HCHB</text>
<text x="342" y="1182" class="note" text-anchor="start">chosen the day prior, straight after the confirmation call — not at the door on the day of the visit</text>
<rect x="350" y="1200" width="250" height="76" rx="5" fill="#2E599D"/>
<text x="475.0" y="1235.25" class="bt s" text-anchor="middle">Accept</text>
<text x="475.0" y="1250.75" class="bt s" text-anchor="middle">visit delivered as planned</text>
<rect x="346" y="1196" width="258" height="84" rx="9" fill="none" stroke="#A6E22E" stroke-width="5"/>
<text x="475.0" y="1302" class="hi" text-anchor="middle">the most common disposition</text>
<rect x="628" y="1200" width="250" height="76" rx="5" fill="#2E599D"/>
<text x="753.0" y="1235.25" class="bt s" text-anchor="middle">Reschedule</text>
<text x="753.0" y="1250.75" class="bt s" text-anchor="middle">within the week</text>
<rect x="624" y="1196" width="258" height="84" rx="9" fill="none" stroke="#A6E22E" stroke-width="5"/>
<text x="753.0" y="1302" class="hi" text-anchor="middle">no scheduler workflow if rapid</text>
<text x="753.0" y="1320" class="hi" text-anchor="middle">reschedule is turned on in HCHB</text>
<rect x="906" y="1200" width="250" height="76" rx="5" fill="#C6A01F"/>
<text x="1031.0" y="1227.5" class="bt s" text-anchor="middle">Reassign</text>
<text x="1031.0" y="1243.0" class="bt s" text-anchor="middle">back to the scheduler</text>
<text x="1031.0" y="1258.5" class="bt s" text-anchor="middle">WITH a plan</text>
<text x="1031.0" y="1302" class="note" text-anchor="middle">the clinician recommends</text>
<text x="1031.0" y="1320" class="note" text-anchor="middle">who should take it</text>
<rect x="1184" y="1200" width="250" height="76" rx="5" fill="#792E2E"/>
<text x="1309.0" y="1235.25" class="bt s" text-anchor="middle">Miss</text>
<text x="1309.0" y="1250.75" class="bt s" text-anchor="middle">→ compliance chain</text>
<rect x="1180" y="1196" width="258" height="84" rx="9" fill="none" stroke="#A6E22E" stroke-width="5"/>
<text x="1309.0" y="1302" class="note" text-anchor="middle">documentation and</text>
<text x="1309.0" y="1320" class="note" text-anchor="middle">compliance chain follow</text>
<rect x="1462" y="1200" width="250" height="76" rx="5" fill="#C6A01F"/>
<text x="1587.0" y="1227.5" class="bt s" text-anchor="middle">Decline</text>
<text x="1587.0" y="1243.0" class="bt s" text-anchor="middle">back to the scheduler</text>
<text x="1587.0" y="1258.5" class="bt s" text-anchor="middle">WITHOUT a plan</text>
<text x="1587.0" y="1302" class="note" text-anchor="middle">nothing recommended —</text>
<text x="1587.0" y="1320" class="note" text-anchor="middle">the branch manages placement</text>

<line x1="290" y1="1238" x2="344" y2="1238" class="ln" marker-end="url(#ar)"/>
<text x="350" y="1354" class="hi" text-anchor="start">Reassign and Decline are both clinician selections in HCHB, and both return the visit to the scheduler — the difference is whether a recommendation comes with it.</text>
<text x="50" y="1446" class="trg" text-anchor="start">BOUNDARIES</text>
<rect x="350" y="1424" width="252.39999999999998" height="42" rx="21.0" fill="#FFFFFF" stroke="#5A6560" stroke-width="1.8"/>
<text x="476.2" y="1450.0" class="ct" text-anchor="middle" fill="#5A6560">OASIS visits do not move</text>
<rect x="622.4" y="1424" width="321.2" height="42" rx="21.0" fill="#FFFFFF" stroke="#5A6560" stroke-width="1.8"/>
<text x="783.0" y="1450.0" class="ct" text-anchor="middle" fill="#5A6560">Medicare week is Sunday–Saturday</text>
<rect x="963.5999999999999" y="1424" width="372.8" height="42" rx="21.0" fill="#FFFFFF" stroke="#5A6560" stroke-width="1.8"/>
<text x="1150.0" y="1450.0" class="ct" text-anchor="middle" fill="#5A6560">Inside the 60-day certification period</text>
<rect x="1356.3999999999999" y="1424" width="278.2" height="42" rx="21.0" fill="#FFFFFF" stroke="#5A6560" stroke-width="1.8"/>
<text x="1495.4999999999998" y="1450.0" class="ct" text-anchor="middle" fill="#5A6560">Auth still gates assignment</text>
<text x="50" y="1532" class="trg" text-anchor="start">WHERE IT</text>
<text x="50" y="1550" class="trg" text-anchor="start">BREAKS</text>
<rect x="350" y="1506" width="420" height="70" rx="5" fill="#792E2E"/>
<text x="560.0" y="1538.25" class="bt s" text-anchor="middle">RN cannot reassign to her own LPN</text>
<text x="560.0" y="1553.75" class="bt s" text-anchor="middle">an HCHB rule, not Medicare</text>
<rect x="346" y="1502" width="428" height="78" rx="9" fill="none" stroke="#A6E22E" stroke-width="5"/>
<rect x="790" y="1506" width="420" height="70" rx="5" fill="#792E2E"/>
<text x="1000.0" y="1538.25" class="bt s" text-anchor="middle">Supervisor cannot see</text>
<text x="1000.0" y="1553.75" class="bt s" text-anchor="middle">the supervisee's schedule</text>
<rect x="786" y="1502" width="428" height="78" rx="9" fill="none" stroke="#A6E22E" stroke-width="5"/>
<rect x="1230" y="1506" width="420" height="70" rx="5" fill="#2E599D"/>
<text x="1440.0" y="1538.25" class="bt s" text-anchor="middle">Day-before calls are</text>
<text x="1440.0" y="1553.75" class="bt s" text-anchor="middle">unpaid evening work</text>
<rect x="1670" y="1506" width="420" height="70" rx="5" fill="#2E599D"/>
<text x="1880.0" y="1538.25" class="bt s" text-anchor="middle">The weekly logic is</text>
<text x="1880.0" y="1553.75" class="bt s" text-anchor="middle">undocumented and unassisted</text>
<rect x="1666" y="1502" width="428" height="78" rx="9" fill="none" stroke="#A6E22E" stroke-width="5"/>
