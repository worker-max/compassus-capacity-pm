<text x="50" y="100" class="title" text-anchor="start">One clinician's week  —  the same week, after</text>
<text x="50" y="128" class="deck" text-anchor="start">The same nurse, the same caseload, and what changes around her.</text>

<text x="1890.8" y="112" class="leg" text-anchor="start">Branch leadership</text>
<text x="36" y="224" class="trg" text-anchor="start">TRIGGER</text>
<rect x="36" y="248" width="264" height="90" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="168.0" y="289.5" class="ct" text-anchor="middle" fill="#1B211E">Monday, 7am</text>
<text x="168.0" y="306.5" class="ct" text-anchor="middle" fill="#1B211E">the week as assigned</text>
<line x1="306" y1="293" x2="344" y2="293" class="ln" marker-end="url(#ar)"/>
<rect x="320" y="190" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="224" class="band" text-anchor="start">1  ·  THE WEEK AS IT IS BUILT   ·   MONDAY</text>
<text x="2004" y="224" class="bandhi" text-anchor="end">ADMITTING TIME PROTECTED</text>
<rect x="320" y="504" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="538" class="band" text-anchor="start">2  ·  A DAY INSIDE THAT WEEK   ·   TUESDAY</text>
<text x="2004" y="538" class="bandhi" text-anchor="end">THE DAY IS ANCHORED AT NINE</text>
<rect x="320" y="818" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="852" class="band" text-anchor="start">3  ·  WHEN A VISIT FALLS THROUGH   ·   WEDNESDAY</text>
<text x="2004" y="852" class="bandhi" text-anchor="end">THE GAP IS OFFERED BACK IN MINUTES</text>
<rect x="320" y="1132" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="1166" class="band" text-anchor="start">4  ·  WHAT THE WEEK PAID   ·   FRIDAY</text>
<text x="2004" y="1166" class="bandhi" text-anchor="end">THE WEEK LANDS WHERE IT SHOULD</text>
<rect x="350" y="248" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="475.0" y="289.5" class="bt" style="fill:#fff" text-anchor="middle">Week proposed</text>
<text x="475.0" y="308.5" class="bt" style="fill:#fff" text-anchor="middle">with her caseload</text>
<text x="356" y="364" class="sub">·  routine work offered to assistants</text>
<text x="356" y="381" class="sub">·  only where they have room</text>
<text x="356" y="398" class="sub">·  she reviews and adjusts</text>
<rect x="628" y="248" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="753.0" y="289.5" class="bt" style="fill:#fff" text-anchor="middle">She still plots</text>
<text x="753.0" y="308.5" class="bt" style="fill:#fff" text-anchor="middle">her own week</text>
<text x="634" y="364" class="sub">·  the tool recommends, she accepts</text>
<text x="634" y="381" class="sub">·  nothing is assigned to her</text>
<text x="634" y="398" class="sub">·  grouped by real drive time</text>
<line x1="600" y1="293.0" x2="622" y2="293.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="248" width="250" height="90" rx="6" fill="#795933"/>
<text x="1031.0" y="289.5" class="bt" style="fill:#fff" text-anchor="middle">Seven routine visits</text>
<text x="1031.0" y="308.5" class="bt" style="fill:#fff" text-anchor="middle">move to an assistant</text>
<text x="912" y="364" class="sub">·  who had the capacity</text>
<text x="912" y="381" class="sub">·  and the right qualification</text>
<text x="912" y="398" class="sub">·  visible for the first time</text>
<line x1="878" y1="293.0" x2="900" y2="293.0" class="ln" marker-end="url(#ar)"/>
<rect x="1184" y="248" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="1309.0" y="289.5" class="bt" style="fill:#fff" text-anchor="middle">Four admissions</text>
<text x="1309.0" y="308.5" class="bt" style="fill:#fff" text-anchor="middle">now fit</text>
<text x="1190" y="364" class="sub">·  two more than before</text>
<text x="1190" y="381" class="sub">·  the Wednesday referral is accepted</text>
<text x="1190" y="398" class="sub">·  no one was hired</text>
<line x1="1156" y1="293.0" x2="1178" y2="293.0" class="ln" marker-end="url(#ar)"/>
<rect x="1520" y="248" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="284.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="301.0" class="ct" text-anchor="middle" fill="#1B211E">Two more admissions from the</text>
<text x="1740.0" y="318.0" class="ct" text-anchor="middle" fill="#1B211E">same nurse and the same week.</text>
<text x="1740.0" y="278" class="ct" text-anchor="middle" style="fill:#1E7A46;font-weight:700">ADMITTING CAPACITY RELEASED</text>
<rect x="350" y="562" width="250" height="90" rx="6" fill="#795CA7"/>
<text x="475.0" y="603.5" class="bt" style="fill:#fff" text-anchor="middle">Confirmation handled</text>
<text x="475.0" y="622.5" class="bt" style="fill:#fff" text-anchor="middle">the evening before</text>
<text x="356" y="678" class="sub">·  not by her, and not unpaid</text>
<text x="356" y="695" class="sub">·  a nine o'clock start negotiated</text>
<text x="356" y="712" class="sub">·  the patient agreed to it</text>
<rect x="628" y="562" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="753.0" y="603.5" class="bt" style="fill:#fff" text-anchor="middle">First visit at nine</text>
<text x="753.0" y="622.5" class="bt" style="fill:#fff" text-anchor="middle">anchors the day</text>
<text x="634" y="678" class="sub">·  every visit after it holds</text>
<text x="634" y="695" class="sub">·  no slide, no late finish</text>
<text x="634" y="712" class="sub">·  the single largest lever she has</text>
<line x1="600" y1="607.0" x2="622" y2="607.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="562" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="1031.0" y="603.5" class="bt" style="fill:#fff" text-anchor="middle">Route follows</text>
<text x="1031.0" y="622.5" class="bt" style="fill:#fff" text-anchor="middle">drive time</text>
<text x="912" y="678" class="sub">·  not distance on a map</text>
<text x="912" y="695" class="sub">·  one crossing instead of two</text>
<text x="912" y="712" class="sub">·  forty minutes back in the day</text>
<line x1="878" y1="607.0" x2="900" y2="607.0" class="ln" marker-end="url(#ar)"/>
<rect x="1184" y="562" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="1309.0" y="603.5" class="bt" style="fill:#fff" text-anchor="middle">Documentation</text>
<text x="1309.0" y="622.5" class="bt" style="fill:#fff" text-anchor="middle">inside the day</text>
<text x="1190" y="678" class="sub">·  the evening is her own</text>
<text x="1190" y="695" class="sub">·  no confirmation calls to make</text>
<text x="1190" y="712" class="sub">·  roughly two hours returned</text>
<line x1="1156" y1="607.0" x2="1178" y2="607.0" class="ln" marker-end="url(#ar)"/>
<rect x="1520" y="562" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="598.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="615.0" class="ct" text-anchor="middle" fill="#1B211E">About two hours a day, and the</text>
<text x="1740.0" y="632.0" class="ct" text-anchor="middle" fill="#1B211E">evening back.</text>
<text x="1740.0" y="592" class="ct" text-anchor="middle" style="fill:#1E7A46;font-weight:700">TIME RETURNED</text>
<rect x="350" y="876" width="250" height="90" rx="6" fill="#4E8A5B"/>
<text x="475.0" y="917.5" class="bt" style="fill:#fff" text-anchor="middle">Patient cancels</text>
<text x="475.0" y="936.5" class="bt" style="fill:#fff" text-anchor="middle">the evening before</text>
<text x="356" y="992" class="sub">·  rescheduled on the call</text>
<text x="356" y="1009" class="sub">·  unchanged from today</text>
<text x="356" y="1026" class="sub">·  the gap is now visible</text>
<rect x="628" y="876" width="250" height="90" rx="6" fill="#795CA7"/>
<text x="753.0" y="917.5" class="bt" style="fill:#fff" text-anchor="middle">Options ranked</text>
<text x="753.0" y="936.5" class="bt" style="fill:#fff" text-anchor="middle">immediately</text>
<text x="634" y="992" class="sub">·  approval and discipline checked</text>
<text x="634" y="1009" class="sub">·  drive time from where she is</text>
<text x="634" y="1026" class="sub">·  flexible visits identified</text>
<line x1="600" y1="921.0" x2="622" y2="921.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="876" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="1031.0" y="917.5" class="bt" style="fill:#fff" text-anchor="middle">Three offers</text>
<text x="1031.0" y="936.5" class="bt" style="fill:#fff" text-anchor="middle">on her phone</text>
<text x="912" y="992" class="sub">·  she chooses, or declines all</text>
<text x="912" y="1009" class="sub">·  accepted in eight minutes</text>
<text x="912" y="1026" class="sub">·  including one moved forward</text>
<line x1="878" y1="921.0" x2="900" y2="921.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="1309.0" cy="921" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1309.0" y="926.0" class="bt s" style="fill:#1B211E" text-anchor="middle">The gap is filled</text>
<line x1="1156.0" y1="921" x2="1178.0" y2="921" class="ln" marker-end="url(#ar)"/>
<text x="1190.0" y="992" class="sub">·  the week stays whole</text>
<text x="1190.0" y="1009" class="sub">·  the patient is seen sooner</text>
<text x="1190.0" y="1026" class="sub">·  the later gap has days to fill</text>
<rect x="1520" y="876" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="912.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="929.0" class="ct" text-anchor="middle" fill="#1B211E">The week holds, and so does</text>
<text x="1740.0" y="946.0" class="ct" text-anchor="middle" fill="#1B211E">her paycheck.</text>
<text x="1740.0" y="906" class="ct" text-anchor="middle" style="fill:#1E7A46;font-weight:700">INCOME PROTECTED</text>
<rect x="350" y="1190" width="250" height="90" rx="6" fill="#795CA7"/>
<text x="475.0" y="1231.5" class="bt" style="fill:#fff" text-anchor="middle">Points land on</text>
<text x="475.0" y="1250.5" class="bt" style="fill:#fff" text-anchor="middle">target</text>
<text x="356" y="1306" class="sub">·  the work was there</text>
<text x="356" y="1323" class="sub">·  and it was reachable</text>
<text x="356" y="1340" class="sub">·  for the fourth week running</text>
<rect x="628" y="1190" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="753.0" y="1231.5" class="bt" style="fill:#fff" text-anchor="middle">Pay matches what</text>
<text x="753.0" y="1250.5" class="bt" style="fill:#fff" text-anchor="middle">she was quoted</text>
<text x="634" y="1306" class="sub">·  the number recruiting gave her</text>
<text x="634" y="1323" class="sub">·  is the number she earns</text>
<text x="634" y="1340" class="sub">·  at ninety days and at a year</text>
<line x1="600" y1="1235.0" x2="622" y2="1235.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="1190" width="250" height="90" rx="6" fill="#1A1A1A"/>
<text x="1031.0" y="1231.5" class="bt" style="fill:#fff" text-anchor="middle">Leadership sees</text>
<text x="1031.0" y="1250.5" class="bt" style="fill:#fff" text-anchor="middle">the trend, not the total</text>
<text x="912" y="1306" class="sub">·  a dip is visible in week one</text>
<text x="912" y="1323" class="sub">·  read as a signal, not a score</text>
<text x="912" y="1340" class="sub">·  a conversation, not a review</text>
<line x1="878" y1="1235.0" x2="900" y2="1235.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="1309.0" cy="1235" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1309.0" y="1240.0" class="bt s" style="fill:#1B211E" text-anchor="middle">She stays</text>
<line x1="1156.0" y1="1235" x2="1178.0" y2="1235" class="ln" marker-end="url(#ar)"/>
<text x="1190.0" y="1306" class="sub">·  the reason she leaves is removed</text>
<text x="1190.0" y="1323" class="sub">·  not persuaded, just paid</text>
<text x="1190.0" y="1340" class="sub">·  the caseload holds</text>
<rect x="1520" y="1190" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="1226.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="1243.0" class="ct" text-anchor="middle" fill="#1B211E">The signals reached someone</text>
<text x="1740.0" y="1260.0" class="ct" text-anchor="middle" fill="#1B211E">while it still mattered.</text>
<text x="1740.0" y="1220" class="ct" text-anchor="middle" style="fill:#1E7A46;font-weight:700">A RESIGNATION AVOIDED</text>
<rect x="320" y="1455" width="1698" height="195" rx="10" fill="none" stroke="#C9CCC5" stroke-width="1.8" stroke-dasharray="8 6"/>
<text x="346" y="1491" class="pnl" text-anchor="start">WHAT CHANGED</text>
<line x1="336" y1="1509" x2="336" y2="1525" stroke="#1E7A46" stroke-width="3"/>
<text x="336" y="1547" class="colh" text-anchor="start">1  ADMITTING TIME</text>
<text x="336" y="1577" class="sub">·  moved to assistants with room,</text>
<text x="336" y="1594" class="sub">·  two more admissions fit</text>
<line x1="756" y1="1509" x2="756" y2="1525" stroke="#1E7A46" stroke-width="3"/>
<text x="756" y="1547" class="colh" text-anchor="start">2  THE SHAPE OF THE DAY</text>
<text x="756" y="1577" class="sub">·  anchored at nine, routed by</text>
<text x="756" y="1594" class="sub">·  drive time, evening returned</text>
<line x1="1176" y1="1509" x2="1176" y2="1525" stroke="#1E7A46" stroke-width="3"/>
<text x="1176" y="1547" class="colh" text-anchor="start">3  THE CANCELLED VISIT</text>
<text x="1176" y="1577" class="sub">·  offered back in minutes,</text>
<text x="1176" y="1594" class="sub">·  she still chooses</text>
<line x1="1596" y1="1509" x2="1596" y2="1525" stroke="#1E7A46" stroke-width="3"/>
<text x="1596" y="1547" class="colh" text-anchor="start">4  WHAT IT PAID</text>
<text x="1596" y="1577" class="sub">·  on target, and the trend is</text>
<text x="1596" y="1594" class="sub">·  visible while it matters</text>
<rect x="2060" y="1475" width="470" height="112" rx="8" fill="none" stroke="#C9CCC5" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="2080" y="1503" class="colh" text-anchor="start">LEVERS ON THIS SHEET</text>
<text x="2080" y="1527" class="sub" style="fill:#1E7A46;font-weight:700">L2</text>
<text x="2118" y="1527" class="sub">Assessment Capacity Release</text>
<text x="2080" y="1546" class="sub" style="fill:#1E7A46;font-weight:700">L3</text>
<text x="2118" y="1546" class="sub">Same-Day Schedule Recovery</text>
<text x="2080" y="1565" class="sub" style="fill:#1E7A46;font-weight:700">L8</text>
<text x="2118" y="1565" class="sub">Clinician Retention</text>
<text x="2080" y="1584" class="sub" style="fill:#1E7A46;font-weight:700">L9</text>
<text x="2118" y="1584" class="sub">Travel and Territory Efficiency</text>
<line x1="50" y1="1808" x2="2550" y2="1808" stroke="#C9CCC5" stroke-width="1.4"/>
<text x="50" y="1840" class="foot" text-anchor="start">TARGET STATE  ·  A PROPOSAL.  Eighteen months after implementation.  Drawn against the same week and the same decisions people make.</text>
<text x="2550" y="1840" class="foot" text-anchor="end">Compassus Home Health  ·  One clinician's week</text>
</svg>
</figure>
