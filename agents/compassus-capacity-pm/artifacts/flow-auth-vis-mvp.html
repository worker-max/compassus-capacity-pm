<text x="378" y="869" class="pnlA" text-anchor="start">NO AUTH  —  the visit is pending, and visible</text>
<text x="378" y="892" class="note" text-anchor="start">It sits on the clinician's calendar marked pending, it counts as committed load, and the remaining balance is on screen. Nothing lives on a sticky note.</text>

<text x="368" y="938" class="hi" text-anchor="start">Every physician order, recertification and resumption of care re-enters this loop — and each one is a new auth question</text>
<rect x="350" y="996" width="1660" height="190" rx="10" fill="none" stroke="#C9CCC5" stroke-width="1.8" stroke-dasharray="8 6"/>
<text x="376" y="1032" class="pnl" text-anchor="start">WHAT THE PAYER HAS ALREADY DECIDED — before anyone writes a plan of care</text>
<line x1="376" y1="1050" x2="376" y2="1168" stroke="#1B211E" stroke-width="3"/>
<text x="394" y="1070" class="colh" text-anchor="start">THE CAP IS SET UPSTREAM</text>
<text x="394" y="1094" class="sub">·  Every payer, plan and state sets its own — there is no single rule to learn</text>
<text x="394" y="1111" class="sub">·  Indiana Medicaid — 8 visits shared across PT / OT / ST</text>
<text x="394" y="1128" class="sub">·  Indiana Medicaid — 30 days from the discharge date, not the admit date</text>
<text x="394" y="1145" class="sub">·  Ohio Medicaid — caps similarly; commercial and MA plans differ again</text>
<line x1="1230" y1="1050" x2="1230" y2="1168" stroke="#DF751D" stroke-width="3"/>
<text x="1248" y="1070" class="colhA" text-anchor="start">TWO CEILINGS, NOT ONE</text>
<text x="1248" y="1094" class="sub">·  Auth is permission — how many visits the payer will allow</text>
<text x="1248" y="1111" class="sub">·  PDGM is payment — the economic band for the period</text>
<text x="1248" y="1128" class="sub">·  LUPA is the floor; utilisation management is the ceiling</text>
<text x="1248" y="1145" class="sub">·  A visit can be authorised and still be uneconomic</text>
<text x="350" y="1222" class="hi" text-anchor="start">The data already exists. The auth team writes the payer's rules into a coordination note at verification — days before anyone writes the plan of care.</text>
<text x="350" y="1244" class="note" text-anchor="start">Surfacing those rules at plan-of-care creation is the highest-value, lowest-complexity win in this flow — and a patient-care win, because abrupt discharges happen when nobody planned for the real visit budget.</text>
<text x="50" y="1298" class="trg" text-anchor="start">BOUNDARIES</text>

<text x="562.2" y="1302.0" class="ct" text-anchor="middle" fill="#5A6560">Auth is drawn only where it meets scheduling</text>

<text x="1425.2" y="1302.0" class="ct" text-anchor="middle" fill="#5A6560">Auth governs permission · PDGM governs payment</text>
<text x="50" y="1384" class="trg" text-anchor="start">WHERE IT</text>

<text x="560.0" y="1406.0" class="bt s" style="fill:#5A6560" text-anchor="middle" opacity=".85">not on a calendar, not counted</text>

<text x="560.0" y="1446" class="trg" text-anchor="middle">ADDRESSED ABOVE</text>

<text x="1000.0" y="1405.75" class="bt s" style="fill:#fff" text-anchor="middle">so schedulers bulk-clear without reading</text>

<text x="1143.2" y="1360" class="bdg" text-anchor="middle" fill="#5F8A12">STILL A STEP</text>

<rect x="1670" y="1358" width="420" height="70" rx="5" fill="#FBFBF8" stroke="#5A6560" stroke-width="1.7" stroke-dasharray="7 5" opacity=".8"/>
<text x="1880.0" y="1390.0" class="bt s" style="fill:#5A6560" text-anchor="middle" opacity=".85">Abrupt discharge when the</text>

<text x="1880.0" y="1406.0" class="bt s" style="fill:#5A6560" text-anchor="middle" opacity=".85">visit budget quietly runs out</text>
<line x1="1778.5" y1="1401.0" x2="1981.5" y2="1401.0" stroke="#5A6560" stroke-width="1.2" opacity=".8"/>
