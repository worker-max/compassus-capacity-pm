<figure>
<svg viewBox="0 0 2600 1880" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="One branch's week. A branch running at capacity. The queue, the call-out, the referral it had to turn down, and what the week added up to.">
<defs><marker id="ar" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.5" orient="auto-start-reverse"><polygon points="0,0 10,4 0,8" fill="#1B211E"/></marker></defs>
<rect x="0" y="0" width="2600" height="1880" fill="#FBFBF8"/>
<text x="50" y="58" class="eyebrow" text-anchor="start">COMPASSUS HOME HEALTH  ·  CURRENT STATE</text>
<text x="50" y="100" class="title" text-anchor="start">One branch's week</text>
<text x="50" y="128" class="deck" text-anchor="start">A branch running at capacity. The queue, the call-out, the referral it had to turn down, and what the week added up to.</text>
<line x1="50" y1="150" x2="2550" y2="150" stroke="#C9CCC5" stroke-width="1.4"/>
<circle cx="1433" cy="72" r="13" fill="#1F6F78"/>
<text x="1454" y="78" class="leg" text-anchor="start">Intake</text>
<circle cx="1553.4" cy="72" r="13" fill="#DF751D"/>
<text x="1574.4" y="78" class="leg" text-anchor="start">Insurance &amp; Auth</text>
<circle cx="1757.8000000000002" cy="72" r="13" fill="#C6A01F"/>
<text x="1778.8000000000002" y="78" class="leg" text-anchor="start">PCC / Scheduler</text>
<circle cx="1953.8000000000002" cy="72" r="13" fill="#2E599D"/>
<text x="1974.8000000000002" y="78" class="leg" text-anchor="start">Clinician</text>
<circle cx="2099.4" cy="72" r="13" fill="#792E2E"/>
<text x="2120.4" y="78" class="leg" text-anchor="start">DCS</text>
<circle cx="1433" cy="106" r="13" fill="#795CA7"/>
<text x="1454" y="112" class="leg" text-anchor="start">HCHB</text>
<circle cx="1536.6" cy="106" r="13" fill="#795933"/>
<text x="1557.6" y="112" class="leg" text-anchor="start">Per Diem / Float</text>
<circle cx="1741.0" cy="106" r="13" fill="#4E8A5B"/>
<text x="1762.0" y="112" class="leg" text-anchor="start">Patient</text>
<circle cx="1869.8" cy="106" r="13" fill="#1A1A1A"/>
<text x="1890.8" y="112" class="leg" text-anchor="start">Branch leadership</text>
<text x="36" y="224" class="trg" text-anchor="start">TRIGGER</text>
<rect x="36" y="248" width="264" height="90" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="168.0" y="289.5" class="ct" text-anchor="middle" fill="#1B211E">Monday, 7am</text>
<text x="168.0" y="306.5" class="ct" text-anchor="middle" fill="#1B211E">the queue as it stands</text>
<line x1="306" y1="293" x2="344" y2="293" class="ln" marker-end="url(#ar)"/>
<rect x="320" y="190" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="224" class="band" text-anchor="start">1  ·  THE QUEUE   ·   MONDAY MORNING</text>
<text x="2004" y="224" class="bandhi" text-anchor="end">MOST OF THE DAY IS NOT A DECISION</text>
<rect x="320" y="504" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="538" class="band" text-anchor="start">2  ·  THE CALL-OUT   ·   WEDNESDAY, 7AM</text>
<text x="2004" y="538" class="bandhi" text-anchor="end">THE MOST EXPENSIVE OPTION IS THE FASTEST</text>
<rect x="320" y="818" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="852" class="band" text-anchor="start">3  ·  A REFERRAL ARRIVES   ·   THURSDAY</text>
<text x="2004" y="852" class="bandhi" text-anchor="end">TURNED DOWN WITH CAPACITY IN THE BUILDING</text>
<rect x="320" y="1132" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="1166" class="band" text-anchor="start">4  ·  THE WEEK IN REVIEW   ·   FRIDAY</text>
<text x="2004" y="1166" class="bandhi" text-anchor="end">NONE OF THIS APPEARS AS A NUMBER</text>
<rect x="350" y="248" width="250" height="90" rx="6" fill="#795CA7"/>
<text x="475.0" y="289.5" class="bt" style="fill:#fff" text-anchor="middle">The queue rebuilds</text>
<text x="475.0" y="308.5" class="bt" style="fill:#fff" text-anchor="middle">overnight</text>
<text x="356" y="364" class="sub">·  a task for every discipline</text>
<text x="356" y="381" class="sub">·  and again at approval</text>
<text x="356" y="398" class="sub">·  plus one per patient awaiting approval</text>
<rect x="628" y="248" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="753.0" y="289.5" class="bt" style="fill:#fff" text-anchor="middle">The scheduler opens</text>
<text x="753.0" y="308.5" class="bt" style="fill:#fff" text-anchor="middle">them one at a time</text>
<text x="634" y="364" class="sub">·  most need no action at all</text>
<text x="634" y="381" class="sub">·  but each must be opened to know</text>
<text x="634" y="398" class="sub">·  the day is spent finding out</text>
<line x1="600" y1="293.0" x2="622" y2="293.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="248" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="1031.0" y="289.5" class="bt" style="fill:#fff" text-anchor="middle">Bulk clearing</text>
<text x="1031.0" y="308.5" class="bt" style="fill:#fff" text-anchor="middle">becomes the habit</text>
<text x="912" y="364" class="sub">·  a rational response to the volume</text>
<text x="912" y="381" class="sub">·  the one that mattered goes with it</text>
<text x="912" y="398" class="sub">·  nobody can tell which</text>
<line x1="878" y1="293.0" x2="900" y2="293.0" class="ln" marker-end="url(#ar)"/>
<rect x="1184" y="248" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="1309.0" y="289.5" class="bt" style="fill:#fff" text-anchor="middle">Real decisions get</text>
<text x="1309.0" y="308.5" class="bt" style="fill:#fff" text-anchor="middle">the time that is left</text>
<text x="1190" y="364" class="sub">·  the welcome call is one of them</text>
<text x="1190" y="381" class="sub">·  it slips to the afternoon</text>
<text x="1190" y="398" class="sub">·  or to tomorrow</text>
<line x1="1156" y1="293.0" x2="1178" y2="293.0" class="ln" marker-end="url(#ar)"/>
<rect x="1520" y="248" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="284.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="301.0" class="ct" text-anchor="middle" fill="#1B211E">The judgment work is squeezed</text>
<text x="1740.0" y="318.0" class="ct" text-anchor="middle" fill="#1B211E">into what the queue leaves over.</text>
<text x="1740.0" y="278" class="ct" text-anchor="middle" style="fill:#B03A2E;font-weight:700">ADMINISTRATION, NOT SCHEDULING</text>
<rect x="350" y="562" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="475.0" y="603.5" class="bt" style="fill:#fff" text-anchor="middle">A clinician calls</text>
<text x="475.0" y="622.5" class="bt" style="fill:#fff" text-anchor="middle">out at seven</text>
<text x="356" y="678" class="sub">·  six visits on her day</text>
<text x="356" y="695" class="sub">·  two are time-sensitive</text>
<text x="356" y="712" class="sub">·  four could move if someone knew</text>
<rect x="628" y="562" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="753.0" y="603.5" class="bt" style="fill:#fff" text-anchor="middle">Nobody can see</text>
<text x="753.0" y="622.5" class="bt" style="fill:#fff" text-anchor="middle">who has room</text>
<text x="634" y="678" class="sub">·  capacity lives in a spreadsheet</text>
<text x="634" y="695" class="sub">·  updated when someone remembers</text>
<text x="634" y="712" class="sub">·  and not this morning</text>
<line x1="600" y1="607.0" x2="622" y2="607.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="562" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="1031.0" y="603.5" class="bt" style="fill:#fff" text-anchor="middle">The branch calls</text>
<text x="1031.0" y="622.5" class="bt" style="fill:#fff" text-anchor="middle">around</text>
<text x="912" y="678" class="sub">·  per diem first, then contract</text>
<text x="912" y="695" class="sub">·  then incentive pay for extra work</text>
<text x="912" y="712" class="sub">·  whoever answers first</text>
<line x1="878" y1="607.0" x2="900" y2="607.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="1309.0" cy="607" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1309.0" y="612.0" class="bt s" style="fill:#1B211E" text-anchor="middle">Covered, at a premium</text>
<line x1="1156.0" y1="607" x2="1178.0" y2="607" class="ln" marker-end="url(#ar)"/>
<text x="1190.0" y="678" class="sub">·  two visits covered this way</text>
<text x="1190.0" y="695" class="sub">·  two moved, two simply missed</text>
<text x="1190.0" y="712" class="sub">·  the cost lands in the month</text>
<rect x="1520" y="562" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="598.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="615.0" class="ct" text-anchor="middle" fill="#1B211E">Not because coverage was scarce.</text>
<text x="1740.0" y="632.0" class="ct" text-anchor="middle" fill="#1B211E">Because it could not be seen.</text>
<text x="1740.0" y="592" class="ct" text-anchor="middle" style="fill:#B03A2E;font-weight:700">PREMIUM SPEND, BOUGHT IN A HURRY</text>
<rect x="350" y="876" width="250" height="90" rx="6" fill="#1F6F78"/>
<text x="475.0" y="917.5" class="bt" style="fill:#fff" text-anchor="middle">Referral offered</text>
<text x="475.0" y="936.5" class="bt" style="fill:#fff" text-anchor="middle">by the hospital</text>
<text x="356" y="992" class="sub">·  a good fit for the branch</text>
<text x="356" y="1009" class="sub">·  the kind we want</text>
<text x="356" y="1026" class="sub">·  an answer needed today</text>
<rect x="628" y="876" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="753.0" y="917.5" class="bt" style="fill:#fff" text-anchor="middle">Both admitting nurses</text>
<text x="753.0" y="936.5" class="bt" style="fill:#fff" text-anchor="middle">look full</text>
<text x="634" y="992" class="sub">·  their weeks are full of routine visits</text>
<text x="634" y="1009" class="sub">·  an assistant could take many</text>
<text x="634" y="1026" class="sub">·  no view of the assistant's week</text>
<line x1="600" y1="921.0" x2="622" y2="921.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="876" width="250" height="90" rx="6" fill="#1A1A1A"/>
<text x="1031.0" y="927.0" class="bt" style="fill:#fff" text-anchor="middle">The branch declines</text>
<text x="912" y="992" class="sub">·  a defensible call on what is visible</text>
<text x="912" y="1009" class="sub">·  the wrong call on what is true</text>
<text x="912" y="1026" class="sub">·  the source notices</text>
<line x1="878" y1="921.0" x2="900" y2="921.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="1309.0" cy="921" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1309.0" y="926.0" class="bt s" style="fill:#1B211E" text-anchor="middle">Capacity existed</text>
<line x1="1156.0" y1="921" x2="1178.0" y2="921" class="ln" marker-end="url(#ar)"/>
<text x="1190.0" y="992" class="sub">·  it was in the wrong hands</text>
<text x="1190.0" y="1009" class="sub">·  and nobody could see it</text>
<text x="1190.0" y="1026" class="sub">·  the referral goes elsewhere</text>
<rect x="1520" y="876" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="912.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="929.0" class="ct" text-anchor="middle" fill="#1B211E">Declined for want of capacity</text>
<text x="1740.0" y="946.0" class="ct" text-anchor="middle" fill="#1B211E">the branch actually had.</text>
<text x="1740.0" y="906" class="ct" text-anchor="middle" style="fill:#B03A2E;font-weight:700">AN ADMISSION LOST</text>
<rect x="350" y="1190" width="250" height="90" rx="6" fill="#1A1A1A"/>
<text x="475.0" y="1231.5" class="bt" style="fill:#fff" text-anchor="middle">The branch reviews</text>
<text x="475.0" y="1250.5" class="bt" style="fill:#fff" text-anchor="middle">the week</text>
<text x="356" y="1306" class="sub">·  visits delivered, points, census</text>
<text x="356" y="1323" class="sub">·  all of it accurate</text>
<text x="356" y="1340" class="sub">·  none of it showing what was lost</text>
<rect x="628" y="1190" width="250" height="90" rx="6" fill="#795CA7"/>
<text x="753.0" y="1231.5" class="bt" style="fill:#fff" text-anchor="middle">Premium spend</text>
<text x="753.0" y="1250.5" class="bt" style="fill:#fff" text-anchor="middle">posts to the month</text>
<text x="634" y="1306" class="sub">·  without the reason attached</text>
<text x="634" y="1323" class="sub">·  read as a staffing problem</text>
<text x="634" y="1340" class="sub">·  not a visibility problem</text>
<line x1="600" y1="1235.0" x2="622" y2="1235.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="1190" width="250" height="90" rx="6" fill="#1A1A1A"/>
<text x="1031.0" y="1231.5" class="bt" style="fill:#fff" text-anchor="middle">The declined referral</text>
<text x="1031.0" y="1250.5" class="bt" style="fill:#fff" text-anchor="middle">is not recorded</text>
<text x="912" y="1306" class="sub">·  no reason code exists for it</text>
<text x="912" y="1323" class="sub">·  so it never happened</text>
<text x="912" y="1340" class="sub">·  and cannot be counted</text>
<line x1="878" y1="1235.0" x2="900" y2="1235.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="1309.0" cy="1235" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1309.0" y="1240.0" class="bt s" style="fill:#1B211E" text-anchor="middle">The week looks fine</text>
<line x1="1156.0" y1="1235" x2="1178.0" y2="1235" class="ln" marker-end="url(#ar)"/>
<text x="1190.0" y="1306" class="sub">·  every number is defensible</text>
<text x="1190.0" y="1323" class="sub">·  the losses are all invisible</text>
<text x="1190.0" y="1340" class="sub">·  so nothing changes next week</text>
<rect x="1520" y="1190" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="1226.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="1243.0" class="ct" text-anchor="middle" fill="#1B211E">What cannot be counted cannot</text>
<text x="1740.0" y="1260.0" class="ct" text-anchor="middle" fill="#1B211E">be managed, or improved.</text>
<text x="1740.0" y="1220" class="ct" text-anchor="middle" style="fill:#B03A2E;font-weight:700">INVISIBLE, THEREFORE PERMANENT</text>
<rect x="320" y="1455" width="1698" height="195" rx="10" fill="none" stroke="#C9CCC5" stroke-width="1.8" stroke-dasharray="8 6"/>
<text x="346" y="1491" class="pnl" text-anchor="start">WHAT THE WEEK COST THE BRANCH</text>
<line x1="336" y1="1509" x2="336" y2="1525" stroke="#B03A2E" stroke-width="3"/>
<text x="336" y="1547" class="colh" text-anchor="start">1  THE QUEUE</text>
<text x="336" y="1577" class="sub">·  a day spent opening items</text>
<text x="336" y="1594" class="sub">·  that needed no action</text>
<line x1="756" y1="1509" x2="756" y2="1525" stroke="#B03A2E" stroke-width="3"/>
<text x="756" y="1547" class="colh" text-anchor="start">2  THE CALL-OUT</text>
<text x="756" y="1577" class="sub">·  premium bought four times</text>
<text x="756" y="1594" class="sub">·  because nothing was visible</text>
<line x1="1176" y1="1509" x2="1176" y2="1525" stroke="#B03A2E" stroke-width="3"/>
<text x="1176" y="1547" class="colh" text-anchor="start">3  THE REFERRAL</text>
<text x="1176" y="1577" class="sub">·  declined for want of capacity</text>
<text x="1176" y="1594" class="sub">·  the branch actually had</text>
<line x1="1596" y1="1509" x2="1596" y2="1525" stroke="#B03A2E" stroke-width="3"/>
<text x="1596" y="1547" class="colh" text-anchor="start">4  THE REVIEW</text>
<text x="1596" y="1577" class="sub">·  every loss invisible, so</text>
<text x="1596" y="1594" class="sub">·  nothing changes next week</text>
<rect x="2060" y="1475" width="470" height="112" rx="8" fill="none" stroke="#C9CCC5" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="2080" y="1503" class="colh" text-anchor="start">LEVERS ON THIS SHEET</text>
<text x="2080" y="1527" class="sub" style="fill:#B03A2E;font-weight:700">L1</text>
<text x="2118" y="1527" class="sub">Admission Throughput</text>
<text x="2080" y="1546" class="sub" style="fill:#B03A2E;font-weight:700">L2</text>
<text x="2118" y="1546" class="sub">Assessment Capacity Release</text>
<text x="2080" y="1565" class="sub" style="fill:#B03A2E;font-weight:700">L6</text>
<text x="2118" y="1565" class="sub">Scheduling Administration Cost</text>
<text x="2080" y="1584" class="sub" style="fill:#B03A2E;font-weight:700">L7</text>
<text x="2118" y="1584" class="sub">Premium Labor Avoidance</text>
<line x1="50" y1="1808" x2="2550" y2="1808" stroke="#C9CCC5" stroke-width="1.4"/>
<text x="50" y="1840" class="foot" text-anchor="start">Current state, August 2026.  A representative composite of documented branch patterns, not a single named case.  Nothing on this sheet is a proposal.</text>
<text x="2550" y="1840" class="foot" text-anchor="end">Compassus Home Health  ·  One branch's week</text>
</svg>
</figure>
