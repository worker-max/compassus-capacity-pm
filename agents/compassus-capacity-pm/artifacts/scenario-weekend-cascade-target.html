<figure>
<svg viewBox="0 0 2600 1880" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="The weekend cascade. The same three referrals, the same patient decisions, and a different Monday.">
<defs><marker id="ar" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6.5" orient="auto-start-reverse"><polygon points="0,0 10,4 0,8" fill="#1B211E"/></marker></defs>
<rect x="0" y="0" width="2600" height="1880" fill="#FBFBF8"/>
<text x="50" y="58" class="eyebrow" text-anchor="start">COMPASSUS HOME HEALTH  ·  TARGET STATE, EIGHTEEN MONTHS ON</text>
<text x="50" y="100" class="title" text-anchor="start">The weekend cascade  —  the same week, after</text>
<text x="50" y="128" class="deck" text-anchor="start">The same three referrals, the same patient decisions, and a different Monday.</text>
<line x1="50" y1="150" x2="2550" y2="150" stroke="#C9CCC5" stroke-width="1.4"/>
<circle cx="1433" cy="72" r="13" fill="#1F6F78"/>
<text x="1454" y="78" class="leg" text-anchor="start">Intake</text>
<circle cx="1553.4" cy="72" r="13" fill="#DF751D"/>
<text x="1574.4" y="78" class="leg" text-anchor="start">Insurance &amp; Auth</text>
<circle cx="1757.8000000000002" cy="72" r="13" fill="#C6A01F"/>
<text x="1778.8000000000002" y="78" class="leg" text-anchor="start">PCC / Scheduler</text>
<circle cx="1953.8000000000002" cy="72" r="13" fill="#2E599D"/>
<text x="1974.8000000000002" y="78" class="leg" text-anchor="start">Clinician</text>
<circle cx="2099.4" cy="72" r="13" fill="#792E2E"/>
<text x="2120.4" y="78" class="leg" text-anchor="start">DCS</text>
<circle cx="1433" cy="106" r="13" fill="#795CA7"/>
<text x="1454" y="112" class="leg" text-anchor="start">HCHB</text>
<circle cx="1536.6" cy="106" r="13" fill="#795933"/>
<text x="1557.6" y="112" class="leg" text-anchor="start">Per Diem / Float</text>
<circle cx="1741.0" cy="106" r="13" fill="#4E8A5B"/>
<text x="1762.0" y="112" class="leg" text-anchor="start">Patient</text>
<circle cx="1869.8" cy="106" r="13" fill="#1A1A1A"/>
<text x="1890.8" y="112" class="leg" text-anchor="start">Branch leadership</text>
<text x="36" y="224" class="trg" text-anchor="start">TRIGGER</text>
<rect x="36" y="248" width="264" height="90" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="168.0" y="289.5" class="ct" text-anchor="middle" fill="#1B211E">Friday, 4pm</text>
<text x="168.0" y="306.5" class="ct" text-anchor="middle" fill="#1B211E">three weekend starts</text>
<line x1="306" y1="293" x2="344" y2="293" class="ln" marker-end="url(#ar)"/>
<rect x="320" y="190" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="224" class="band" text-anchor="start">1  ·  FRIDAY   ·   THREE WEEKEND STARTS COMMITTED</text>
<text x="2004" y="224" class="bandhi" text-anchor="end">THE SAME THREE, WITH THE RISK NAMED</text>
<rect x="320" y="504" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="538" class="band" text-anchor="start">2  ·  SATURDAY</text>
<text x="2004" y="538" class="bandhi" text-anchor="end">TWO STARTS, FROM THE SAME TWO SLOTS</text>
<rect x="320" y="818" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="852" class="band" text-anchor="start">3  ·  SUNDAY</text>
<text x="2004" y="852" class="bandhi" text-anchor="end">THE DEFERRAL STILL HAPPENS. THE DAY DOES NOT.</text>
<rect x="320" y="1132" width="1698" height="290" rx="10" fill="#E9E9E5"/>
<text x="342" y="1166" class="band" text-anchor="start">4  ·  MONDAY, AND THE WEEK THAT FOLLOWS</text>
<text x="2004" y="1166" class="bandhi" text-anchor="end">NO CASCADE</text>
<rect x="350" y="248" width="250" height="90" rx="6" fill="#1F6F78"/>
<text x="475.0" y="289.5" class="bt" style="fill:#fff" text-anchor="middle">Three referrals</text>
<text x="475.0" y="308.5" class="bt" style="fill:#fff" text-anchor="middle">accepted</text>
<text x="356" y="364" class="sub">·  the same three referrals</text>
<text x="356" y="381" class="sub">·  the same expected discharges</text>
<text x="356" y="398" class="sub">·  nothing about Friday changes</text>
<rect x="628" y="248" width="250" height="90" rx="6" fill="#795CA7"/>
<text x="753.0" y="289.5" class="bt" style="fill:#fff" text-anchor="middle">Each start carries</text>
<text x="753.0" y="308.5" class="bt" style="fill:#fff" text-anchor="middle">a readiness state</text>
<text x="634" y="364" class="sub">·  confirmed, expected, or at risk</text>
<text x="634" y="381" class="sub">·  based on discharge patterns</text>
<text x="634" y="398" class="sub">·  and on what sales recorded</text>
<line x1="600" y1="293.0" x2="622" y2="293.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="248" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="1031.0" y="289.5" class="bt" style="fill:#fff" text-anchor="middle">Weekend cover</text>
<text x="1031.0" y="308.5" class="bt" style="fill:#fff" text-anchor="middle">arranged the same</text>
<text x="912" y="364" class="sub">·  one nurse Saturday, one Sunday</text>
<text x="912" y="381" class="sub">·  but the slots are now provisional</text>
<text x="912" y="398" class="sub">·  and a waiting list sits behind them</text>
<line x1="878" y1="293.0" x2="900" y2="293.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="1309.0" cy="293" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1309.0" y="298.0" class="bt s" style="fill:#1B211E" text-anchor="middle">A second call is queued behind each</text>
<line x1="1156.0" y1="293" x2="1178.0" y2="293" class="ln" marker-end="url(#ar)"/>
<text x="1190.0" y="364" class="sub">·  patients who could start early</text>
<text x="1190.0" y="381" class="sub">·  if a slot came free</text>
<text x="1190.0" y="398" class="sub">·  nobody had to build that list by hand</text>
<rect x="1520" y="248" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="284.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="301.0" class="ct" text-anchor="middle" fill="#1B211E">with something ready to take</text>
<text x="1740.0" y="318.0" class="ct" text-anchor="middle" fill="#1B211E">the place of any that fall.</text>
<text x="1740.0" y="278" class="ct" text-anchor="middle" style="fill:#1E7A46;font-weight:700">THE WEEK IS BUILT ON THREE,</text>
<rect x="350" y="562" width="250" height="90" rx="6" fill="#795CA7"/>
<text x="475.0" y="603.5" class="bt" style="fill:#fff" text-anchor="middle">Readiness checked</text>
<text x="475.0" y="622.5" class="bt" style="fill:#fff" text-anchor="middle">at seven</text>
<text x="356" y="678" class="sub">·  automated, before the day starts</text>
<text x="356" y="695" class="sub">·  the late discharge is already known</text>
<text x="356" y="712" class="sub">·  no one had to chase it</text>
<rect x="628" y="562" width="250" height="90" rx="6" fill="#4E8A5B"/>
<text x="753.0" y="603.5" class="bt" style="fill:#fff" text-anchor="middle">First patient</text>
<text x="753.0" y="622.5" class="bt" style="fill:#fff" text-anchor="middle">discharged late</text>
<text x="634" y="678" class="sub">·  exactly as before</text>
<text x="634" y="695" class="sub">·  the patient's situation is unchanged</text>
<text x="634" y="712" class="sub">·  only our knowledge of it changed</text>
<line x1="600" y1="607.0" x2="622" y2="607.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="562" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="1031.0" y="603.5" class="bt" style="fill:#fff" text-anchor="middle">The slot is offered</text>
<text x="1031.0" y="622.5" class="bt" style="fill:#fff" text-anchor="middle">on by eight</text>
<text x="912" y="678" class="sub">·  to the waiting patient behind it</text>
<text x="912" y="695" class="sub">·  who accepts for that morning</text>
<text x="912" y="712" class="sub">·  the nurse's day stays full</text>
<line x1="878" y1="607.0" x2="900" y2="607.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="1309.0" cy="607" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1309.0" y="612.0" class="bt s" style="fill:#1B211E" text-anchor="middle">Two starts delivered</text>
<line x1="1156.0" y1="607" x2="1178.0" y2="607" class="ln" marker-end="url(#ar)"/>
<text x="1190.0" y="678" class="sub">·  one planned, one recovered</text>
<text x="1190.0" y="695" class="sub">·  from a slot that would have expired</text>
<text x="1190.0" y="712" class="sub">·  the same nurse, the same shift</text>
<rect x="1520" y="562" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="598.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="615.0" class="ct" text-anchor="middle" fill="#1B211E">The late discharge cost nothing</text>
<text x="1740.0" y="632.0" class="ct" text-anchor="middle" fill="#1B211E">except a different patient's order.</text>
<text x="1740.0" y="592" class="ct" text-anchor="middle" style="fill:#1E7A46;font-weight:700">A FULL SATURDAY</text>
<rect x="350" y="876" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="475.0" y="917.5" class="bt" style="fill:#fff" text-anchor="middle">Welcome call made</text>
<text x="475.0" y="936.5" class="bt" style="fill:#fff" text-anchor="middle">at eight</text>
<text x="356" y="992" class="sub">·  standardised, and early</text>
<text x="356" y="1009" class="sub">·  not waiting on office capacity</text>
<text x="356" y="1026" class="sub">·  four hours earlier than before</text>
<rect x="628" y="876" width="250" height="90" rx="6" fill="#4E8A5B"/>
<text x="753.0" y="917.5" class="bt" style="fill:#fff" text-anchor="middle">The family still</text>
<text x="753.0" y="936.5" class="bt" style="fill:#fff" text-anchor="middle">defers to Monday</text>
<text x="634" y="992" class="sub">·  the same reasonable decision</text>
<text x="634" y="1009" class="sub">·  no system changes that</text>
<text x="634" y="1026" class="sub">·  but we know at eight, not at noon</text>
<line x1="600" y1="921.0" x2="622" y2="921.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="876" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="1031.0" y="917.5" class="bt" style="fill:#fff" text-anchor="middle">Both slots reassigned</text>
<text x="1031.0" y="936.5" class="bt" style="fill:#fff" text-anchor="middle">by ten</text>
<text x="912" y="992" class="sub">·  to patients ready today</text>
<text x="912" y="1009" class="sub">·  with the whole day still ahead</text>
<text x="912" y="1026" class="sub">·  the nurse works a full Sunday</text>
<line x1="878" y1="921.0" x2="900" y2="921.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="1309.0" cy="921" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1309.0" y="926.0" class="bt s" style="fill:#1B211E" text-anchor="middle">Two starts on Sunday</text>
<line x1="1156.0" y1="921" x2="1178.0" y2="921" class="ln" marker-end="url(#ar)"/>
<text x="1190.0" y="992" class="sub">·  not the ones planned on Friday</text>
<text x="1190.0" y="1009" class="sub">·  the slots were used, which is</text>
<text x="1190.0" y="1026" class="sub">·  what the week actually needed</text>
<rect x="1520" y="876" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="912.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="929.0" class="ct" text-anchor="middle" fill="#1B211E">The deferral was never the problem.</text>
<text x="1740.0" y="946.0" class="ct" text-anchor="middle" fill="#1B211E">Finding out too late was.</text>
<text x="1740.0" y="906" class="ct" text-anchor="middle" style="fill:#1E7A46;font-weight:700">A SUNDAY THAT HELD</text>
<rect x="350" y="1190" width="250" height="90" rx="6" fill="#C6A01F"/>
<text x="475.0" y="1231.5" class="bt" style="fill:#fff" text-anchor="middle">One admission</text>
<text x="475.0" y="1250.5" class="bt" style="fill:#fff" text-anchor="middle">lands on Monday</text>
<text x="356" y="1306" class="sub">·  the deferred patient, as agreed</text>
<text x="356" y="1323" class="sub">·  four already started</text>
<text x="356" y="1340" class="sub">·  Monday was planned for two</text>
<rect x="628" y="1190" width="250" height="90" rx="6" fill="#2E599D"/>
<text x="753.0" y="1231.5" class="bt" style="fill:#fff" text-anchor="middle">Routine visits</text>
<text x="753.0" y="1250.5" class="bt" style="fill:#fff" text-anchor="middle">run as planned</text>
<text x="634" y="1306" class="sub">·  nothing pushed into Tuesday</text>
<text x="634" y="1323" class="sub">·  nothing compressed</text>
<text x="634" y="1340" class="sub">·  no window put at risk</text>
<line x1="600" y1="1235.0" x2="622" y2="1235.0" class="ln" marker-end="url(#ar)"/>
<rect x="906" y="1190" width="250" height="90" rx="6" fill="#1A1A1A"/>
<text x="1031.0" y="1231.5" class="bt" style="fill:#fff" text-anchor="middle">Thursday's referral</text>
<text x="1031.0" y="1250.5" class="bt" style="fill:#fff" text-anchor="middle">is accepted</text>
<text x="912" y="1306" class="sub">·  the branch has genuine room</text>
<text x="912" y="1323" class="sub">·  because the weekend did its work</text>
<text x="912" y="1340" class="sub">·  the source is told yes</text>
<line x1="878" y1="1235.0" x2="900" y2="1235.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="1309.0" cy="1235" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1309.0" y="1240.0" class="bt s" style="fill:#1B211E" text-anchor="middle">The target is met</text>
<line x1="1156.0" y1="1235" x2="1178.0" y2="1235" class="ln" marker-end="url(#ar)"/>
<text x="1190.0" y="1306" class="sub">·  from the same demand</text>
<text x="1190.0" y="1323" class="sub">·  and the same people</text>
<text x="1190.0" y="1340" class="sub">·  with four weekend starts, not one</text>
<rect x="1520" y="1190" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="1226.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="1243.0" class="ct" text-anchor="middle" fill="#1B211E">The weekend set the week up</text>
<text x="1740.0" y="1260.0" class="ct" text-anchor="middle" fill="#1B211E">instead of setting it back.</text>
<text x="1740.0" y="1220" class="ct" text-anchor="middle" style="fill:#1E7A46;font-weight:700">ONE WEEKEND, ONE WHOLE WEEK</text>
<rect x="320" y="1455" width="1698" height="195" rx="10" fill="none" stroke="#C9CCC5" stroke-width="1.8" stroke-dasharray="8 6"/>
<text x="346" y="1491" class="pnl" text-anchor="start">WHAT THE WEEKEND GAVE THE WEEK</text>
<line x1="336" y1="1509" x2="336" y2="1525" stroke="#1E7A46" stroke-width="3"/>
<text x="336" y="1547" class="colh" text-anchor="start">1  FRIDAY</text>
<text x="336" y="1577" class="sub">·  the same three, each carrying</text>
<text x="336" y="1594" class="sub">·  a readiness state and a backup</text>
<line x1="756" y1="1509" x2="756" y2="1525" stroke="#1E7A46" stroke-width="3"/>
<text x="756" y="1547" class="colh" text-anchor="start">2  SATURDAY</text>
<text x="756" y="1577" class="sub">·  the slot is offered on by eight,</text>
<text x="756" y="1594" class="sub">·  the day stays full</text>
<line x1="1176" y1="1509" x2="1176" y2="1525" stroke="#1E7A46" stroke-width="3"/>
<text x="1176" y="1547" class="colh" text-anchor="start">3  SUNDAY</text>
<text x="1176" y="1577" class="sub">·  an eight o'clock call, the same</text>
<text x="1176" y="1594" class="sub">·  deferral, both slots reused</text>
<line x1="1596" y1="1509" x2="1596" y2="1525" stroke="#1E7A46" stroke-width="3"/>
<text x="1596" y="1547" class="colh" text-anchor="start">4  THE WEEK</text>
<text x="1596" y="1577" class="sub">·  one lands Monday, the week runs</text>
<text x="1596" y="1594" class="sub">·  as planned, the referral accepted</text>
<rect x="2060" y="1475" width="470" height="112" rx="8" fill="none" stroke="#C9CCC5" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="2080" y="1503" class="colh" text-anchor="start">LEVERS ON THIS SHEET</text>
<text x="2080" y="1527" class="sub" style="fill:#1E7A46;font-weight:700">L1</text>
<text x="2118" y="1527" class="sub">Admission Throughput, in depth</text>
<line x1="50" y1="1808" x2="2550" y2="1808" stroke="#C9CCC5" stroke-width="1.4"/>
<text x="50" y="1840" class="foot" text-anchor="start">TARGET STATE  ·  A PROPOSAL.  Eighteen months after implementation.  Drawn against the same week and the same decisions people make.</text>
<text x="2550" y="1840" class="foot" text-anchor="end">Compassus Home Health  ·  The weekend cascade</text>
</svg>
</figure>
