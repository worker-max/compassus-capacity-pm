<text x="356" y="712" class="sub">·  the same Monday start</text>

<text x="753.0" y="622.5" class="bt" style="fill:#fff" text-anchor="middle">with the budget shown</text>
<text x="634" y="678" class="sub">·  payer allowance on screen</text>
<text x="634" y="695" class="sub">·  visit floor shown for the period</text>
<text x="634" y="712" class="sub">·  shown, never enforced</text>

<text x="912" y="678" class="sub">·  unchanged</text>

<rect x="1184" y="562" width="250" height="90" rx="6" fill="#795CA7"/>

<text x="1309.0" y="622.5" class="bt" style="fill:#fff" text-anchor="middle">once, at referral</text>
<text x="1190" y="678" class="sub">·  not once per discipline</text>
<text x="1190" y="695" class="sub">·  the task burst collapses</text>
<text x="1190" y="712" class="sub">·  one approval, not eight</text>

<text x="1740.0" y="598.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="615.0" class="ct" text-anchor="middle" fill="#1B211E">Frequency set against the real</text>
<text x="1740.0" y="632.0" class="ct" text-anchor="middle" fill="#1B211E">budget and the real floor.</text>
<text x="1740" y="592" class="ct" text-anchor="middle" style="fill:#1E7A46;font-weight:700">EXPOSURE AVOIDED</text>

<text x="475.0" y="936.5" class="bt" style="fill:#fff" text-anchor="middle">Tuesday's visit</text>
<text x="356" y="992" class="sub">·  called Monday evening</text>
<text x="356" y="1009" class="sub">·  rebooked on the call</text>
<text x="356" y="1026" class="sub">·  unchanged from today</text>
<rect x="628" y="876" width="250" height="90" rx="6" fill="#795CA7"/>

<text x="753.0" y="936.5" class="bt" style="fill:#fff" text-anchor="middle">immediately</text>
<text x="634" y="992" class="sub">·  candidates ranked by drive time</text>
<text x="634" y="1009" class="sub">·  approval and discipline checked</text>
<text x="634" y="1026" class="sub">·  flexible visits identified</text>

<text x="912" y="992" class="sub">·  accepted eight minutes later</text>
<text x="912" y="1009" class="sub">·  the clinician still chooses</text>
<text x="912" y="1026" class="sub">·  nothing is assigned to them</text>
<line x1="878" y1="921.0" x2="900" y2="921.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="1309.0" cy="921" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1309.0" y="926.0" class="bt s" style="fill:#1B211E" text-anchor="middle">Visit delivered in the gap</text>
<line x1="1156.0" y1="921" x2="1178.0" y2="921" class="ln" marker-end="url(#ar)"/>
<text x="1190.0" y="992" class="sub">·  income protected</text>
<text x="1190.0" y="1009" class="sub">·  another patient seen sooner</text>
<text x="1190.0" y="1026" class="sub">·  the day holds together</text>
<rect x="1520" y="876" width="440" height="96" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="1740.0" y="912.0" class="ct" text-anchor="middle" fill="#1B211E"></text>
<text x="1740.0" y="929.0" class="ct" text-anchor="middle" fill="#1B211E">The day holds together and</text>
<text x="1740.0" y="946.0" class="ct" text-anchor="middle" fill="#1B211E">the clinician is paid.</text>
<text x="1740" y="906" class="ct" text-anchor="middle" style="fill:#1E7A46;font-weight:700">INCOME AND CAPACITY KEPT</text>
<rect x="350" y="1190" width="250" height="90" rx="6" fill="#795CA7"/>
<text x="475.0" y="1231.5" class="bt" style="fill:#fff" text-anchor="middle">Day 18: tracking</text>
<text x="475.0" y="1250.5" class="bt" style="fill:#fff" text-anchor="middle">below the floor</text>
<text x="356" y="1306" class="sub">·  twelve days still available</text>

<text x="753.0" y="1250.5" class="bt" style="fill:#fff" text-anchor="middle">visit is scheduled</text>
<text x="634" y="1306" class="sub">·  already in the plan of care</text>
<text x="634" y="1323" class="sub">·  no visit added for a number</text>
<text x="634" y="1340" class="sub">·  clinical judgment unchanged</text>

<text x="912" y="1306" class="sub">·  with its deadline attached</text>
<text x="912" y="1323" class="sub">·  not buried in a queue</text>
<text x="912" y="1340" class="sub">·  completed inside the window</text>
<line x1="878" y1="1235.0" x2="900" y2="1235.0" class="ln" marker-end="url(#ar)"/>
<ellipse cx="1309.0" cy="1235" rx="125.0" ry="45" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>

<text x="1190.0" y="1323" class="sub">·  therapy stays billable</text>

<text x="1740.0" y="1260.0" class="ct" text-anchor="middle" fill="#1B211E">therapy stays billable.</text>

<line x1="336" y1="1509" x2="336" y2="1525" stroke="#1E7A46" stroke-width="3"/>

<text x="336" y="1577" class="sub">·  released early, reassigned</text>

<text x="756" y="1577" class="sub">·  written with both in view</text>
<text x="756" y="1594" class="sub">·  at the moment of decision</text>
<line x1="1176" y1="1509" x2="1176" y2="1525" stroke="#1E7A46" stroke-width="3"/>

<text x="1176" y="1577" class="sub">·  refilled in minutes, income</text>
<text x="1176" y="1594" class="sub">·  and capacity both kept</text>
<line x1="1596" y1="1509" x2="1596" y2="1525" stroke="#1E7A46" stroke-width="3"/>

<text x="1596" y="1577" class="sub">·  both surfaced while days</text>
<text x="1596" y="1594" class="sub">·  still remained</text>
<rect x="2060" y="1495" width="470" height="110" rx="26" fill="#FFFFFF" stroke="#1B211E" stroke-width="1.8"/>
<text x="2295.0" y="1538.0" class="ct" text-anchor="middle" fill="#1B211E">A proposal.</text>
<text x="2295.0" y="1555.0" class="ct" text-anchor="middle" fill="#1B211E">Nothing on this sheet</text>
<text x="2295.0" y="1572.0" class="ct" text-anchor="middle" fill="#1B211E">is current state.</text>
<line x1="50" y1="1688" x2="2550" y2="1688" stroke="#C9CCC5" stroke-width="1.4"/>
<text x="50" y="1720" class="foot" text-anchor="start">TARGET STATE  ·  A PROPOSAL.  Eighteen months after implementation.  The patient makes the same decisions; what changes is what happens around them.</text>
<text x="2550" y="1720" class="foot" text-anchor="end">Compassus Home Health  ·  One referral, one episode</text>
